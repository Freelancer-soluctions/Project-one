# Configuración de Vale (prose linter) — change `quality-gates`
# Diseño: docs/learning/docs-changelog-validation.md (vale v3.22.0)
# MinAlertLevel en CI: error (via `npm run docs:vale`); fase 1 = advisory.
#
# StylesPath apunta a estilos versionados en el repo (.github/styles/) —
# `vale sync`/Packages remotos requieren red en CI; los estilos locales
# (Vale core + un vocabulario del proyecto) son deterministas.

StylesPath = .github/styles

MinAlertLevel = error

# Vocabulario del proyecto (acepta términos técnicos en docs/es)
Vocab = ProjectOne

[*.{md,mdx}]
# Fase 1: solo ortografía base. Reglas de estilo/tono (Google, Microsoft)
# se activan en fase 2 tras limpiar deuda de prosa (design Non-Goal:
# no reescribir docs/ para pasar de primera).
BasedOnStyles = Vale
