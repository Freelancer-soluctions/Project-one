name: 'Setup Monorepo'
description: 'Setup Node.js, install dependencies with --ignore-scripts, optionally generate the Prisma client, and cache Vitest (requires prior actions/checkout with fetch-depth: 0 in the calling job)'
inputs:
  prisma:
    description: "Run 'npx prisma generate' in apps/server (required by jobs that import @prisma/client)"
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    # `--ignore-scripts` (change `ci-quality-gates-blocking-hardening`, P0.1):
    # `npm ci` sin el flag ejecuta lifecycle scripts (`preinstall`/`postinstall`/
    # `prepare`) de cada dependencia en el runner de CI — superficie de ataque
    # innecesaria. Los jobs que necesitan el cliente Prisma lo generan
    # explícitamente con el input `prisma: 'true'`.
    - name: Install Dependencies
      run: npm ci --ignore-scripts
      shell: bash

    - name: Generate Prisma client
      if: inputs.prisma == 'true'
      run: npx prisma generate
      working-directory: apps/server
      shell: bash

    - name: Cache Vitest
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: node_modules/.cache
        key: vitest-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          vitest-${{ runner.os }}-
        exclude: node_modules/.cache/vitest
