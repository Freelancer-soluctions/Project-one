version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    # cooldown: reduce ruido — espera 7 días tras cada release antes de abrir
    # el PR (change `sca-lockfile-compliance`, capa prevención).
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "fix"
    # security-patches PRIMERO: Dependabot asigna cada paquete al primer grupo
    # que matchea — así los parches de seguridad (patch) no se mezclan con los
    # version-updates de dev-dependencies (applies-to: security-updates limita
    # el grupo a PRs de seguridad; change `sca-lockfile-compliance`).
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "patch"
      dev-dependencies:
        patterns:
          - "eslint*"
          - "prettier*"
          - "typescript*"
          - "vitest*"
          - "@testing-library*"
          - "@types*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "docker"
    directory: "/apps/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "ci"