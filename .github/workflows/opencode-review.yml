name: OpenCode AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  opencode-review:
    name: opencode-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    if: github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]' && github.event.pull_request.draft == false
    concurrency:
      group: opencode-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run OpenCode AI review
        uses: anomalyco/opencode/github@latest
        with:
          use_github_token: true
          model: groq/openai/gpt-oss-120b
          prompt: |
            Review this pull request. Focus on:
            - Code quality and maintainability
            - Bugs and edge cases
            - Security vulnerabilities
            - Performance concerns
            - Adherence to project conventions (Conventional Commits, ESLint/Prettier style, monorepo structure)

            Provide feedback as a concise bulleted list. If there are no significant issues, reply with "LGTM".
        env:
          # El input `model:` (above) setea la env var MODEL; use_github_token true exige GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # modelo free-tier de Groq (openai/gpt-oss-120b = ID real de API); reemplazar si cambia el catálogo — ver docs/CONTEXT-CICD.md §9.3.8
          OPENCODE_CONFIG_CONTENT: |
            {
              "provider": {
                "groq": {
                  "npm": "@ai-sdk/openai-compatible",
                  "name": "Groq",
                  "options": {
                    "baseURL": "https://api.groq.com/openai/v1",
                    "apiKey": "{env:GROQ_API_KEY}"
                  },
                  "models": {
                    "openai/gpt-oss-120b": { "name": "GPT-OSS 120B" }
                  }
                }
              },
              "model": "groq/openai/gpt-oss-120b"
            }
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
