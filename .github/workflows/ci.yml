  e2e:
    name: E2E Tests
    needs: repo-discovery
    if: needs.repo-discovery.outputs.e2e == 'true' || needs.repo-discovery.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    services:
      postgres:
        image: postgres:16-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: project_one_test
        options: >-
          --health-cmd "pg_isready -U test -d project_one_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - name: Prisma Migrate Deploy
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/project_one_test
        shell: bash
        working-directory: apps/server
      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright with System Dependencies
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        shell: bash
        working-directory: e2e
      - name: Run E2E Tests
        run: npx playwright test --project=chromium --output=test-results
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/project_one_test
        shell: bash
        working-directory: e2e
      - name: Report E2E Tests
        if: success() || failure()
        uses: dorny/test-reporter@v3
        with:
          name: E2E Tests
          path: e2e/reports/junit-e2e.xml
          reporter: java-junit

  zombie-workflow-guard:
    name: Zombie Workflow Guard
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Assert deleted workflows are absent
        run: |
          if test -f .github/workflows/pr-validation.yml; then
            echo "❌ Zombie workflow pr-validation.yml found"
            exit 1
          fi
          if test -f .github/workflows/lint.yml; then
            echo "❌ Zombie workflow lint.yml found"
            exit 1
          fi
          if test -f .github/workflows/formatter.yml; then
            echo "❌ Zombie workflow formatter.yml found"
            exit 1
          fi
          if test -f .github/workflows/quality.yml; then
            echo "❌ Zombie workflow quality.yml found - should have been deleted"
            exit 1
          fi
          echo "✅ All zombie workflows confirmed absent"