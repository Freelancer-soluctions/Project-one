name: 'CI'

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  merge_group: {}

concurrency:
  group: ${{ github.event_name == 'merge_group' && format('merge-group-{0}', github.event.merge_group.head_ref) || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════
  # ENTRY — Detect Changes (path-filtered)
  # ═══════════════════════════════════════════════════════════════
  repo-discovery:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
      e2e: ${{ steps.filter.outputs.e2e }}
      shared: ${{ steps.filter.outputs.shared }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # NOTE: app-token step removed — unused; paths-filter uses default GITHUB_TOKEN
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            client:
              - 'apps/client/**'
            server:
              - 'apps/server/**'
            e2e:
              - 'e2e/**'
            shared:
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              # Configs de import boundaries (dependency-cruiser): cambiarlos
              # dispara los jobs `*-import-bounds` de ambos workspaces.
              - '.dependency-cruiser.cjs'
              - 'apps/client/.dependency-cruiser.cjs'
              - 'apps/server/.dependency-cruiser.cjs'

  # ═══════════════════════════════════════════════════════════════
  # STAGE 1: PRE-COMMIT HOOKS (local — skippable via --no-verify) [SL]
  # Vive en .husky/ (pre-commit + commit-msg + pre-push) — NO en ci.yml.
  # Placeholder informativo: el pipeline empieza en local antes del PR.
  # ═══════════════════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════════════════
  # STAGE 2: PRE-BUILD — VALIDATE (source code, 0 dependencia de build)
  # ═══════════════════════════════════════════════════════════════
  # ═══════════════════════════════════════════════════════════════
  # SUBSTAGE 2A: GOVERNANCE — verify-signatures, commit-lint, pr-title-lint, dco, sast diff
  # ═══════════════════════════════════════════════════════════════
  # verify-signatures (G3) — Verifica firma de commits vía GitHub REST API
  # ════════════════════════════════════════════════════════════════
  # Required status check in ruleset 21227644 — bound by job NAME 'Verify Commit Signatures';
  # renaming name: silently breaks ruleset binding
  verify-signatures:
    name: Verify Commit Signatures
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - name: Detect event type and set SHAs
        id: detect_event
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "event_type=merge_group" >> $GITHUB_OUTPUT
            # For merge_group, use the commit SHA that triggered the workflow
            SHA="${{ github.sha }}"
            echo "single_sha=$SHA" >> $GITHUB_OUTPUT
            
          else
            echo "event_type=pull_request" >> $GITHUB_OUTPUT
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Debug PR number
        if: steps.detect_event.outputs.event_type == 'pull_request'
        run: |
          echo "PR number: ${{ steps.detect_event.outputs.pr_number }}"

      - name: Fetch PR commits via compare endpoint
        if: steps.detect_event.outputs.event_type == 'pull_request'
        id: fetch_commits
        run: |
          set -e

          # ------------------------------------------------------------
          # Signing rollout cutoff (grandfathering). Change: ci-commit-signing.
          # WHY: comparison ranges (main...feature) can drag hundreds of historical
          # commits authored BEFORE mandatory signing existed. Those commits cannot
          # be signed retroactively without rewriting history, and the main-branch
          # ruleset protects main independently of this branch. Commits authored
          # before ROLLOUT_DATE are counted as grandfathered and do NOT fail;
          # only unsigned commits dated on/after the rollout are real failures.

          # Signing rollout date: commits anteriores son grandfathered (exonerados).
          # El lote contaminado del PR #99 jamás entró a main (squash); desde el
          # rollout TODO commit nuevo debe estar firmado y verificado.
          # Configurable via repo variable (Settings → Secrets and variables →
          # Actions → Variables); el fallback inline es el valor canónico mientras
          # la variable no esté definida.
          ROLLOUT_DATE="${{ vars.SIGNING_ROLLOUT_DATE || '2026-08-01' }}"
          echo "Signing rollout cutoff (effective): $ROLLOUT_DATE"

          # R1: Scoping base..head via compare endpoint
          # Replaces pagination GET /pulls/{n}/commits with server-side range filtering
          # compare endpoint URL: base.sha...head.sha — only commits new to the PR
          # GitHub compare API limit: up to 250 commits per call (documented below)
          # https://docs.github.com/en/rest/repos/comparisons?apiVersion=2022-11-28#get-a-repository-comparison
          COMPARE_URL="https://api.github.com/repos/${{ github.repository }}/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${{ github.token }}" "$COMPARE_URL")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')

          # HTTP status check
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: HTTP status $HTTP_CODE comparing base..head" >&2
            echo "found_shas=" >> $GITHUB_OUTPUT
            > ok_shas.txt
            > failed_shas.txt
            > grandfathered_shas.txt
            exit 0
          fi

          # Extract commit count from compare response
          # NOTE: REST compare API returns top-level "commits" — there is NO ".data" wrapper
          # (that convention only exists in GraphQL). jq null|length=0 silently otherwise.
          COMMIT_COUNT=$(echo "$RESPONSE_BODY" | jq '.commits | length')

          # Initialize output files
          > ok_shas.txt
          > failed_shas.txt
          > grandfathered_shas.txt

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "ERROR: 0 commits in base..head range on pull_request event — this indicates a broken data pipeline (empty evaluation must NOT pass silently)" >&2
            echo "found_shas=0" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "Evaluating $COMMIT_COUNT new commits from PR (base..head)" >&2

          # Process each commit from compare endpoint
          # Null tolerance: use // false defaults; only .verification.verified == true counts as verified
          # Filtros jq no deben crashear con verification null (requisito C)
          echo "$RESPONSE_BODY" | jq -r '.commits[] | .sha' | while read -r SHA; do
            # Only .verification.verified == true counts as verified
            # // false treats null/undefined as not verified without crashing
            # REST API nests verification under .commit (top-level .verification does not exist)
            COMMIT_JSON=$(echo "$RESPONSE_BODY" | jq -c --arg s "$SHA" '.commits[] | select(.sha == $s)')
            VERIFIED=$(echo "$COMMIT_JSON" | jq -r '.commit.verification.verified // false')
            # Author date in ISO 8601 (e.g. 2026-07-15T10:30:00Z)
            AUTHOR_DATE=$(echo "$COMMIT_JSON" | jq -r '.commit.author.date')

            # Grandfathering cutoff: lexicographic compare is valid for ISO 8601 dates
            if [[ "$AUTHOR_DATE" < "$ROLLOUT_DATE" ]]; then
              # Historical commit predating signing rollout: grandfathered, NOT a failure
              echo "SKIP (grandfathered, $AUTHOR_DATE): $SHA" >&2
              echo "$SHA" >> grandfathered_shas.txt
              continue
            fi

            if [ "$VERIFIED" = "true" ]; then
              echo "$SHA" >> ok_shas.txt
            else
              echo "$SHA" >> failed_shas.txt
            fi
          done

          # Tolerate GitHub signature-verification propagation delay (~30s post-push)
          sleep 30

          # Anti-stale retry: for each SHA marked not verified, do individual check
          # Max 5 individual retries per run (fallidos bulk adicionales van a failed_shas con nota en summary)
          ANTI_STALE_RECOVERED=""
          RETRY_COUNT=0
          MAX_RETRIES=5

          if [ -f failed_shas.txt ] && [ "$(cat failed_shas.txt)" != "" ]; then
            FAILED_SHAS=$(cat failed_shas.txt)
            for SHA in $FAILED_SHAS; do
              if [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; then
                echo "Anti-stale: skipping remaining individual retries (limit $MAX_RETRIES reached)" >&2
                break
              fi

              # Individual check with null tolerance (.verification.verified // false)
              # Solo si individual TAMBIÉN false → evaluar grandfathering antes de fallar
              INDIVIDUAL=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/${{ github.repository }}/commits/$SHA")
              # Schema note: GET /commits/{sha} nests under .commit.verification; tolerate legacy flat layout too
              VERIFIED=$(echo "$INDIVIDUAL" | jq -r '.commit.verification.verified // .verification.verified // false')
              # Anti-stale parity: extraer AUTHOR_DATE del payload individual y aplicar
              # la MISMA guardia de cutoff que el bulk path. Sin esta guardia, commits
              # pre-rollout que llegan al retry quedan en failed_shas.txt
              # (ref bug: run 32661559666, SHAs 4d1953c7/890cdc2a/110292707b/7ec00546).
              AUTHOR_DATE=$(echo "$INDIVIDUAL" | jq -r '.commit.author.date // ""')

              if [ "$VERIFIED" = "true" ]; then
                # Recovered! Move from failed to ok
                echo "$SHA" >> ok_shas.txt
                # Remove from failed_shas.txt
                grep -v "^${SHA}$" failed_shas.txt > failed_shas_tmp.txt 2>/dev/null || true
                mv failed_shas_tmp.txt failed_shas.txt
                ANTI_STALE_RECOVERED="$ANTI_STALE_RECOVERED $SHA"
                echo "Anti-stale: recovered $SHA via individual check" >&2
              elif [[ -n "$AUTHOR_DATE" && "$AUTHOR_DATE" < "$ROLLOUT_DATE" ]]; then
                # Commit pre-rollout sin firma tras retry individual: grandfathered,
                # NO es fallo. Remover de failed_shas y registrar en grandfathered_shas.txt.
                echo "SKIP (grandfathered via anti-stale, $AUTHOR_DATE): $SHA" >&2
                grep -v "^${SHA}$" failed_shas.txt > failed_shas_tmp.txt 2>/dev/null || true
                mv failed_shas_tmp.txt failed_shas.txt
                echo "$SHA" >> grandfathered_shas.txt
              else
                echo "Anti-stale: individual check for $SHA also unverified" >&2
              fi

              RETRY_COUNT=$((RETRY_COUNT + 1))
            done
          fi

          # Generate summary values
          OK_COUNT=$( [ -f ok_shas.txt ] && [ "$(cat ok_shas.txt)" != "" ] && wc -l < ok_shas.txt || echo "0" )
          FAILED_COUNT=$( [ -f failed_shas.txt ] && [ "$(cat failed_shas.txt)" != "" ] && wc -l < failed_shas.txt || echo "0" )
          ANTI_STALE_COUNT=$(echo "$ANTI_STALE_RECOVERED" | xargs -r echo | wc -w)
          GRANDFATHERED_COUNT=$( [ -f grandfathered_shas.txt ] && [ "$(cat grandfathered_shas.txt)" != "" ] && wc -l < grandfathered_shas.txt || echo "0" )
          EXCLUDED_COUNT=0  # By scoping, compare endpoint only returns new PR commits (base..head)

          found_shas=$((OK_COUNT + FAILED_COUNT + ANTI_STALE_COUNT + GRANDFATHERED_COUNT))
          echo "found_shas=$found_shas" >> $GITHUB_OUTPUT
          echo "ok_shas_count=$OK_COUNT" >> $GITHUB_OUTPUT
          echo "failed_shas_count=$FAILED_COUNT" >> $GITHUB_OUTPUT
          echo "anti_stale_recovered=$ANTI_STALE_COUNT" >> $GITHUB_OUTPUT
          echo "grandfathered_count=$GRANDFATHERED_COUNT" >> $GITHUB_OUTPUT
          echo "excluded_by_scoping=$EXCLUDED_COUNT" >> $GITHUB_OUTPUT

          echo "Commit verification summary:" >&2
          echo "  New commits from PR evaluated: $((OK_COUNT + FAILED_COUNT + GRANDFATHERED_COUNT))" >&2
          echo "  Verified: $OK_COUNT | Grandfathered: $GRANDFATHERED_COUNT | Unverified: $FAILED_COUNT" >&2
          echo "  Excluded by scoping (base..head): $EXCLUDED_COUNT (handled by compare endpoint)" >&2
          echo "  Recovered by anti-stale retry: $ANTI_STALE_COUNT" >&2
        timeout-minutes: 10

      - name: Fetch single commit verification (merge_group fallback)
        if: steps.detect_event.outputs.event_type == 'merge_group'
        run: |
          SHA="${{ steps.detect_event.outputs.single_sha }}"
          # REST API nests verification under .commit — top-level .verification does not exist
          VERIFIED=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/$SHA" | jq -r '.commit.verification.verified // false')
          if [ "$VERIFIED" = "true" ]; then
            echo "$SHA" >> ok_shas.txt
          else
            echo "$SHA" >> failed_shas.txt
          fi

      - name: Check verification results
        id: verify_results
        run: |
          FAILED_SHAS=""
          if [ -f failed_shas.txt ] && [ "$(cat failed_shas.txt)" != "" ]; then
            FAILED_SHAS=$(cat failed_shas.txt)
          fi
          if [ -n "$FAILED_SHAS" ]; then
            echo "failed=true" >> $GITHUB_OUTPUT
            # Multiline output requires heredoc delimiter format; plain
            # key=value with embedded newlines crashes the runner with
            # "Unable to process file command 'output'" (Invalid format '<sha>')
            {
              echo "failed_shas<<EOF"
              echo "$FAILED_SHAS"
              echo "EOF"
            } >> $GITHUB_OUTPUT
            exit 1
          else
            echo "failed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
        timeout-minutes: 10
      - name: Informative report (non-blocking)
        if: always()
        run: |
          echo "=== Commit Verification Report ==="
          if [ -f ok_shas.txt ]; then
            echo "Verified commits:"
            cat ok_shas.txt
          fi
          if [ -f failed_shas.txt ]; then
            echo "Non-verified commits:"
            cat failed_shas.txt
          fi
          if [ -f grandfathered_shas.txt ] && [ "$(cat grandfathered_shas.txt)" != "" ]; then
            echo "Grandfathered commits (pre-rollout cutoff, skipped):"
            cat grandfathered_shas.txt
          fi
          echo "=== End Report ==="
        timeout-minutes: 5
    # Job-level continue-on-error for non-blocking mode
    # (removed — signature verification failures must propagate to ruleset 21227644)
  commit-lint:
    name: Commit Lint (Conventional Commits)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Guard - fail on empty PR commit range
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          COUNT=$(git rev-list --count "$BASE_SHA".."$HEAD_SHA")
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No commits to validate between base and head"
            exit 1
          fi
      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Lint squash commit (merge queue)
        if: github.event_name == 'merge_group'
        run: npx commitlint --last --verbose
  pr-title-lint:
    name: PR Title Lint
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # PR events: validate PR title against Conventional Commits
      - name: Lint PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            ops
          requireScope: false
          ignoreLabels: |
            bot
            ignore-semantic-pull-request
          subjectPattern: '^(?![A-Z]).+$'
          subjectPatternError: 'PR title must follow Conventional Commits format: type(scope): description with lowercase subject'
      # Merge queue: squash commit title already validated by commitlint --last
      - name: Skip on merge_group (covered by commitlint)
        if: github.event_name == 'merge_group'
        run: echo "✅ Merge queue — squash commit title validated by commitlint"
    # Phase 1: non-blocking. Remove after team adjusts (1 sprint).
    # continue-on-error: true
  dco:
    name: DCO
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # PR events: validate Signed-off-by on all commits
      - name: DCO sign-off check
        if: github.event_name == 'pull_request'
        uses: KineticCafe/actions-dco@v3.2.0
        with:
          config: |
            [bot]
            policy = "well-known"
            categories = ["dependency-updaters"]
      # Merge queue: DCO is a PR-level check; squash commit doesn't carry individual trailers
      - name: Skip on merge_group (PR-level check)
        if: github.event_name == 'merge_group'
        run: echo "✅ Merge queue — DCO validated at PR level"
    # Phase 1: non-blocking. Remove after team adjusts (1 sprint).
    # continue-on-error: true
  # --- GOVERNANCE: SAST early-abort gate (diff-scoped, standalone) ---
  sast:
    name: 'Governance: SAST (Semgrep)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run Semgrep SAST scan
        run: docker run --rm -v ${{ github.workspace }}:/src semgrep/semgrep:1.176.1 semgrep scan --baseline-commit ${{ github.event.pull_request.base.sha }} --config .semgrep/rules --config p/owasp-top-ten --config p/security-audit --config p/secrets --config p/nodejs --config p/expressjs --config p/sql-injection --config p/command-injection --config p/react --config p/xss --exclude node_modules --exclude dist --exclude build --exclude coverage --exclude .env --exclude '*.min.js' --exclude prisma/generated --exclude e2e --severity ERROR --error --metrics off
    # NOT in ci-complete.needs — SAST is a standalone gate, not coupled to CI_MINIMAL

  # ═══════════════════════════════════════════════════════════════
  # SUBSTAGE 2B: CODE QUALITY — lint, format-check, typecheck, complexity, dead-code, import-bounds, e2e-lint, openspec-validate, docs-validation (advisory)
  # ═══════════════════════════════════════════════════════════════
  # --- Client Pre-Build ---
  client-lint:
    if: needs.repo-discovery.outputs.client == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Client Lint'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - run: npm run lint --workspace=apps/client
  client-format-check:
    if: needs.repo-discovery.outputs.client == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Client Format'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - run: npm run format:check --workspace=apps/client
  client-typecheck:
    if: needs.repo-discovery.outputs.client == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Client TypeCheck'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      # Gate blocking real (change `quality-gates`): sin `|| echo` ni
      # `2>/dev/null` que enmascaren el exit code — un error de compilación
      # falla el job. El client es 100% JS: compila vía tsconfig base
      # (allowJs + checkJs off); flags strict llegan con server-typescript-migration (Fase 4).
      - name: TypeCheck
        run: npx tsc --noEmit
        working-directory: apps/client

  client-complexity:
    if: needs.repo-discovery.outputs.client == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Client Complexity'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      # Gate blocking (change `quality-gates`): sin `--rule` CLI override —
      # los umbrales vienen de eslint.config.js (15 core / 10 utils / off tests).
      - name: Check complexity
        run: npx eslint "src/**/*.{js,jsx}"
        working-directory: apps/client

  client-dead-code:
    if: needs.repo-discovery.outputs.client == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Client Dead Code'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - name: Detect dead code
        # DESDE LA RAÍZ (sin working-directory): el selector --workspace de knip
        # se resuelve relativo al cwd (con cwd=apps/client buscaría
        # apps/client/apps/client → exit 2), y correr desde el workspace eludiría
        # la config raíz knip.jsonc. Selector explícito por workspace.
        run: npx knip --workspace=apps/client --no-progress --reporter json

  client-import-bounds:
    if: needs.repo-discovery.outputs.client == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Client Import Bounds'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      # Gate: corre desde la RAÍZ (config raíz + regex `^apps/...`);
      # --ignore-known respeta el baseline (.dependency-cruiser-known-violations.json).
      - name: Check import boundaries (gate)
        run: npm run depcruise:client -- --output-type err --ignore-known
      # Report no-blocking del grafo combinado (siempre corre, exit code
      # ignorado aquí): el HTML queda como artefacto para inspección del grafo.
      - name: Import boundaries report (no-blocking)
        if: always()
        run: npm run depcruise:report
        continue-on-error: true
      - name: Upload dependency-cruiser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-cruiser-report-client
          path: reports/dependency-cruiser.html
          if-no-files-found: warn
          retention-days: 7

  # --- Server Pre-Build ---
  server-lint:
    if: needs.repo-discovery.outputs.server == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Server Lint'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - run: npm run lint --workspace=apps/server

  # FASE 1 (diferido): server aún no pasa `npm run format:check` limpio.
  # FASE 2: re-activar (`if: true`) cuando el workspace server pase el check —
  # misma convención FASE 1/FASE 2 del bloque Security.
  server-format-check:
    if: false
    name: 'Quality: Server Format'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - run: npm run format:check --workspace=apps/server

  server-typecheck:
    if: needs.repo-discovery.outputs.server == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Server TypeCheck'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      # Gate blocking real (change `quality-gates`): `tsc --noEmit -p apps/server`
      # contra apps/server/tsconfig.json (allowJs, checkJs off — código 100% JS;
      # flags strict vía server-typescript-migration Fase 4). Sin `|| echo` que enmascare.
      # Corrección 2026-09-29: `npx tsc --noEmit` con working-directory (patrón
      # client-typecheck) — `npm run type-check` fallaba porque ese script vive
      # solo en el manifest RAÍZ, no en apps/server (Missing script: "type-check").
      - name: TypeCheck
        run: npx tsc --noEmit
        working-directory: apps/server

  server-complexity:
    if: needs.repo-discovery.outputs.server == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Server Complexity'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      # Gate blocking (change `quality-gates`): sin `--rule` CLI override —
      # umbrales desde eslint.config.js (15 core / 10 utils / off tests).
      - name: Check complexity
        run: npx eslint "src/**/*.js"
        working-directory: apps/server

  server-dead-code:
    if: needs.repo-discovery.outputs.server == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Server Dead Code'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - name: Detect dead code
        # DESDE LA RAÍZ (mismo motivo que client-dead-code): knip lee la config
        # raíz knip.jsonc (con los falsos positivos justificados en ignoreIssues)
        # y el selector se resuelve correctamente.
        run: npx knip --workspace=apps/server --no-progress

  server-import-bounds:
    if: needs.repo-discovery.outputs.server == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Server Import Bounds'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      # Activado por change `import-boundaries` (antes `if: false`). Gate desde
      # la RAÍZ con config raíz (regex `^apps/...`) + baseline --ignore-known.
      - name: Check import boundaries (gate)
        run: npm run depcruise:server -- --output-type err --ignore-known
      - name: Import boundaries report (no-blocking)
        if: always()
        run: npm run depcruise:report
        continue-on-error: true
      - name: Upload dependency-cruiser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-cruiser-report-server
          path: reports/dependency-cruiser.html
          if-no-files-found: warn
          retention-days: 7

  # --- E2E Pre-Build ---
  # Lint estático del workspace e2e (sin navegador): specs, page objects y
  # playwright.config.js. Mismo patrón que client-lint/server-lint; el umbral
  # de complejidad de e2e/tests/** es 'off' vía bloque de tests de la config.
  e2e-lint:
    if: needs.repo-discovery.outputs.e2e == 'true' && github.event_name == 'pull_request'
    name: 'Quality: E2E Lint'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - run: npm run lint --workspace=e2e

  # --- Shared Pre-Build ---
  # Guard de higiene del manifest raíz (change `root-manifest-cleanup`, spec
  # `root-manifest-hygiene`): falla si `dependencies` del raíz contiene entradas
  # no declaradas como requisitos directos (workspaces/devDeps raíz) ni en la
  # allowlist versionada de scripts/check-root-manifest.mjs. Blocking en PR
  # que toque el manifest raíz (outputs.shared). Sin red, en segundos.
  root-manifest-guard:
    if: needs.repo-discovery.outputs.shared == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Root Manifest Guard'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate root manifest inventory
        run: node scripts/check-root-manifest.mjs

  # --- Specs Pre-Build ---
  # Validación estructural de las specs canónicas de OpenSpec (openspec/specs/**).
  # `--specs` valida SOLO main specs; los deltas de changes/ activos se validan
  # aparte. `--strict` convierte warnings en errores. Mismo patrón que
  # openspec-validate: barato, sin dependencia de paths-filter (openspec/ no
  # está en los filtros de repo-discovery) y sin needs: no consume outputs de
  # repo-discovery, así que corre desde t=0 del workflow en paralelo.
  openspec-validate:
    if: github.event_name == 'pull_request'
    name: 'Quality: OpenSpec Validate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - name: Validate OpenSpec main specs (strict)
        run: npx openspec validate --specs --strict

  # change ci-security-substage-alignment (2026-09-30): reubicado a 2B quality (D8) — job quality que quedó al cierre del stage 2
  # Job advisory de validación de documentación (change `quality-gates`, fase 1):
  # markdownlint (estructura) + publication de reporte. NO entra en
  # `prebuild-quality-complete.needs` — un hallazgo de docs NO bloquea el PR;
  # el reporte debe sobrevivir (`if: always()`) aunque el job "falle".
  # Fase 2 (bloqueante) queda fuera de este change hasta que docs/ pase limpio.
  docs-validation:
    if: github.event_name == 'pull_request'
    name: 'Quality: Docs Validation (advisory)'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo
      - name: Lint markdown structure (markdownlint)
        run: npm run docs:lint
      - name: Publish docs lint summary
        if: always()
        run: |
          COUNT=$(npx markdownlint "docs/**/*.md" "docs/*.md" 2>/dev/null | wc -l || echo 0)
          echo "## Docs Validation (advisory, fase 1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "markdownlint violations: ${COUNT##* } (fase 1: NO bloquea el PR)" >> $GITHUB_STEP_SUMMARY
          echo "Config: .markdownlint.json (JSON estricto) + .markdownlintignore (grandfathering del inventario legacy, 2026-09-29) · vale fase 2 (ver docs/learning/docs-changelog-validation.md)" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════
  # SUBSTAGE 2D: UNIT TESTING — test-unit-client, test-unit-server, test-integration, test-smoke
  # FASE 1 advisory (continue-on-error: reporta sin bloquear) → FASE 2 blocking al
  # cerrar la ventana de calibración (2-4 semanas; docs/learning/quality-gates.md en lockstep).
  # Coverage: client-coverage/server-coverage se scopean por propagación de skip de su
  # test job (needs), NO vía repo-discovery — ci-runtime-config-hygiene prohíbe needs
  # sin consumo de outputs.
  # ═══════════════════════════════════════════════════════════════
  # --- TESTING (pre-build): unit tests, source-level, no artifact needed ---
  test-unit-client:
    # FASE 1 advisory: continue-on-error reporta (log + JUnit + artifacts) sin bloquear
    # el agregador (actions/toolkit#581). FASE 2: quitar el flag tras la calibración.
    if: (needs.repo-discovery.outputs.client == 'true' || needs.repo-discovery.outputs.shared == 'true') && github.event_name == 'pull_request'
    continue-on-error: true
    name: 'Tests: Unit - Client'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo

      # TIA — spec ci-test-impact-analysis (D7). Diff-scoped cuando el diff
      # contra origin/main resuelve; suite completa cuando `shared == 'true'`
      # (lockfile, workflows, raíz) o cuando origin/main NO es resoluble
      # (fallback a suite completa: nunca "0 tests afectados" en silencio).
      - name: Resolve TIA scope (diff-scoped vs full suite)
        id: tia
        run: |
          if [ "${{ needs.repo-discovery.outputs.shared }}" = "true" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "::notice::shared path changed (root manifest, lockfile or workflows) — running the FULL client suite."
          elif git rev-parse --verify --quiet origin/main > /dev/null; then
            echo "scope=changed" >> "$GITHUB_OUTPUT"
            echo "::notice::origin/main resolved — running the diff-scoped client suite."
          else
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "::warning::origin/main is NOT resolvable in this checkout; falling back to the FULL suite (never reporting '0 affected tests')."
          fi
        shell: bash

      # Exclusiones de cuarentena — spec ci-flaky-quarantine (D9, task 5.2).
      # Derivadas EXCLUSIVAMENTE de .github/flaky-quarantine.yml (nada de
      # test.skip ni markers en la fuente). Vacío = ningún exclude.
      - name: Derive quarantine exclusions
        id: quarantine
        run: echo "args=$(node scripts/ci/quarantine-exclude.mjs --format=argv)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Report quarantine exclusions in the run
        if: always()
        run: node scripts/ci/quarantine-exclude.mjs --format=md >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Run Client Unit Tests (TIA / full suite)
        run: |
          mkdir -p apps/client/reports
          echo "scope=${{ steps.tia.outputs.scope }}" > apps/client/reports/tia-scope.txt
          if [ "${{ steps.tia.outputs.scope }}" = "changed" ]; then
            npm run test:changed:ci --workspace=apps/client -- ${{ steps.quarantine.outputs.args }}
            # Guard D7: un diff válido puede no tener NINGÚN test relacionado, y con
            # passWithNoTests (default en Vitest 4) eso sale "No test files found"
            # con exit 0 — un verde VACÍO que el agregador contaría como tests
            # ejecutados. Si la corrida no ejecutó ningún test, se cae a suite
            # completa en vez de fingir cobertura.
            RAN=$(node -p "require('./apps/client/reports/vitest-results.json').numTotalTests" 2> /dev/null || echo 0)
            if [ "${RAN:-0}" -eq 0 ]; then
              echo "::warning::TIA matched 0 tests for this diff (numTotalTests=${RAN:-0}); running the FULL client suite instead of reporting a vacuous green."
              echo "scope=full" > apps/client/reports/tia-scope.txt
              npm run test:coverage:ci --workspace=apps/client -- ${{ steps.quarantine.outputs.args }}
            fi
          else
            npm run test:coverage:ci --workspace=apps/client -- ${{ steps.quarantine.outputs.args }}
          fi
        shell: bash

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-client
          path: apps/client/coverage/
          if-no-files-found: warn
      # Evidencia de flakiness (retryCount/flaky por test) para la métrica
      # semanal — D8. El JUnit colapsa los retries, por eso este artifact.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flaky-evidence-client
          path: |
            apps/client/reports/junit.xml
            apps/client/reports/vitest-results.json
            apps/client/reports/flaky-retries.json
            apps/client/reports/tia-scope.txt
          retention-days: 30
          if-no-files-found: warn
      - name: Report Client Unit Tests
        if: success() || failure()
        uses: dorny/test-reporter@v3
        with:
          name: Client Unit Tests
          path: apps/client/reports/junit.xml
          reporter: java-junit

  test-unit-server:
    # FASE 1 advisory; suite unit-scoped (*.unit.test.js, sin PostgreSQL) con junit
    # para dorny/test-reporter. FASE 2: quitar continue-on-error tras la calibración.
    if: (needs.repo-discovery.outputs.server == 'true' || needs.repo-discovery.outputs.shared == 'true') && github.event_name == 'pull_request'
    continue-on-error: true
    name: 'Tests: Unit - Server'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo

      # TIA — spec ci-test-impact-analysis (D7). Misma política que el job client:
      # diff-scoped si origin/main resuelve, suite completa si `shared == 'true'`
      # o si la base no es resoluble (fallback ruidoso, nunca "0 tests afectados").
      - name: Resolve TIA scope (diff-scoped vs full suite)
        id: tia
        run: |
          if [ "${{ needs.repo-discovery.outputs.shared }}" = "true" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "::notice::shared path changed (root manifest, lockfile or workflows) — running the FULL server suite."
          elif git rev-parse --verify --quiet origin/main > /dev/null; then
            echo "scope=changed" >> "$GITHUB_OUTPUT"
            echo "::notice::origin/main resolved — running the diff-scoped server suite."
          else
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "::warning::origin/main is NOT resolvable in this checkout; falling back to the FULL suite (never reporting '0 affected tests')."
          fi
        shell: bash

      # Exclusiones de cuarentena — spec ci-flaky-quarantine (D9, task 5.2).
      - name: Derive quarantine exclusions
        id: quarantine
        run: echo "args=$(node scripts/ci/quarantine-exclude.mjs --format=argv)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Report quarantine exclusions in the run
        if: always()
        run: node scripts/ci/quarantine-exclude.mjs --format=md >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Run Server Unit Tests (TIA / full suite)
        run: |
          mkdir -p apps/server/reports
          echo "scope=${{ steps.tia.outputs.scope }}" > apps/server/reports/tia-scope.txt
          if [ "${{ steps.tia.outputs.scope }}" = "changed" ]; then
            npm run test:changed:ci --workspace=apps/server -- ${{ steps.quarantine.outputs.args }}
            # Guard D7: ver la nota del job client. Con passWithNoTests un diff sin
            # tests relacionados sale verde vacío; aquí se cae a la suite unit
            # completa y el scope se corrige a `full` para que D18 aplique umbral.
            RAN=$(node -p "require('./apps/server/reports/vitest-results.json').numTotalTests" 2> /dev/null || echo 0)
            if [ "${RAN:-0}" -eq 0 ]; then
              echo "::warning::TIA matched 0 tests for this diff (numTotalTests=${RAN:-0}); running the FULL server suite instead of reporting a vacuous green."
              echo "scope=full" > apps/server/reports/tia-scope.txt
              npm run test:coverage:unit:ci --workspace=apps/server -- ${{ steps.quarantine.outputs.args }}
            fi
          else
            npm run test:coverage:unit:ci --workspace=apps/server -- ${{ steps.quarantine.outputs.args }}
          fi
        shell: bash

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-server
          path: apps/server/tests/coverage/
          if-no-files-found: warn
      # Evidencia de flakiness (retryCount/flaky por test) para la métrica
      # semanal — D8. El JUnit colapsa los retries, por eso este artifact.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flaky-evidence-server
          path: |
            apps/server/reports/junit.xml
            apps/server/reports/vitest-results.json
            apps/server/reports/flaky-retries.json
            apps/server/reports/tia-scope.txt
          retention-days: 30
          if-no-files-found: warn
      - name: Report Server Unit Tests
        if: success() || failure()
        uses: dorny/test-reporter@v3
        with:
          name: Server Unit Tests
          path: apps/server/reports/junit.xml
          reporter: java-junit

  # ═══════════════════════════════════════════════════════════════
  # SUBSTAGE 2C: SECURITY — dependency-review, secrets, scancode-license-pr-diff, lockfile-audit, checkov-iac, containerfile-lint, actionlint-advisory, zizmor-advisory, typosquat-guarddog
  # (bloqueantes en needs del agregador: dependency-review, secrets, scancode-license-pr-diff · advisory FASE 1: el resto)
  # (sast es 2A GOVERNANCE standalone, no 2C — ver header 2A; change ci-security-substage-alignment 2026-09-30)
  # ═══════════════════════════════════════════════════════════════
  # ════════════════════════════════════════════════════════════════
  # SECURITY — Dependency Review (inline so ci-complete.needs resolves)
  # ════════════════════════════════════════════════════════════════
  dependency-review:
    name: 'Security: Dependency Review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Run dependency review
        uses: actions/dependency-review-action@v5
        with:
          # Fail on new vulnerabilities with severity >= moderate (governance intent)
          fail-on-severity: moderate
          # Allow specific vulnerabilities if needed (empty by default)
          allow-ghsas: ''
          # Security intent: vulnerability + license checks
          vulnerability-check: true
          license-check: true
          # License policy: externalizada en `.github/license-policy.yml` (fuente
          # única ejecutable, consumida también por scancode-license-pr-diff vía
          # lectura directa). La clave inline `deny-licenses` estaba deprecated
          # por la acción (issue #938). NOTE: allow-licenses es la alternativa
          # allow-list más estricta y MUTUAMENTE EXCLUYENTE con deny-licenses.
          # SPDX-only: toda entrada debe ser identificador SPDX válido — la
          # acción valida la config al arranque (validateLicenses →
          # spdx-expression-parse) y falla antes de escanear dependencias.
          # npm-custom/private licenses surface como `Other`/`NOASSERTION`, que
          # una deny-list no puede matchear — las cubre la capa ScanCode
          # PR-diff (scancode-license-pr-diff). Validado localmente: ningún
          # paquete del árbol actual porta estas licencias (ver
          # docs/learning/dependency-review.md §4.2).
          # Política narrativa (deny-list, waivers, fail-on-scopes):
          # docs/learning/license-policy.md (change license-compliance)
          config-file: .github/license-policy.yml
          # Publish the findings summary as a PR comment when the gate fails,
          # exercising the already-declared pull-requests: write permission.
          # on-failure keeps green PRs clean; on fork PRs the comment may fail
          # (accepted: the job still fails on findings, see design Risks).
          comment-summary-in-pr: on-failure
          # fail-on-scopes decision (task 4.1): default `runtime` KEPT for now —
          # devDependencies here are build/test tooling, and enabling `development`
          # without a test PR risks blocking tooling-update PRs. Revisit after a
          # controlled PR test (docs/learning/dependency-review.md §4).
          # fail-on-scopes: runtime, development
    # Job-level continue-on-error: false (default) — failures block the check

  secrets:
    name: 'Security: Secret Detection'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: read
    env:
      GIT_LEAKS: ${{ secrets.GIT_LEAKS }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan PR diff for secrets (Gitleaks OSS)
        uses: docker://zricethezav/gitleaks:v8.30.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: git --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --redact --verbose
      - name: Scan for secrets (licensed action - optional)
        if: ${{ env.GIT_LEAKS != '' }}
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_LICENSE: ${{ secrets.GIT_LEAKS }}
          # gitleaks-action v3 exige GITHUB_TOKEN para escanear pull requests
          # (breaking change anunciado en su README)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Warn: licensed Gitleaks scan unavailable'
        if: ${{ env.GIT_LEAKS == '' }}
        run: echo "::warning::GIT_LEAKS secret not configured - licensed Gitleaks scan skipped. Using open-source Gitleaks only."

  # Job PR-diff de licencias por archivo (change `license-compliance`, capa L2b,
  # dual job con el audit semanal — D4 del design): ScanCode 32.5.0 sobre los
  # archivos ACMR (Added/Copied/Modified/Renamed) del diff del PR — cierra el gap
  # de `dependency-review`, que solo evalúa manifiestos/lockfiles. FASE 1
  # advisory: `continue-on-error: true` a nivel job → `prebuild-security-complete`
  # ve needs.*.result = success (actions/toolkit#581, mismo patrón que dead-code)
  # y el PR no se bloquea; la evidencia es el artifact `pr-license-report.json`
  # (retención 14d ≠ 90d del audit semanal). FASE 2 (blocking gradual): remover
  # `continue-on-error` de este job y actualizar `docs/learning/quality-gates.md`
  # + `docs/learning/license-policy.md` tras 2-4 semanas de runs limpios con
  # hallazgos triados. Deny-list única: se lee en runtime de la fuente de
  # verdad ejecutable `.github/license-policy.yml` (fuente canónica:
  # docs/learning/license-policy.md) — sin duplicar la lista aquí ni scrape
  # del workflow; dependency-review la consume vía `config-file`.
  # `LicenseRef-scancode-unknown*` = warning permanente (nunca bloquea, ni en
  # FASE 2). Sin `scan-list.txt` estático: la lista vive en el diff. El scan
  # corre sobre una copia de los archivos del diff (scope) → node_modules/dist/
  # build/coverage/.git quedan fuera estructuralmente; `*.min.js` se excluye
  # por paridad con el audit semanal.
  scancode-license-pr-diff:
    if: github.event_name == 'pull_request'
    name: 'Security: ScanCode License PR-Diff (advisory, FASE 1)'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: List changed files (ACMR vs base)
        id: diff
        run: |
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > pr-diff-files.txt
          echo "Changed files (ACMR): $(wc -l < pr-diff-files.txt | tr -d ' ')"

      - name: ScanCode license scan of changed files
        id: scan-json
        continue-on-error: true
        run: |
          mkdir -p scancode-scope
          while IFS= read -r f; do
            if [ -f "$f" ]; then
              mkdir -p "scancode-scope/$(dirname "$f")"
              cp "$f" "scancode-scope/$f"
            fi
          done < pr-diff-files.txt
          if [ -z "$(ls -A scancode-scope 2>/dev/null)" ]; then
            echo "No scannable files in the ACMR diff (all deleted). Writing empty report."
            echo '{"files": []}' > scancode-scope/pr-license-report.json
            exit 0
          fi
          docker run --rm -v "$PWD/scancode-scope:/project" aboutcode/scancode-toolkit:32.5.0 \
            scancode --license --copyright --only-findings \
            --exclude '*.min.js' \
            --json-pp /project/pr-license-report.json /project

      - name: Evaluate licenses against unified deny-list (FASE 1 advisory)
        run: |
          REPORT=scancode-scope/pr-license-report.json
          if [ ! -f "$REPORT" ]; then
            echo "Report not produced (see scan step outcome); nothing to evaluate."
            exit 0
          fi
          # Deny-list única: leída de la fuente de verdad ejecutable
          # .github/license-policy.yml (la misma que consume dependency-review
          # vía config-file). Sin scrape del YAML del workflow.
          DENY_LIST=$(DENY_POLICY=".github/license-policy.yml" node -e '
            const fs = require("fs");
            const src = fs.readFileSync(process.env.DENY_POLICY, "utf8");
            const lines = src.split(/\r?\n/);
            const start = lines.findIndex((l) => /^deny-licenses:\s*$/.test(l));
            if (start === -1) { console.error("deny-licenses key not found"); process.exit(1); }
            const items = [];
            for (let i = start + 1; i < lines.length; i++) {
              const l = lines[i];
              if (/^\s*-/.test(l)) items.push(l.replace(/^\s*-\s*/, "").trim());
              else if (l.trim() === "" || l.trim().startsWith("#")) continue;
              else break;
            }
            if (items.length === 0) { console.error("deny-licenses empty"); process.exit(1); }
            console.log(items.join(", "));
          ')
          if [ -z "$DENY_LIST" ]; then
            echo "::error::deny-licenses not parseable from .github/license-policy.yml"
            exit 1
          fi
          DENY_LIST="$DENY_LIST" REPORT_PATH="$REPORT" node -e "
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'));
            const denyList = process.env.DENY_LIST.split(',').map((s) => s.trim()).filter(Boolean);
            const denySet = new Set(denyList);
            const normalize = (k) => k.split('-or-later')[0].split('-only')[0];
            const unknownRe = /^LicenseRef-scancode-unknown/;
            const violations = [];
            const warnings = [];
            for (const f of r.files || []) {
              for (const l of f.licenses || []) {
                const k = l.spdx_license_key || l.key || 'unknown';
                if (unknownRe.test(k)) warnings.push(k + ' @ ' + f.path);
                else if (denySet.has(normalize(k))) violations.push(k + ' @ ' + f.path);
              }
            }
            console.log('Deny-list (from .github/license-policy.yml):', denyList.join(', '));
            console.log('Files with license findings:', (r.files || []).length);
            console.log('Warnings (LicenseRef-scancode-unknown, nunca bloquea):', warnings.length);
            for (const w of warnings) console.log('::warning::' + w);
            if (violations.length) {
              console.log('::error::Licencias en deny-list (FASE 1 advisory, no bloquea): ' + violations.length);
              for (const v of violations) console.log('  - ' + v);
            } else {
              console.log('Sin licencias de la deny-list en el diff del PR.');
            }
          "

      - name: Upload PR license report artifact (retention 14d)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-license-report
          path: scancode-scope/pr-license-report.json
          retention-days: 14
          if-no-files-found: warn

  # Job PR-time de auditoría de lockfile (change `sca-lockfile-compliance`, capa 2):
  # `npm audit` lee package-lock.json directamente (sin `npm ci`: el audit no
  # necesita el árbol instalado y una instalación añadiría 1-3 min por PR).
  # Umbral moderate (coincide con dependency-review; fuente distinta: CVE del
  # lockfile RESUELTO, incluidos transitivos — no manifiesto). FASE 1 advisory:
  # continue-on-error a nivel JOB (patrón dead-code, actions/toolkit#581). Esta
  # capa NO entra a prebuild-security-complete.needs en FASE 1 (spec); FASE 2
  # (2-4 semanas de runs limpios) quita el flag y la añade al agregador.
  # Evidencia: artifact `lockfile-audit-pr` 14d. Detecta CVE, no licencias —
  # `deny-licenses` (clave del job dependency-review) NO aplica aquí.
  lockfile-audit:
    if: github.event_name == 'pull_request'
    name: 'Security: Lockfile Audit (advisory, FASE 1)'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Audit resolved lockfile (npm audit, threshold moderate)
        id: audit-json
        continue-on-error: true
        run: |
          npm audit --audit-level=moderate --json > audit-report.json

      - name: Summarize npm audit findings
        if: always()
        run: |
          if [ -f audit-report.json ]; then
            node -e "
              const r = JSON.parse(require('fs').readFileSync('audit-report.json', 'utf8'));
              const v = (r.metadata && r.metadata.vulnerabilities) || {};
              console.log('npm audit — vulnerabilities:', JSON.stringify(v));
              if ((v.moderate || 0) + (v.high || 0) + (v.critical || 0) > 0) {
                console.log('::warning::Hallazgos >= moderate en lockfile (FASE 1 advisory, no bloquea)');
              } else {
                console.log('Sin hallazgos >= moderate en el lockfile resuelto.');
              }
            " || echo 'Report parse failed (see artifact)'
          else
            echo 'audit-report.json not produced (see step outcome)'
          fi

      - name: Upload npm audit report artifact (retention 14d)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lockfile-audit-pr
          path: audit-report.json
          retention-days: 14
          if-no-files-found: warn

  # Job PR-time IaC — Policy as Code (change `sca-lockfile-compliance`, capa 4):
  # Checkov sobre Dockerfile/terraform/kubernetes. `soft_fail: true` (FASE 1
  # advisory: hallazgos con exit 0). Política versionada en `.checkov.yml`,
  # pasada explícita vía input `config_file` (la CLI además la auto-lee del
  # cwd). NO entra a prebuild-security-complete.needs en FASE 1 (spec); FASE 2:
  # baseline `.checkov.baseline` (fail-on-new) + quitar soft-fail tras 2-4
  # semanas de runs limpios. Complementaria a SAST (código) y SCA
  # (dependencias): configura infraestructura, no analiza licencias ni CVE.
  checkov-iac:
    if: github.event_name == 'pull_request'
    name: 'Security: Checkov IaC (advisory, FASE 1)'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Run Checkov IaC scan (soft fail, SARIF)
        id: checkov-sarif
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile terraform kubernetes
          config_file: .checkov.yml
          output_format: sarif
          output_file_path: checkov-report.sarif
          soft_fail: true

      - name: Upload Checkov report artifact (retention 14d)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkov-report-pr
          path: checkov-report.sarif
          retention-days: 14
          if-no-files-found: warn

  # Job PR-time de calidad del Containerfile (change `containerfile-lint`):
  # Hadolint = higiene/calidad del Dockerfile (ShellCheck sobre RUN, pin de
  # versiones, capas consolidadas, registry allowlist). NO es capa IaC: eso ya
  # lo cubre `checkov-iac` (CKV_DOCKER_*, política `.checkov.yml`) — separación
  # de capas documentada en `quality-gates.md` §2. Política versionada
  # `.hadolint.yaml` vía input `config` (nunca flags de ignore inline: el flag
  # de CLI anula la lista del config). FASE 1 advisory: `continue-on-error:
  # true` y NO entra en el `needs` del agregador; FASE 2 (tras 2-4 semanas sin
  # falsos positivos): `failure-threshold: warning` + añadir al `needs`.
  containerfile-lint:
    if: github.event_name == 'pull_request'
    name: 'Security: Containerfile Lint (advisory, FASE 1)'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Run Hadolint Containerfile lint (SARIF)
        id: hadolint-sarif
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/server/Dockerfile
          config: .hadolint.yaml
          format: sarif
          output-file: hadolint.sarif
          failure-threshold: info

      - name: Upload Hadolint SARIF to Code Scanning
        if: always() && hashFiles('hadolint.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: hadolint.sarif
          category: hadolint

      - name: Upload Hadolint report artifact (retention 14d)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hadolint-report-pr
          path: hadolint.sarif
          retention-days: 14
          if-no-files-found: warn

  # Job advisory de pipeline config scan (change `pipeline-config-scan`):
  # actionlint con salida SARIF para la Security tab. Único job de actionlint
  # por PR: consolida al ex-gate bloqueante de 2B (removido — su cobertura
  # vive aquí vía SARIF + Code Scanning y en `zizmor-advisory`; la FASE 2 de
  # pipeline-config-scan puede restablecer el bloqueo quitando
  # `continue-on-error`). Ejecución vía imagen Docker pinneada
  # `rhysd/actionlint:1.7.12` (sin curl|bash de scripts remotos; imagen
  # oficial del autor del binario). La plantilla SARIF oficial se versiona en
  # `.github/actionlint-sarif.tmpl` y se pasa como CONTENIDO de `-format` (la
  # pseudo-plantilla inline produce 0 bytes con exit 0 — verificado v1.7.12).
  # El step lleva `|| true`: con hallazgos actionlint sale 1 y la evidencia
  # debe generarse igual; el carácter advisory en FASE 1 lo aporta
  # `continue-on-error: true` a nivel job. NO entra en los `needs` de los
  # agregadores en FASE 1 (FASE 2: scope de bloqueo solo en este step, con
  # uploads step-COE). Política `.github/actionlint.yaml` intacta (montada
  # read-only en el contenedor, no se modifica).
  # change ci-security-substage-alignment (2026-09-30): ubicado en bloque security 2C, orden §23.3
  actionlint-advisory:
    if: github.event_name == 'pull_request'
    name: 'Security: ActionLint Advisory (SARIF, FASE 1)'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run actionlint (SARIF, advisory)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 \
            -no-color -config-file .github/actionlint.yaml \
            -format "$(cat .github/actionlint-sarif.tmpl)" .github/workflows/*.y*ml > actionlint.sarif || true
          test -s actionlint.sarif || { echo 'actionlint.sarif vacio'; exit 1; }
          jq -e . actionlint.sarif > /dev/null || { echo 'actionlint.sarif no parseable'; exit 1; }
        shell: bash
      - name: Upload actionlint SARIF to Code Scanning
        if: always() && hashFiles('actionlint.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: actionlint.sarif
          category: actionlint
      - name: Upload actionlint report artifact (retention 14d)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: actionlint-report-pr
          path: actionlint.sarif
          retention-days: 14
          if-no-files-found: warn

  # Job advisory zizmor (change `pipeline-config-scan`): cubre el gap
  # `unpinned-uses` que actionlint no detecta. Instalación fijada (A4):
  # setup-uv SHA-pinned (v6.7.0, ubuntu-latest NO trae uv) + `uvx zizmor@1.30.1`
  # (versión exacta, no latest) + verificación de versión antes del scan.
  # `--format=sarif` SIEMPRE termina exit 0 → se valida el fichero (`test -s`
  # + `jq -e .`), nunca el exit code. Política `.github/zizmor.yml`
  # referenciada incondicionalmente (A3). FASE 1 advisory; FASE 2: gating
  # `jq -e '.runs[0].results | length == 0'` + `prebuild-security-complete.needs`.
  # change ci-security-substage-alignment (2026-09-30): ubicado en bloque security 2C, orden §23.3
  zizmor-advisory:
    if: github.event_name == 'pull_request'
    name: 'Security: Zizmor Advisory (unpinned-uses, FASE 1)'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0 (SHA-pinned, nunca @main/@v*)
      - name: Run zizmor (SARIF, advisory)
        run: |
          uvx zizmor@1.30.1 --version | grep -q '1.30.1' || { echo 'zizmor version mismatch'; exit 1; }
          uvx zizmor@1.30.1 --format=sarif -c .github/zizmor.yml .github/workflows/ > zizmor.sarif || true
          test -s zizmor.sarif || { echo 'zizmor.sarif vacio'; exit 1; }
          jq -e . zizmor.sarif > /dev/null || { echo 'zizmor.sarif no parseable'; exit 1; }
        shell: bash
      - name: Upload zizmor SARIF to Code Scanning
        if: always() && hashFiles('zizmor.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: zizmor.sarif
          category: zizmor
      - name: Upload zizmor report artifact (retention 14d)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zizmor-report-pr
          path: zizmor.sarif
          retention-days: 14
          if-no-files-found: warn

  # Job advisory de typosquatting / dependency confusion (change
  # `typosquatting-detection`): GuardDog v3.2.0 (DataDog, OSS, sin credenciales)
  # sobre package.json — detección por metadatos + YARA que NO duplica a Trivy
  # (CVE/secretos), dependency-review (manifiesto PR) ni lockfile-audit (CVE
  # lockfile). Toda la política vive en el wrapper versionado
  # `scripts/guarddog-verify.sh` (GuardDog no soporta config files): pin 3.2.0
  # con verificación de versión, devDeps excluidas, sandbox obligatorio (nunca
  # --no-sandbox), exclusiones justificadas. `verify` requiere red y puede morir
  # a medias → `|| true` + `test -s` + `jq -e .` antes de subir. FASE 1 advisory
  # (`continue-on-error: true` a nivel job); NO entra en los `needs` de los
  # agregadores (FASE 2 diferida: 2-4 semanas sin FP, luego gating + needs).
  # change ci-security-substage-alignment (2026-09-30): ubicado en bloque security 2C, orden §23.3
  typosquat-guarddog:
    if: github.event_name == 'pull_request'
    name: 'Security: Typosquat GuardDog (advisory, FASE 1)'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0 (SHA-pinned, nunca @main/@v*)
      - name: Run GuardDog verify (SARIF, advisory)
        run: |
          bash scripts/guarddog-verify.sh > guarddog.sarif || true
          test -s guarddog.sarif || { echo 'guarddog.sarif vacio'; exit 1; }
          jq -e . guarddog.sarif > /dev/null || { echo 'guarddog.sarif no parseable'; exit 1; }
        shell: bash
      - name: Upload GuardDog SARIF to Code Scanning
        if: always() && hashFiles('guarddog.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: guarddog.sarif
          category: guarddog
      - name: Upload GuardDog report artifact (retention 14d)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: guarddog-report-pr
          path: guarddog.sarif
          retention-days: 14
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════
  # STAGE 3: BUILD (compilación, empaquetado, artifact)
  # ═══════════════════════════════════════════════════════════════
  client-build:
    if: false # Disabled for incremental CI — change to true to re-enable
    name: 'Build: Client'
    needs:
      [
        client-lint,
        client-format-check,
        client-typecheck,
        client-complexity,
        client-dead-code,
        client-import-bounds,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - run: npm run build --workspace=apps/client
      - uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: apps/client/dist/

  server-build:
    if: false # Disabled for incremental CI — change to true to re-enable
    name: 'Build: Server'
    needs:
      [
        server-lint,
        server-format-check,
        server-typecheck,
        server-complexity,
        server-dead-code,
        server-import-bounds,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: 'echo "server-build: no-op (source-level, D8)"'

  # ═══════════════════════════════════════════════════════════════
  # STAGE 4: POST-BUILD — INTEGRATE (requieren artifact compilado)
  # ═══════════════════════════════════════════════════════════════

  # --- Client Post-Build ---
  client-sonarqube:
    if: false # Sin credenciales: no existe SONAR_TOKEN/SONAR_HOST_URL en los secrets del repo (change `quality-gates` D2 — gate documentado como inactivo, nunca rojo)
    name: 'Quality: Client SonarQube'
    needs: [client-build, test-unit-client]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: apps/client/dist/
      - uses: actions/download-artifact@v4
        with:
          name: coverage-client
          path: apps/client/coverage/
      - uses: SonarSource/sonarqube-scan-action@v4
        with:
          projectBaseDir: apps/client
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  client-coverage:
    # FASE 1 advisory. Scoping por PROPAGACIÓN de skip del upstream (needs = exactamente
    # su test job; client-build sigue if: false — deadlock de skipped). NOTA D17: el if
    # explícito con needs.repo-discovery.outputs NO es viable aquí — GHA solo expone el
    # contexto needs de jobs DECLARADOS en needs (actionlint: property not defined) y el
    # job se saltaría siempre. La propagación cubre el mismo conjunto: corre ⇔ corrió su test job.
    if: false
    continue-on-error: true
    name: 'Quality: Client Coverage'
    needs: [test-unit-client]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - uses: actions/download-artifact@v4
        with:
          name: coverage-client
          path: apps/client/coverage/
      - uses: actions/download-artifact@v4
        with:
          name: flaky-evidence-client
          path: apps/client/reports/
      # D18: el tripwire de thresholds SOLO evalúa cobertura de suite completa.
      # Una corrida TIA solo carga los tests afectados, así que sus totales no son
      # comparables con los thresholds globales (falso fail al reportar 0% en lo no
      # corrido, o fail-silencioso al subir el % al testear solo lo ya cubierto).
      # En diff-scoped se exige la presencia del artefacto y se difiere el umbral
      # a la próxima full-suite (que cierran los PRs `shared` y el nocturno).
      - name: Enforce coverage thresholds (full suite only, D18)
        run: |
          SCOPE=$(tr -d '[:space:]' < apps/client/reports/tia-scope.txt 2>/dev/null || true)
          SCOPE=${SCOPE:-full}
          echo "TIA scope: $SCOPE"
          if [ ! -f apps/client/coverage/coverage-summary.json ]; then
            echo "::error::coverage artifact missing — the test job did not produce coverage"
            exit 1
          fi
          if [ "${SCOPE}" != "full" ]; then
            echo "::notice::diff-scoped run: coverage thresholds DEFERRED to the next full-suite run (D18). Artifact presence verified."
            exit 0
          fi
          node scripts/ci/check-coverage.mjs apps/client

  client-depcheck:
    if: false # Disabled for incremental CI — change to true to re-enable
    name: 'Quality: Client DepCheck'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - name: Check unused/missing dependencies
        run: npx depcheck
        working-directory: apps/client

  # --- Server Post-Build ---
  server-sonarqube:
    if: false # Sin credenciales: no existe SONAR_TOKEN/SONAR_HOST_URL en los secrets del repo (change `quality-gates` D2 — gate documentado como inactivo, nunca rojo)
    name: 'Quality: Server SonarQube'
    needs: [server-build, test-unit-server]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - uses: actions/download-artifact@v4
        with:
          name: coverage-server
          path: apps/server/tests/coverage/
      - uses: SonarSource/sonarqube-scan-action@v4
        with:
          projectBaseDir: apps/server
          projectKey: project-one-server
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  server-coverage:
    # FASE 1 advisory. Scoping por propagación (misma corrección D17 que client-coverage);
    # el guard recibe el reportsDirectory real del server como 3.er argumento.
    if: false
    continue-on-error: true
    name: 'Quality: Server Coverage'
    needs: [test-unit-server]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - uses: actions/download-artifact@v4
        with:
          name: coverage-server
          path: apps/server/tests/coverage/
      - uses: actions/download-artifact@v4
        with:
          name: flaky-evidence-server
          path: apps/server/reports/
      # D18: el guard de thresholds solo evalúa cobertura de suite completa; en
      # corridas diff-scoped (TIA) se verifica la presencia del artefacto y se
      # difiere el umbral a la próxima full-suite.
      - name: Enforce coverage thresholds (full suite only, D18)
        run: |
          SCOPE=$(tr -d '[:space:]' < apps/server/reports/tia-scope.txt 2>/dev/null || true)
          SCOPE=${SCOPE:-full}
          echo "TIA scope: $SCOPE"
          if [ ! -f apps/server/tests/coverage/coverage-summary.json ]; then
            echo "::error::coverage artifact missing — the test job did not produce coverage"
            exit 1
          fi
          if [ "${SCOPE}" != "full" ]; then
            echo "::notice::diff-scoped run: coverage thresholds DEFERRED to the next full-suite run (D18). Artifact presence verified."
            exit 0
          fi
          node scripts/ci/check-coverage.mjs apps/server apps/server/tests/coverage

  server-depcheck:
    if: false # Disabled for incremental CI — change to true to re-enable
    name: 'Quality: Server DepCheck'
    needs: server-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - name: Check unused/missing dependencies
        run: npx depcheck
        working-directory: apps/server

  # --- TESTING (post-build): integration / smoke / e2e requieren artifact compilado ---
  # JUnit de integration/smoke: flags `--reporter=junit --outputFile=reports/junit.xml` inline
  # (contrato "in the workspace CI script" de ci-test-reporting relajado aquí: el `--` de npm
  # los añade a un script existente; moverlos a scripts `*:ci` nuevos duplicaría configuración).
  test-integration:
    if: (needs.repo-discovery.outputs.server == 'true' || needs.repo-discovery.outputs.shared == 'true') && github.event_name == 'pull_request'
    name: 'Tests: Integration - Server'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    services:
      postgres:
        image: postgres:16-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: project_one_test
        options: >-
          --health-cmd "pg_isready -U test -d project_one_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - name: Prisma Migrate Deploy
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/project_one_test
        shell: bash
        working-directory: apps/server
      - name: Seed Database
        # Seeds users (id=1, id=2), roles, eventTypes, events and other
        # reference data required by integration tests that rely on FK
        # constraints (e.g. events.createdBy → users.id).
        # Without this step the DB is empty after migrate deploy and
        # upsert(create:{ createdBy: 1, eventTypeId: 1 }) throws FK violation.
        run: npx prisma db seed
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/project_one_test
          NODE_ENV: test
        shell: bash
        working-directory: apps/server
      - name: Run Integration Tests
        # `--reporter=default` explicito: sin el, el unico reporter activo es `junit`, que SILENCIA
        # la salida de fallos y deja solo un `exit code 1` sin diagnostico en el log del step
        # (coste real de diagnosticar el fallo de `test-smoke`: 4 runs de leitura de logs).
        run: npm run test:integration --workspace=apps/server -- --reporter=default --reporter=junit --outputFile=reports/junit.xml
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/project_one_test
          NODE_ENV: test
        shell: bash
      - name: Report Integration Tests
        if: success() || failure()
        uses: dorny/test-reporter@v3
        with:
          name: Server Integration Tests
          path: apps/server/reports/junit.xml
          reporter: java-junit

  test-smoke:
    if: (needs.repo-discovery.outputs.server == 'true' || needs.repo-discovery.outputs.shared == 'true') && github.event_name == 'pull_request'
    name: 'Tests: Smoke - Server'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    services:
      postgres:
        image: postgres:16-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: project_one_test
        options: >-
          --health-cmd "pg_isready -U test -d project_one_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - name: Prisma Migrate Deploy
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/project_one_test
        shell: bash
        working-directory: apps/server
      - name: Seed Database
        # Seeds users (id=1, id=2), roles, eventTypes, events and other
        # reference data required by smoke tests that rely on FK constraints
        # (e.g. events.createdBy → users.id). Without this step the DB is
        # empty after migrate deploy and upsert(create:{ createdBy: 1 })
        # throws FK violation.
        run: npx prisma db seed
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/project_one_test
          NODE_ENV: test
        shell: bash
        working-directory: apps/server
      - name: Run Smoke Tests
        # `--reporter=default` explicito: sin el, el unico reporter activo es `junit`, que SILENCIA
        # la salida de fallos y deja solo un `exit code 1` sin diagnostico en el log del step
        # (coste real de diagnosticar el fallo de `test-smoke`: 4 runs de lectura de logs).
        run: npm run test:smoke:ci --workspace=apps/server -- --reporter=default --reporter=junit --outputFile=reports/junit.xml
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/project_one_test
          NODE_ENV: test
        shell: bash
      - name: Report Smoke Tests
        if: success() || failure()
        uses: dorny/test-reporter@v3
        with:
          name: Server Smoke Tests
          path: apps/server/reports/junit.xml
          reporter: java-junit

  e2e:
    if: false # Disabled for incremental CI — change to true to re-enable
    name: 'Tests: E2E'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    services:
      postgres:
        image: postgres:16-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: project_one_test
        options: >-
          --health-cmd "pg_isready -U test -d project_one_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - name: Prisma Migrate Deploy
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/project_one_test
        shell: bash
        working-directory: apps/server
      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright with System Dependencies
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        shell: bash
        working-directory: e2e
      - name: Run E2E Tests
        run: npx playwright test --project=chromium --output=test-results
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/project_one_test
        shell: bash
        working-directory: e2e
      - name: Report E2E Tests
        if: success() || failure()
        uses: dorny/test-reporter@v3
        with:
          name: E2E Tests
          path: e2e/reports/junit-e2e.xml
          reporter: java-junit

  # ═══════════════════════════════════════════════════════════════
  # STAGE 5: ARTIFACT & SIGN (empaquetado, firma, publicación)
  # Vive en security.yml / deploy.yml (ambos disabled_manually) — NO en ci.yml.
  # Placeholder informativo: conserva la topología del pipeline §23.3.
  # ═══════════════════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════════════════
  # STAGE 6: DEPLOY STAGING (entorno de validación)
  # Vive en deploy.yml (disabled_manually) — NO en ci.yml.
  # Placeholder informativo: conserva la topología del pipeline §23.3.
  # ═══════════════════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════════════════
  # STAGE 7: POST-DEPLOY — ACCEPT (app desplegada corriendo)
  # Vive en deploy.yml (disabled_manually) — NO en ci.yml.
  # Placeholder informativo: conserva la topología del pipeline §23.3.
  # ═══════════════════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════════════════
  # STAGE 8: PERFORMANCE (stability + performance gated)
  # Sin workflow asignado — placeholder informativo §23.3.
  # ═══════════════════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════════════════
  # STAGE 9: APPROVAL & GOVERNANCE (human gate + compliance)
  # Gate humano (ruleset + CODEOWNERS) — placeholder informativo §23.3.
  # ═══════════════════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════════════════
  # STAGE 10: DEPLOY PRODUCTION (release)
  # Vive en deploy.yml + release.yml (ambos disabled_manually) — NO en ci.yml.
  # Placeholder informativo: conserva la topología del pipeline §23.3.
  # ═══════════════════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════════════════
  # STAGE 11: MONITOR & CLEANUP (observability + limpieza)
  # Post-CD: observability + cleanup — placeholder informativo §23.3.
  # ═══════════════════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════════════════
  # SUBSTAGE AGGREGATORS — Prebuild Complete (STAGE 2)
  # One aggregator per substage 2A/2B/2C/2D; ci-complete depends on these.
  # ═══════════════════════════════════════════════════════════════
  prebuild-governance-complete:
    if: ${{ vars.CI_MINIMAL != 'true' && always() }}
    name: Prebuild Governance Complete
    runs-on: ubuntu-latest
    needs:
      - verify-signatures
      - commit-lint
      - pr-title-lint
      - dco
    steps:
      - name: Check for failures
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more governance jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ One or more governance jobs were cancelled"
            exit 1
          fi
          echo "✅ Governance substage succeeded or was skipped"

  prebuild-quality-complete:
    if: ${{ vars.CI_MINIMAL != 'true' && always() }}
    name: Prebuild Quality Complete
    runs-on: ubuntu-latest
    needs:
      - client-lint
      - client-format-check
      - client-typecheck
      - client-complexity
      - client-dead-code
      - client-import-bounds
      - server-lint
      - server-format-check
      - server-typecheck
      - server-complexity
      - server-dead-code
      - server-import-bounds
      - e2e-lint
      - root-manifest-guard
      - openspec-validate
    steps:
      - name: Check for failures
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more quality jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ One or more quality jobs were cancelled"
            exit 1
          fi
          echo "✅ Quality substage succeeded or was skipped"

  prebuild-security-complete:
    if: ${{ vars.CI_MINIMAL != 'true' && always() }}
    name: Prebuild Security Complete
    runs-on: ubuntu-latest
    needs:
      - dependency-review
      - secrets
      - scancode-license-pr-diff
    steps:
      - name: Check for failures
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more security jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ One or more security jobs were cancelled"
            exit 1
          fi
          echo "✅ Security substage succeeded or was skipped"

  prebuild-unit-tests-complete:
    if: ${{ vars.CI_MINIMAL != 'true' && always() }}
    name: Prebuild Unit Tests Complete
    runs-on: ubuntu-latest
    needs:
      - test-unit-client
      - test-unit-server
      - test-integration
      - test-smoke
      - client-coverage
      - server-coverage
    steps:
      - name: Check for failures
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more unit-test jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ One or more unit-test jobs were cancelled"
            exit 1
          fi
          echo "✅ Unit-testing substage succeeded or was skipped"

  # ═══════════════════════════════════════════════════════════════
  # AGGREGATOR — CI Complete — Single required check aggregator
  # ═══════════════════════════════════════════════════════════════
  ci-complete:
    if: ${{ vars.CI_MINIMAL != 'true' && always() }}
    name: CI Complete
    runs-on: ubuntu-latest
    needs:
      - prebuild-governance-complete
      - prebuild-quality-complete
      - prebuild-security-complete
      - prebuild-unit-tests-complete
      - verify-signatures
      - zombie-workflow-guard
      - repo-discovery
    steps:
      - name: Check for failures
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more upstream jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "⚠️ One or more upstream jobs were cancelled — skipping ci-complete"
            exit 0
          fi
          echo "✅ All upstream jobs succeeded or were skipped"

  # ═══════════════════════════════════════════════════════════════
  # GUARDS — Zombie Workflow Guard
  # ═══════════════════════════════════════════════════════════════
  zombie-workflow-guard:
    name: Zombie Workflow Guard
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Assert deleted workflows are absent
        run: |
          if test -f .github/workflows/pr-validation.yml; then
            echo "❌ Zombie workflow pr-validation.yml found"
            exit 1
          fi
          if test -f .github/workflows/lint.yml; then
            echo "❌ Zombie workflow lint.yml found"
            exit 1
          fi
          if test -f .github/workflows/formatter.yml; then
            echo "❌ Zombie workflow formatter.yml found"
            exit 1
          fi
          if test -f .github/workflows/quality.yml; then
            echo "❌ Zombie workflow quality.yml found - should have been deleted"
            exit 1
          fi
          echo "✅ All zombie workflows confirmed absent"
