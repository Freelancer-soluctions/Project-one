name: 'CI'

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  merge_group: {}
  # Override manual de TIA — task 2.1 del change `tia-enterprise-gaps`.
  # Una corrida manual NO tiene diff de PR: `repo-discovery` resuelve todos los
  # ámbitos a `true`, así que el pipeline corre la suite completa (nunca un
  # verde vacío por falta de diff). `full_suite` es la señal explícita del
  # contrato de override y la leen los steps `Resolve TIA scope`.
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Forzar suite completa (ignora la selección TIA diff-scoped)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.event_name == 'merge_group' && format('merge-group-{0}', github.event.merge_group.head_ref) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════
  # ENTRY — Detect Changes (path-filtered)
  # ═══════════════════════════════════════════════════════════════
  repo-discovery:
    name: Detect Changes
    # `merge_group` y `workflow_dispatch` también resuelven ámbitos (task 4.2 del
    # change `tia-enterprise-gaps`): sin esta cláusula el job quedaba saltado en la
    # merge queue y los jobs de test heredaban el skip.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.scope.outputs.client }}
      server: ${{ steps.scope.outputs.server }}
      e2e: ${{ steps.scope.outputs.e2e }}
      shared: ${{ steps.scope.outputs.shared }}
      # change `ci-shifting-left` (capability workflow-linting): ámbito propio para
      # el job `validate-pipeline`. NO se reutiliza `shared` porque incluye
      # package.json/lockfile/scripts y dispararía el lint de workflows en PRs
      # que no tocan ni un YAML de `.github/`.
      workflows: ${{ steps.scope.outputs.workflows }}
      # change `sca-lockfile-compliance` (task 1.1/1.2): diff de manifiestos vs
      # lockfile raíz para el guard de lockfile obligatorio y el gate del step
      # OSV-Scanner (solo corre si el PR toca el lockfile).
      lockfile: ${{ steps.scope.outputs.lockfile }}
      manifests: ${{ steps.scope.outputs.manifests }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # NOTE: app-token step removed — unused; paths-filter uses default GITHUB_TOKEN
      # El filtro de rutas SOLO tiene sentido con un diff de PR: en `merge_group`
      # no hay `pull_request.base.sha` y en `workflow_dispatch` no hay diff alguno.
      # El step `Resolve change detection` de abajo cubre esos dos eventos.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            client:
              - 'apps/client/**'
            server:
              - 'apps/server/**'
            e2e:
              - 'e2e/**'
            workflows:
              - '.github/workflows/**'
              - '.github/dependabot.yml'
              - '.yamllint.yml'
            # Manifiestos que el lockfile raíz debe resolver (task 1.2 del
            # change `sca-lockfile-compliance`): un cambio aquí sin cambio en
            # `lockfile` falla el guard del job `lockfile-audit`.
            manifests:
              - 'package.json'
              - 'apps/*/package.json'
              - 'e2e/package.json'
            lockfile:
              - 'package-lock.json'
            shared:
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              # Scripts de CI (política `pr-body-lint`, coverage, TIA…):
              # change `pr-metadata-workflow` task 1.9 — un cambio aquí debe
              # disparar los jobs shared (p. ej. el lockstep plantilla↔política
              # que corre en `openspec-validate` vía `npm run test:scripts`).
              - 'scripts/**'
              # Allowlist del guard del manifest raíz (change
              # `ci-quality-gates-blocking-hardening`, P2.1): un cambio aquí debe
              # re-ejecutar `root-manifest-guard`.
              - 'manifest-allowlist.json'
              # Configs de import boundaries (dependency-cruiser): cambiarlos
              # dispara los jobs `*-import-bounds` de ambos workspaces.
              - '.dependency-cruiser.cjs'
              - 'apps/client/.dependency-cruiser.cjs'
              - 'apps/server/.dependency-cruiser.cjs'
              # Fallback transversal — task 1.1 del change `tia-enterprise-gaps`.
              # Un diff MIXTO (p. ej. `src/**` + `prisma/schema.prisma`) no
              # marcaba `shared`, así que la selección TIA del workspace ignoraba
              # que el cambio afecta a TODOS los tests (schema/migraciones,
              # configs globales de Vite/Vitest, setup files y tsconfig raíz).
              - 'tsconfig.json'
              - 'vitest.shared.js'
              - 'vitest.sequencer.js'
              - 'apps/client/vite*'
              - 'apps/client/vitest*'
              - 'apps/server/vitest*'
              - 'apps/server/tsconfig.json'
              - 'apps/**/setup*'
              - 'apps/server/prisma/**'
      # Resolver del contrato de outputs — task 4.2 del change
      # `tia-enterprise-gaps`. En `pull_request` propaga el filtro de rutas (el
      # path-scoping de PRs legítimos no cambia). En `merge_group` y
      # `workflow_dispatch` no existe diff de PR: TODOS los ámbitos se resuelven
      # `true` para que la suite completa corra antes de integrar.
      - name: Resolve change detection
        id: scope
        env:
          FILTER_CLIENT: ${{ steps.filter.outputs.client }}
          FILTER_SERVER: ${{ steps.filter.outputs.server }}
          FILTER_E2E: ${{ steps.filter.outputs.e2e }}
          FILTER_SHARED: ${{ steps.filter.outputs.shared }}
          FILTER_WORKFLOWS: ${{ steps.filter.outputs.workflows }}
          FILTER_LOCKFILE: ${{ steps.filter.outputs.lockfile }}
          FILTER_MANIFESTS: ${{ steps.filter.outputs.manifests }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            {
              echo "client=true"
              echo "server=true"
              echo "e2e=true"
              echo "shared=true"
              echo "workflows=true"
              echo "lockfile=true"
              echo "manifests=true"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::event '${{ github.event_name }}' has no PR diff — every workspace is treated as changed (full suite)."
            exit 0
          fi
          {
            echo "client=${FILTER_CLIENT:-false}"
            echo "server=${FILTER_SERVER:-false}"
            echo "e2e=${FILTER_E2E:-false}"
            echo "shared=${FILTER_SHARED:-false}"
            echo "workflows=${FILTER_WORKFLOWS:-false}"
            echo "lockfile=${FILTER_LOCKFILE:-false}"
            echo "manifests=${FILTER_MANIFESTS:-false}"
          } >> "$GITHUB_OUTPUT"
        shell: bash

  # ═══════════════════════════════════════════════════════════════
  # STAGE 1: PRE-COMMIT HOOKS (local — skippable via --no-verify) [SL]
  # Vive en .husky/ (pre-commit + commit-msg + pre-push) — NO en ci.yml.
  # Placeholder informativo: el pipeline empieza en local antes del PR.
  # ═══════════════════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════════════════
  # STAGE 2: PRE-BUILD — VALIDATE (source code, 0 dependencia de build)
  # ═══════════════════════════════════════════════════════════════
  # ═══════════════════════════════════════════════════════════════
  # SUBSTAGE 2A: GOVERNANCE — verify-signatures, commit-lint, dco, sast diff
  # (los checks de METADATA — `PR Title Lint` y `Governance: PR Body Lint` —
  #  viven en `.github/workflows/pr-metadata.yml`; change `pr-metadata-workflow`)
  # ═══════════════════════════════════════════════════════════════
  # verify-signatures (G3) — Verifica firma de commits vía GitHub REST API
  # ════════════════════════════════════════════════════════════════
  # Required status check in ruleset 21227644 — bound by job NAME 'Verify Commit Signatures';
  # renaming name: silently breaks ruleset binding
  verify-signatures:
    name: 'Governance: Verify Commit Signatures'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - name: Detect event type and set SHAs
        id: detect_event
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "event_type=merge_group" >> $GITHUB_OUTPUT
            # For merge_group, use the commit SHA that triggered the workflow
            SHA="${{ github.sha }}"
            echo "single_sha=$SHA" >> $GITHUB_OUTPUT

          else
            echo "event_type=pull_request" >> $GITHUB_OUTPUT
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Debug PR number
        if: steps.detect_event.outputs.event_type == 'pull_request'
        run: |
          echo "PR number: ${STEPS_DETECT_EVENT_OUTPUTS_PR_NUMBER}"
        env:
          STEPS_DETECT_EVENT_OUTPUTS_PR_NUMBER: ${{ steps.detect_event.outputs.pr_number }}

      - name: Fetch PR commits via compare endpoint
        if: steps.detect_event.outputs.event_type == 'pull_request'
        id: fetch_commits
        env:
          SIGNING_ROLLOUT_DATE: ${{ vars.SIGNING_ROLLOUT_DATE || '2026-08-01' }}
        run: |
          set -e

          # ------------------------------------------------------------
          # Signing rollout cutoff (grandfathering). Change: ci-commit-signing.
          # WHY: comparison ranges (main...feature) can drag hundreds of historical
          # commits authored BEFORE mandatory signing existed. Those commits cannot
          # be signed retroactively without rewriting history, and the main-branch
          # ruleset protects main independently of this branch. Commits authored
          # before ROLLOUT_DATE are counted as grandfathered and do NOT fail;
          # only unsigned commits dated on/after the rollout are real failures.

          # Signing rollout date: commits anteriores son grandfathered (exonerados).
          # El lote contaminado del PR #99 jamás entró a main (squash); desde el
          # rollout TODO commit nuevo debe estar firmado y verificado.
          # Configurable via repo variable (Settings → Secrets and variables →
          # Actions → Variables); el fallback inline es el valor canónico mientras
          # la variable no esté definida.
          ROLLOUT_DATE="${SIGNING_ROLLOUT_DATE}"
          echo "Signing rollout cutoff (effective): $ROLLOUT_DATE"

          # R1: Scoping base..head via compare endpoint
          # Replaces pagination GET /pulls/{n}/commits with server-side range filtering
          # compare endpoint URL: base.sha...head.sha — only commits new to the PR
          # GitHub compare API limit: up to 250 commits per call (documented below)
          # https://docs.github.com/en/rest/repos/comparisons?apiVersion=2022-11-28#get-a-repository-comparison
          COMPARE_URL="https://api.github.com/repos/${{ github.repository }}/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${{ github.token }}" "$COMPARE_URL")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')

          # HTTP status check
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: HTTP status $HTTP_CODE comparing base..head" >&2
            echo "found_shas=" >> $GITHUB_OUTPUT
            > ok_shas.txt
            > failed_shas.txt
            > grandfathered_shas.txt
            exit 0
          fi

          # Extract commit count from compare response
          # NOTE: REST compare API returns top-level "commits" — there is NO ".data" wrapper
          # (that convention only exists in GraphQL). jq null|length=0 silently otherwise.
          COMMIT_COUNT=$(echo "$RESPONSE_BODY" | jq '.commits | length')

          # Initialize output files
          > ok_shas.txt
          > failed_shas.txt
          > grandfathered_shas.txt

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "ERROR: 0 commits in base..head range on pull_request event — this indicates a broken data pipeline (empty evaluation must NOT pass silently)" >&2
            echo "found_shas=0" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "Evaluating $COMMIT_COUNT new commits from PR (base..head)" >&2

          # Process each commit from compare endpoint
          # Null tolerance: use // false defaults; only .verification.verified == true counts as verified
          # Filtros jq no deben crashear con verification null (requisito C)
          echo "$RESPONSE_BODY" | jq -r '.commits[] | .sha' | while read -r SHA; do
            # Only .verification.verified == true counts as verified
            # // false treats null/undefined as not verified without crashing
            # REST API nests verification under .commit (top-level .verification does not exist)
            COMMIT_JSON=$(echo "$RESPONSE_BODY" | jq -c --arg s "$SHA" '.commits[] | select(.sha == $s)')
            VERIFIED=$(echo "$COMMIT_JSON" | jq -r '.commit.verification.verified // false')
            # Author date in ISO 8601 (e.g. 2026-07-15T10:30:00Z)
            AUTHOR_DATE=$(echo "$COMMIT_JSON" | jq -r '.commit.author.date')

            # Grandfathering cutoff: lexicographic compare is valid for ISO 8601 dates
            if [[ "$AUTHOR_DATE" < "$ROLLOUT_DATE" ]]; then
              # Historical commit predating signing rollout: grandfathered, NOT a failure
              echo "SKIP (grandfathered, $AUTHOR_DATE): $SHA" >&2
              echo "$SHA" >> grandfathered_shas.txt
              continue
            fi

            if [ "$VERIFIED" = "true" ]; then
              echo "$SHA" >> ok_shas.txt
            else
              echo "$SHA" >> failed_shas.txt
            fi
          done

          # Tolerate GitHub signature-verification propagation delay (~30s post-push)
          sleep 30

          # Anti-stale retry: for each SHA marked not verified, do individual check
          # Max 5 individual retries per run (fallidos bulk adicionales van a failed_shas con nota en summary)
          ANTI_STALE_RECOVERED=""
          RETRY_COUNT=0
          MAX_RETRIES=5

          if [ -f failed_shas.txt ] && [ "$(cat failed_shas.txt)" != "" ]; then
            FAILED_SHAS=$(cat failed_shas.txt)
            for SHA in $FAILED_SHAS; do
              if [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; then
                echo "Anti-stale: skipping remaining individual retries (limit $MAX_RETRIES reached)" >&2
                break
              fi

              # Individual check with null tolerance (.verification.verified // false)
              # Solo si individual TAMBIÉN false → evaluar grandfathering antes de fallar
              INDIVIDUAL=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/${{ github.repository }}/commits/$SHA")
              # Schema note: GET /commits/{sha} nests under .commit.verification; tolerate legacy flat layout too
              VERIFIED=$(echo "$INDIVIDUAL" | jq -r '.commit.verification.verified // .verification.verified // false')
              # Anti-stale parity: extraer AUTHOR_DATE del payload individual y aplicar
              # la MISMA guardia de cutoff que el bulk path. Sin esta guardia, commits
              # pre-rollout que llegan al retry quedan en failed_shas.txt
              # (ref bug: run 32661559666, SHAs 4d1953c7/890cdc2a/110292707b/7ec00546).
              AUTHOR_DATE=$(echo "$INDIVIDUAL" | jq -r '.commit.author.date // ""')

              if [ "$VERIFIED" = "true" ]; then
                # Recovered! Move from failed to ok
                echo "$SHA" >> ok_shas.txt
                # Remove from failed_shas.txt
                grep -v "^${SHA}$" failed_shas.txt > failed_shas_tmp.txt 2>/dev/null || true
                mv failed_shas_tmp.txt failed_shas.txt
                ANTI_STALE_RECOVERED="$ANTI_STALE_RECOVERED $SHA"
                echo "Anti-stale: recovered $SHA via individual check" >&2
              elif [[ -n "$AUTHOR_DATE" && "$AUTHOR_DATE" < "$ROLLOUT_DATE" ]]; then
                # Commit pre-rollout sin firma tras retry individual: grandfathered,
                # NO es fallo. Remover de failed_shas y registrar en grandfathered_shas.txt.
                echo "SKIP (grandfathered via anti-stale, $AUTHOR_DATE): $SHA" >&2
                grep -v "^${SHA}$" failed_shas.txt > failed_shas_tmp.txt 2>/dev/null || true
                mv failed_shas_tmp.txt failed_shas.txt
                echo "$SHA" >> grandfathered_shas.txt
              else
                echo "Anti-stale: individual check for $SHA also unverified" >&2
              fi

              RETRY_COUNT=$((RETRY_COUNT + 1))
            done
          fi

          # Generate summary values
          OK_COUNT=$( [ -f ok_shas.txt ] && [ "$(cat ok_shas.txt)" != "" ] && wc -l < ok_shas.txt || echo "0" )
          FAILED_COUNT=$( [ -f failed_shas.txt ] && [ "$(cat failed_shas.txt)" != "" ] && wc -l < failed_shas.txt || echo "0" )
          ANTI_STALE_COUNT=$(echo "$ANTI_STALE_RECOVERED" | xargs -r echo | wc -w)
          GRANDFATHERED_COUNT=$( [ -f grandfathered_shas.txt ] && [ "$(cat grandfathered_shas.txt)" != "" ] && wc -l < grandfathered_shas.txt || echo "0" )
          EXCLUDED_COUNT=0  # By scoping, compare endpoint only returns new PR commits (base..head)

          found_shas=$((OK_COUNT + FAILED_COUNT + ANTI_STALE_COUNT + GRANDFATHERED_COUNT))
          echo "found_shas=$found_shas" >> $GITHUB_OUTPUT
          echo "ok_shas_count=$OK_COUNT" >> $GITHUB_OUTPUT
          echo "failed_shas_count=$FAILED_COUNT" >> $GITHUB_OUTPUT
          echo "anti_stale_recovered=$ANTI_STALE_COUNT" >> $GITHUB_OUTPUT
          echo "grandfathered_count=$GRANDFATHERED_COUNT" >> $GITHUB_OUTPUT
          echo "excluded_by_scoping=$EXCLUDED_COUNT" >> $GITHUB_OUTPUT

          echo "Commit verification summary:" >&2
          echo "  New commits from PR evaluated: $((OK_COUNT + FAILED_COUNT + GRANDFATHERED_COUNT))" >&2
          echo "  Verified: $OK_COUNT | Grandfathered: $GRANDFATHERED_COUNT | Unverified: $FAILED_COUNT" >&2
          echo "  Excluded by scoping (base..head): $EXCLUDED_COUNT (handled by compare endpoint)" >&2
          echo "  Recovered by anti-stale retry: $ANTI_STALE_COUNT" >&2
        timeout-minutes: 10

      - name: Fetch single commit verification (merge_group fallback)
        if: steps.detect_event.outputs.event_type == 'merge_group'
        run: |
          SHA="${STEPS_DETECT_EVENT_OUTPUTS_SINGLE_SHA}"
          # REST API nests verification under .commit — top-level .verification does not exist
          VERIFIED=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/$SHA" | jq -r '.commit.verification.verified // false')
          if [ "$VERIFIED" = "true" ]; then
            echo "$SHA" >> ok_shas.txt
          else
            echo "$SHA" >> failed_shas.txt
          fi
        env:
          STEPS_DETECT_EVENT_OUTPUTS_SINGLE_SHA: ${{ steps.detect_event.outputs.single_sha }}

      - name: Check verification results
        id: verify_results
        run: |
          FAILED_SHAS=""
          if [ -f failed_shas.txt ] && [ "$(cat failed_shas.txt)" != "" ]; then
            FAILED_SHAS=$(cat failed_shas.txt)
          fi
          if [ -n "$FAILED_SHAS" ]; then
            echo "failed=true" >> $GITHUB_OUTPUT
            # Multiline output requires heredoc delimiter format; plain
            # key=value with embedded newlines crashes the runner with
            # "Unable to process file command 'output'" (Invalid format '<sha>')
            {
              echo "failed_shas<<EOF"
              echo "$FAILED_SHAS"
              echo "EOF"
            } >> $GITHUB_OUTPUT
            exit 1
          else
            echo "failed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
        timeout-minutes: 10
      - name: Informative report (non-blocking)
        if: always()
        run: |
          echo "=== Commit Verification Report ==="
          if [ -f ok_shas.txt ]; then
            echo "Verified commits:"
            cat ok_shas.txt
          fi
          if [ -f failed_shas.txt ]; then
            echo "Non-verified commits:"
            cat failed_shas.txt
          fi
          if [ -f grandfathered_shas.txt ] && [ "$(cat grandfathered_shas.txt)" != "" ]; then
            echo "Grandfathered commits (pre-rollout cutoff, skipped):"
            cat grandfathered_shas.txt
          fi
          echo "=== End Report ==="
        timeout-minutes: 5
    # Job-level continue-on-error for non-blocking mode
    # (removed — signature verification failures must propagate to ruleset 21227644)
  commit-lint:
    name: 'Governance: Commit Lint (Conventional Commits)'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Guard - fail on empty PR commit range
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          COUNT=$(git rev-list --count "$BASE_SHA".."$HEAD_SHA")
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No commits to validate between base and head"
            exit 1
          fi
      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Lint squash commit (merge queue)
        if: github.event_name == 'merge_group'
        run: npx commitlint --last --verbose
  # `pr-title-lint` (job `PR Title Lint`) EMIGRÓ a `.github/workflows/pr-metadata.yml`
  # (change `pr-metadata-workflow`, migración ATÓMICA en un solo commit).
  # Motivo: el título se re-valida en el evento `edited` sin re-ejecutar el
  # pipeline de código. El contexto requerido del ruleset 21227644 conserva el
  # mismo `name:`, y ahora tiene EMISOR ÚNICO — NO reintroducir el job aquí:
  # dos emisores producen dos check runs con el mismo contexto y el ruleset
  # resuelve por el más reciente, enmascarando un rojo con un verde.
  dco:
    name: 'Governance: DCO'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # PR events: validate Signed-off-by on all commits
      - name: DCO sign-off check
        if: github.event_name == 'pull_request'
        uses: KineticCafe/actions-dco@5f160e3ee086af8fc0fb567b8add0937d074123e # v3.2.0
        with:
          config: |
            [bot]
            policy = "well-known"
            categories = ["dependency-updaters"]
      # Merge queue: DCO is a PR-level check; squash commit doesn't carry individual trailers
      - name: Skip on merge_group (PR-level check)
        if: github.event_name == 'merge_group'
        run: echo "✅ Merge queue — DCO validated at PR level"
    # Phase 1: non-blocking. Remove after team adjusts (1 sprint).
    # continue-on-error: true
  # --- GOVERNANCE: SAST diff-scoped (script compartido; FASE 2 BLOCKING) ---
  # Paridad local/CI por construcción (change sast-shift-left-hooks-parity,
  # RF-CI-01): el job delega en `scripts/sast-diff.mjs` — misma versión pineada,
  # mismos packs, mismas exclusiones y mismo `--severity ERROR --error --metrics
  # off` que el hook `pre-push`. Sin `docker run` inline ni listas duplicadas.
  #
  # FASE 2 (graduado 2026-10-20): SIN `continue-on-error` y presente en
  # `prebuild-governance-complete.needs` — un hallazgo ERROR nuevo deja el job
  # en rojo y hace fallar el agregador de governance.
  # ALCANCE REAL (no confundir): ese agregador NO es status check del ruleset
  # 21227644 (solo los 4 de `docs/CONTEXT-CICD.md` §3.2 lo son), así que el
  # bloqueo DURO del merge exige bindear `Governance: SAST (Semgrep)` al
  # ruleset, y eso es un change de gobernanza aparte (spec `sast-governance-gate`,
  # requisito F2). Mientras no exista ese binding, el rojo es visible y `CI
  # Complete` falla, pero GitHub no impide el merge por sí solo.
  # El artifact de 14 días se conserva como evidencia (RF-CI-02).
  #
  # Criterio de graduación que se cumplió (RF-CI-03; en lockstep con
  # docs/learning/quality-gates.md §7):
  #   1) corridas reales del job sobre PRs (run 39508915508, PR #141, y las
  #      mediciones locales de paridad con el mismo baseline);
  #   2) ningún hallazgo ERROR sin triar: el único finding
  #      (`prototype-pollution` @ validatePathParam.ts) se clasificó como FALSO
  #      POSITIVO y se remedió con `nosemgrep:` + justificación en el propio
  #      archivo (clave literal + valor numérico validado, sin claves del
  #      usuario);
  #   3) evidencia registrada en el artifact `sast-report`.
  #
  # El ruleset 21227644 y `ci-complete.needs` NO se tocan: el gate llega a
  # `CI Complete` solo de forma transitiva vía el agregador de substage.
  # Rollback de FASE 2: reponer `continue-on-error: true` y quitar `sast` de
  # `prebuild-governance-complete.needs` (2 líneas).
  sast:
    name: 'Governance: SAST (Semgrep)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    # FASE 2 (2026-10-20): blocking. El único hallazgo de la ventana de
    # calibración se trió como falso positivo y se remedió con `nosemgrep`.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run diff-scoped Semgrep scan (shared script)
        env:
          # Baseline = pull-request base commit (design D13). El hook local usa
          # `git merge-base origin/main HEAD`: bases distintas, declaradas por
          # cada lado junto al commit que usó — el contrato es mismo diff →
          # mismo veredicto.
          SAST_BASELINE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: SAST_MODE=ci node scripts/sast-diff.mjs
      # Evidencia de la ventana de calibración (RF-CI-02 / design D18): el modo
      # `ci` escribe SIEMPRE `.tmp/sast-report.json` (también en corrida limpia,
      # con findings vacíos), por eso el upload nunca se queda sin input;
      # `if-no-files-found: warn` es la red de seguridad. El reporte distingue
      # hallazgo de herramienta rota. `include-hidden-files: true` es obligatorio:
      # `.tmp/` es un path OCULTO y upload-artifact@v4+ lo excluye por defecto.
      - name: Upload SAST report (14-day calibration evidence)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sast-report
          path: .tmp/sast-report.json
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
    # NOT in ci-complete.needs — SAST is a standalone gate, not coupled to CI_MINIMAL
    # (FASE 2, 2026-10-20: it IS in prebuild-governance-complete.needs; never in
    # ci-complete.needs)

  # ═══════════════════════════════════════════════════════════════
  # SUBSTAGE 2D: UNIT TESTING — test-unit-client, test-unit-server, client-coverage, server-coverage, property-tests
  # (jobs de testing tier-1; test-integration/test-smoke son STAGE 4 POST-BUILD, no miembros de este substage)
  # FASE 2 BLOCKING activo desde 2026-10-29 (task 3.1 del change `ci-testing-gate-promotion`):
  # los 5 jobs ya NO llevan `continue-on-error`, así que un rojo propaga a
  # `prebuild-tests-complete` y, transitivamente, a `ci-complete`
  # (docs/learning/quality-gates.md en lockstep).
  # Coverage: client-coverage/server-coverage se scopean por propagación de skip de su
  # test job (needs), NO vía repo-discovery — ci-runtime-config-hygiene prohíbe needs
  # sin consumo de outputs.
  # ═══════════════════════════════════════════════════════════════
  # --- TESTING (pre-build): unit tests, source-level, no artifact needed ---
  test-unit-client:
    # BLOCKING desde 2026-10-29 (task 3.1 del change `ci-testing-gate-promotion`): sin
    # `continue-on-error`, un fallo propaga a `prebuild-tests-complete`. Con el COE de
    # FASE 1 el veredicto se absorbía a nivel job — `needs.*.result` reportaba
    # `success` aunque el job fallara (actions/toolkit#581).
    # Merge queue y workflow_dispatch también ejecutan — task 4.2 del change
    # `tia-enterprise-gaps`: la cláusula `pull_request` original permitía integrar
    # sin tests. El path-scoping legítimo de PRs se conserva (mismos outputs).
    if: needs.repo-discovery.outputs.client == 'true' || needs.repo-discovery.outputs.shared == 'true'
    name: 'Tests: Unit - Client'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # `actions: read` es necesario para descargar el artefacto `tia-history-*`
      # de OTRO run (restore del historial fail-first, task 1.1 de
      # `smart-test-ordering`) — sin este scope el `gh run download` falla y el
      # restore sería un no-op silencioso.
      actions: read
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo

      # TIA — spec ci-test-impact-analysis (D7). Diff-scoped cuando el diff
      # contra origin/main resuelve; suite completa cuando `shared == 'true'`
      # (lockfile, workflows, raíz) o cuando origin/main NO es resoluble
      # (fallback a suite completa: nunca "0 tests afectados" en silencio).
      - name: Resolve TIA scope (diff-scoped vs full suite)
        id: tia
        # Override manual — task 2.2 del change `tia-enterprise-gaps`: etiqueta
        # `ci:full-suite` en el PR o input `full_suite` de `workflow_dispatch`.
        # En `merge_group` no existe `github.event.pull_request`, así que el label
        # evalúa `false`; ese carril fuerza `scope=full` de forma incondicional.
        env:
          FULL_SUITE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full-suite') }}
          FULL_SUITE_INPUT: ${{ inputs.full_suite || false }}
          NEEDS_REPO_DISCOVERY_OUTPUTS_SHARED: ${{ needs.repo-discovery.outputs.shared }}
        run: |
          if [ "$FULL_SUITE_LABEL" = "true" ] || [ "$FULL_SUITE_INPUT" = "true" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "::notice::manual override (label ci:full-suite / input full_suite) — running the FULL client suite."
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "::notice::merge queue — running the FULL client suite before integration."
          elif [ "${NEEDS_REPO_DISCOVERY_OUTPUTS_SHARED}" = "true" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "::notice::shared path changed (root manifest, lockfile, workflows or global configs) — running the FULL client suite."
          elif git rev-parse --verify --quiet origin/main > /dev/null; then
            echo "scope=changed" >> "$GITHUB_OUTPUT"
            echo "::notice::origin/main resolved — running the diff-scoped client suite."
          else
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "::warning::origin/main is NOT resolvable in this checkout; falling back to the FULL suite (never reporting '0 affected tests')."
          fi
        shell: bash

      # Exclusiones de cuarentena — spec ci-flaky-quarantine (D9, task 5.2).
      # Derivadas EXCLUSIVAMENTE de .github/flaky-quarantine.yml (nada de
      # test.skip ni markers en la fuente). Vacío = ningún exclude.
      - name: Derive quarantine exclusions
        id: quarantine
        run: echo "args=$(node scripts/ci/quarantine-exclude.mjs --format=argv)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Report quarantine exclusions in the run
        if: always()
        run: node scripts/ci/quarantine-exclude.mjs --format=md >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      # Restore del historial fail-first — change `smart-test-ordering` (task 1.1,
      # design D2). El artefacto `tia-history-client` del nightly/full-suite se
      # descarga a la ruta EXACTA que lee el sequencer ANTES del step de tests
      # (el step `Inject previously-failing tests` corre después, para la
      # inyección de selección). Best-effort y exit 0 garantizado: sin artefacto
      # o con JSON corrupto el orden degrada al determinista documentado y el job
      # nunca falla por ello.
      - name: Restore ordering history (fail-first)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apps/client/node_modules/.cache/tia || true
          RUN_ID=$(gh api repos/${{ github.repository }}/actions/workflows/nightly-full-suite.yml/runs --jq '.workflow_runs[0].id' 2> /dev/null || true)
          if [ -n "$RUN_ID" ] && gh run download "$RUN_ID" -n tia-history-client -d /tmp/tia-history-restore --dir > /dev/null 2>&1 && [ -f /tmp/tia-history-restore/tia-history.json ]; then
            cp /tmp/tia-history-restore/tia-history.json apps/client/node_modules/.cache/tia/tia-history.json || true
            echo "::notice::tia-history: restored fail-first ordering history from nightly run $RUN_ID."
          else
            echo "::notice::tia-history: no ordering history artifact available — fail-first runs in deterministic order."
          fi
        shell: bash

      # Instrumentación de duración — G1.1 del change `test-sharding` (siempre,
      # sin matriz). GitHub Actions no expone la duración de un step, así que se
      # marca el inicio del step de tests aquí y el step advisory posterior calcula
      # el delta. Append-only: no altera el run ni el argv de tests.
      - name: Mark test step start
        run: |
          echo "TEST_STEP_START=$(date +%s)" >> "$GITHUB_ENV"
        shell: bash

      - name: Run Client Unit Tests (TIA / full suite)
        run: |
          mkdir -p apps/client/reports
          echo "scope=${STEPS_TIA_OUTPUTS_SCOPE}" > apps/client/reports/tia-scope.txt
          if [ "${STEPS_TIA_OUTPUTS_SCOPE}" = "changed" ]; then
            npm run test:changed:ci --workspace=apps/client -- ${STEPS_QUARANTINE_OUTPUTS_ARGS}
            # Guard D7: un diff válido puede no tener NINGÚN test relacionado, y con
            # passWithNoTests (default en Vitest 4) eso sale "No test files found"
            # con exit 0 — un verde VACÍO que el agregador contaría como tests
            # ejecutados. Si la corrida no ejecutó ningún test, se cae a suite
            # completa en vez de fingir cobertura.
            RAN=$(node -p "require('./apps/client/reports/vitest-results.json').numTotalTests" 2> /dev/null || echo 0)
            if [ "${RAN:-0}" -eq 0 ]; then
              echo "::warning::TIA matched 0 tests for this diff (numTotalTests=${RAN:-0}); running the FULL client suite instead of reporting a vacuous green."
              echo "scope=full" > apps/client/reports/tia-scope.txt
              npm run test:coverage:ci --workspace=apps/client -- ${STEPS_QUARANTINE_OUTPUTS_ARGS}
            fi
          else
            npm run test:coverage:ci --workspace=apps/client -- ${STEPS_QUARANTINE_OUTPUTS_ARGS}
          fi
        shell: bash
        env:
          STEPS_TIA_OUTPUTS_SCOPE: ${{ steps.tia.outputs.scope }}
          STEPS_QUARANTINE_OUTPUTS_ARGS: ${{ steps.quarantine.outputs.args }}

      # Duración del step de tests — G1.1 del change `test-sharding` (advisory:
      # `if: always()`, append-only al step summary, nunca gate ni exit 1).
      - name: Report test step duration (advisory)
        if: always()
        run: |
          NOW=$(date +%s)
          START="${TEST_STEP_START:-}"
          case "$START" in
            ''|*[!0-9]*)
              echo "::notice::test-unit-client: test step duration not measured (no start marker)."
              ;;
            *)
              SECS=$((NOW - START))
              {
                echo "### Test step duration — advisory"
                echo ""
                echo "| job | test step wall-time |"
                echo "| --- | --- |"
                echo "| \`test-unit-client\` | ${SECS}s |"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::notice::test-unit-client: test step duration ${SECS}s."
              ;;
          esac
        shell: bash

      # Shadow metric — spec ci-test-impact-analysis (D2/D10). Mide QUÉ habría
      # seleccionado TIA sin alterar nada: advisory por contrato (el script
      # siempre sale 0 y el step va con `if: always()`), D7 sigue siendo el
      # único safety net de selección vacía.
      # Inyección de tests previamente fallidos — spec ci-test-impact-analysis
      # (task 4.3/4.4, design D4). Best-effort: descarga el artefacto de historial
      # del nightly/full-suite más reciente resolviendo el run-id con `gh api` y
      # `gh run download` (patrón de flaky-weekly.yml); ausente → no-op. Deja la
      # lista inyectada en un fichero que `tia-select.mjs` lee en su fase 1b.
      - name: Inject previously-failing tests
        if: always()
        id: inject
        run: |
          mkdir -p apps/client/reports
          INJECTED=0
          if gh api repos/${{ github.repository }}/actions/workflows/nightly-full-suite.yml/runs --jq '.workflow_runs[0].id' > /dev/null 2>&1; then
            RUN_ID=$(gh api repos/${{ github.repository }}/actions/workflows/nightly-full-suite.yml/runs --jq '.workflow_runs[0].id')
            if gh run download "$RUN_ID" -n tia-history-client -d /tmp/tia-history-client --dir > /dev/null 2>&1 && [ -f /tmp/tia-history-client/tia-history.json ]; then
              cp /tmp/tia-history-client/tia-history.json apps/client/reports/tia-history.json
              INJECTED=$(node scripts/ci/tia-history.mjs apps/client --inject | wc -l | tr -d ' ')
              echo "injected=$INJECTED" >> "$GITHUB_OUTPUT"
              echo "::notice::tia-history: injected $INJECTED previously-failing client file(s) from nightly run $RUN_ID."
            else
              echo "::notice::tia-history: no matching client history artifact found — injection is a no-op."
            fi
          else
            echo "::notice::tia-history: github CLI not available or no nightly runs — injection is a no-op."
          fi
          echo "injected=$INJECTED" >> "$GITHUB_OUTPUT"
        shell: bash

      # Consumo del coverage-map — task 7.3 (design D5). Best-effort y exit 0
      # garantizado (guardas `|| true` en shell, sin `continue-on-error`):
      # resuelve el run-id satisfactorio más reciente de
      # `nightly-full-suite.yml` con `gh api`, lista el artefacto por prefijo
      # `coverage-map-client-` (el nombre lleva el sha, task 7.2 — se resuelve
      # exacto por API como en `flaky-weekly.yml`) y lo descarga con
      # `gh run download`. Si el JSON es válido se deja en
      # `reports/coverage-map.json` y se anuncia `map=hit`; ausente o
      # corrupto → `map=miss` y D7 sigue detrás. El aviso `::notice::`
      # alimenta la métrica shadow.
      - name: Consume coverage-map (best-effort)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apps/client/reports .tmp/cm-client || true
          MAP=miss
          if RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/nightly-full-suite.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id' 2>/dev/null || true) && [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
            ART=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[] | select(.name | startswith("coverage-map-client-")) | .name' 2>/dev/null | head -n 1 || true)
            if [ -n "$ART" ] && gh run download "$RUN_ID" -n "$ART" -D .tmp/cm-client >/dev/null 2>&1; then
              CM_JSON=$(find .tmp/cm-client -name 'coverage-map.json' -print -quit 2>/dev/null || true)
              if [ -n "$CM_JSON" ] && CM_JSON="$CM_JSON" node -e "try { JSON.parse(require('fs').readFileSync(process.env.CM_JSON, 'utf8')); } catch (e) { process.exit(1); }"; then
                cp "$CM_JSON" apps/client/reports/coverage-map.json || true
                MAP=hit
              fi
            fi
          fi
          echo "::notice::coverage-map: map=$MAP (client)."
        shell: bash

      - name: Resolve TIA shadow metric
        if: always()
        run: node scripts/ci/tia-metric.mjs apps/client
        shell: bash

      # Métrica first-failure / TTFF — change `smart-test-ordering` (task 2.2).
      # Advisory con el mismo contrato no-gating que el summary TIA: `if: always()`
      # y `|| true` para que un fallo de la observabilidad nunca voltee el job.
      - name: Resolve first-failure metric
        if: always()
        run: node scripts/ci/ttff-metric.mjs apps/client || true
        shell: bash

      # Coverage-map build — task 7.1/7.2 (design D5). El mapa se publica como
      # artefacto versionado por base-sha para que los PRs scoped lo consuman
      # (task 7.3). Best-effort: en diff-scoped el mapa es el del nightly; este
      # step siempre escribe un coverage-map.json válido (aunque pueda ser vacío
      # si no hubo cobertura en la corrida) para que el artefacto exista.
      # La publicación del artefacto se limita a scope=full (task 7.2: "solo
      # scope=full y nocturno") — el scope resuelto se expone como output del
      # step leyendo reports/tia-scope.txt (mismo fichero que consume la
      # métrica shadow y `Enforce coverage thresholds`).
      - name: Build coverage-map (best-effort)
        id: coverage-map
        if: always()
        run: |
          node scripts/ci/tia-map.mjs apps/client --build || true
          SCOPE=$(tr -d '[:space:]' < apps/client/reports/tia-scope.txt 2>/dev/null || true)
          echo "scope=${SCOPE}" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.coverage-map.outputs.scope == 'full'
        with:
          name: coverage-map-client-${{ github.sha }}
          path: apps/client/reports/coverage-map.json
          retention-days: 30
          if-no-files-found: warn

      # Artefacto de cobertura del shard — change `coverage-merge-gate` (gap b).
      # - Nombre con ÍNDICE de shard: `upload-artifact@v4+` es INMUTABLE; dos shards
      #   subiendo `coverage-client` a la vez → solo gana una y la otra se pierde en
      #   silencio. Con N=1 el índice es literal `shard-1`; al habilitar la matriz N=2
      #   de `test-sharding` pasa a `shard-${{ matrix.shard }}` (su task).
      # - `path` multilínea con LCA `apps/client` para que `coverage/` y
      #   `.vitest-reports/` viajen con rutas relativas intactas y el puente los
      #   restaure con `merge-multiple` hacia `apps/client/`.
      # - `include-hidden-files: true`: `.vitest-reports/` es directorio OCULTO y
      #   `upload-artifact@v4+` lo excluiría por defecto → el merge no tendría blobs.
      # - `retention-days: 3`: con N shards cada una genera su coverage parcial (casi
      #   siempre descartado); el merged es el único artefacto de verdad.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage-client-shard-1
          path: |
            apps/client/coverage/
            apps/client/.vitest-reports/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
      # Evidencia de flakiness (retryCount/flaky por test) para la métrica
      # semanal — D8. El JUnit colapsa los retries, por eso este artifact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: flaky-evidence-client
          path: |
            apps/client/reports/junit.xml
            apps/client/reports/vitest-results.json
            apps/client/reports/flaky-retries.json
            apps/client/reports/tia-scope.txt
          retention-days: 30
          if-no-files-found: warn
      # Historial de tests fallidos en main — task 4.1 (tia-history.mjs).
      # Source: reports/vitest-results.json (ya generado por el step de tests).
      # Se consolida en tia-history.json y se sube como artefacto con retención
      # 30 días (mismo patrón que flaky-evidence-*). Los jobs scoped lo
      # descargan en el step `Inject previously-failing tests` (task 4.4).
      - name: Record TIA history
        if: always()
        run: |
          mkdir -p apps/client/reports
          node scripts/ci/tia-history.mjs apps/client --record --out apps/client/reports/tia-history.json || true
        shell: bash

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: tia-history-client
          path: apps/client/reports/tia-history.json
          retention-days: 30
          if-no-files-found: warn

      - name: Report Client Unit Tests
        if: success() || failure()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          name: Client Unit Tests
          path: apps/client/reports/junit.xml
          reporter: java-junit

  test-unit-server:
    # BLOCKING desde 2026-10-29 (task 3.1 del change `ci-testing-gate-promotion`); suite
    # unit-scoped (*.unit.test.js, sin PostgreSQL) con junit para dorny/test-reporter.
    # Sin `continue-on-error`, un fallo propaga a `prebuild-tests-complete` (con el COE
    # de FASE 1, `needs.*.result` reportaba `success` aunque el job fallara,
    # actions/toolkit#581).
    # Merge queue y workflow_dispatch también ejecutan — task 4.2 del change
    # `tia-enterprise-gaps`: la cláusula `pull_request` original permitía integrar
    # sin tests. El path-scoping legítimo de PRs se conserva (mismos outputs).
    if: needs.repo-discovery.outputs.server == 'true' || needs.repo-discovery.outputs.shared == 'true'
    name: 'Tests: Unit - Server'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # `actions: read` es necesario para descargar el artefacto `tia-history-*`
      # de OTRO run (restore del historial fail-first, task 1.1 de
      # `smart-test-ordering`) — sin este scope el `gh run download` falla y el
      # restore sería un no-op silencioso.
      actions: read
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          prisma: 'true'

      # TIA — spec ci-test-impact-analysis (D7). Misma política que el job client:
      # diff-scoped si origin/main resuelve, suite completa si `shared == 'true'`
      # o si la base no es resoluble (fallback ruidoso, nunca "0 tests afectados").
      - name: Resolve TIA scope (diff-scoped vs full suite)
        id: tia
        # Override manual — task 2.2 del change `tia-enterprise-gaps` (espejo del
        # job client). En `merge_group` el label evalúa `false`: la rama de merge
        # queue fuerza `scope=full` abajo.
        env:
          FULL_SUITE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full-suite') }}
          FULL_SUITE_INPUT: ${{ inputs.full_suite || false }}
          NEEDS_REPO_DISCOVERY_OUTPUTS_SHARED: ${{ needs.repo-discovery.outputs.shared }}
        run: |
          if [ "$FULL_SUITE_LABEL" = "true" ] || [ "$FULL_SUITE_INPUT" = "true" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "::notice::manual override (label ci:full-suite / input full_suite) — running the FULL server suite."
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "::notice::merge queue — running the FULL server suite before integration."
          elif [ "${NEEDS_REPO_DISCOVERY_OUTPUTS_SHARED}" = "true" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "::notice::shared path changed (root manifest, lockfile, workflows or global configs) — running the FULL server suite."
          elif git rev-parse --verify --quiet origin/main > /dev/null; then
            echo "scope=changed" >> "$GITHUB_OUTPUT"
            echo "::notice::origin/main resolved — running the diff-scoped server suite."
          else
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "::warning::origin/main is NOT resolvable in this checkout; falling back to the FULL suite (never reporting '0 affected tests')."
          fi
        shell: bash

      # Exclusiones de cuarentena — spec ci-flaky-quarantine (D9, task 5.2).
      - name: Derive quarantine exclusions
        id: quarantine
        run: echo "args=$(node scripts/ci/quarantine-exclude.mjs --format=argv)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Report quarantine exclusions in the run
        if: always()
        run: node scripts/ci/quarantine-exclude.mjs --format=md >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      # Restore del historial fail-first — change `smart-test-ordering` (task 1.1,
      # design D2). El artefacto `tia-history-server` del nightly/full-suite se
      # descarga a la ruta EXACTA que lee el sequencer ANTES del step de tests.
      # Best-effort y exit 0 garantizado: sin artefacto o con JSON corrupto el
      # orden degrada al determinista documentado y el job nunca falla por ello.
      - name: Restore ordering history (fail-first)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apps/server/node_modules/.cache/tia || true
          RUN_ID=$(gh api repos/${{ github.repository }}/actions/workflows/nightly-full-suite.yml/runs --jq '.workflow_runs[0].id' 2> /dev/null || true)
          if [ -n "$RUN_ID" ] && gh run download "$RUN_ID" -n tia-history-server -d /tmp/tia-history-restore --dir > /dev/null 2>&1 && [ -f /tmp/tia-history-restore/tia-history.json ]; then
            cp /tmp/tia-history-restore/tia-history.json apps/server/node_modules/.cache/tia/tia-history.json || true
            echo "::notice::tia-history: restored fail-first ordering history from nightly run $RUN_ID."
          else
            echo "::notice::tia-history: no ordering history artifact available — fail-first runs in deterministic order."
          fi
        shell: bash

      # Instrumentación de duración — G1.1 del change `test-sharding` (siempre,
      # sin matriz). Ver la nota del job client: se marca el inicio del step de
      # tests y el step advisory posterior calcula el delta. Append-only.
      - name: Mark test step start
        run: |
          echo "TEST_STEP_START=$(date +%s)" >> "$GITHUB_ENV"
        shell: bash

      - name: Run Server Unit Tests (TIA / full suite)
        run: |
          mkdir -p apps/server/reports
          echo "scope=${STEPS_TIA_OUTPUTS_SCOPE}" > apps/server/reports/tia-scope.txt
          if [ "${STEPS_TIA_OUTPUTS_SCOPE}" = "changed" ]; then
            npm run test:changed:ci --workspace=apps/server -- ${STEPS_QUARANTINE_OUTPUTS_ARGS}
            # Guard D7: ver la nota del job client. Con passWithNoTests un diff sin
            # tests relacionados sale verde vacío; aquí se cae a la suite unit
            # completa y el scope se corrige a `full` para que D18 aplique umbral.
            RAN=$(node -p "require('./apps/server/reports/vitest-results.json').numTotalTests" 2> /dev/null || echo 0)
            if [ "${RAN:-0}" -eq 0 ]; then
              echo "::warning::TIA matched 0 tests for this diff (numTotalTests=${RAN:-0}); running the FULL server suite instead of reporting a vacuous green."
              echo "scope=full" > apps/server/reports/tia-scope.txt
              npm run test:coverage:unit:ci --workspace=apps/server -- ${STEPS_QUARANTINE_OUTPUTS_ARGS}
            fi
          else
            npm run test:coverage:unit:ci --workspace=apps/server -- ${STEPS_QUARANTINE_OUTPUTS_ARGS}
          fi
        shell: bash
        env:
          STEPS_TIA_OUTPUTS_SCOPE: ${{ steps.tia.outputs.scope }}
          STEPS_QUARANTINE_OUTPUTS_ARGS: ${{ steps.quarantine.outputs.args }}

      # Duración del step de tests — G1.1 del change `test-sharding` (advisory:
      # `if: always()`, append-only al step summary, nunca gate ni exit 1).
      - name: Report test step duration (advisory)
        if: always()
        run: |
          NOW=$(date +%s)
          START="${TEST_STEP_START:-}"
          case "$START" in
            ''|*[!0-9]*)
              echo "::notice::test-unit-server: test step duration not measured (no start marker)."
              ;;
            *)
              SECS=$((NOW - START))
              {
                echo "### Test step duration — advisory"
                echo ""
                echo "| job | test step wall-time |"
                echo "| --- | --- |"
                echo "| \`test-unit-server\` | ${SECS}s |"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::notice::test-unit-server: test step duration ${SECS}s."
              ;;
          esac
        shell: bash

      # Shadow metric — spec ci-test-impact-analysis (D2/D10). Ver nota del job
      # client: advisory por contrato, `if: always()`, nunca voltea el resultado.
      # Inyección de tests previamente fallidos — spec ci-test-impact-analysis
      # (task 4.3/4.4, design D4). Best-effort: descarga el artefacto de historial
      # del nightly/full-suite más reciente resolviendo el run-id con `gh api` y
      # `gh run download` (patrón de flaky-weekly.yml); ausente → no-op. Deja la
      # lista inyectada en un fichero que `tia-select.mjs` lee en su fase 1b.
      - name: Inject previously-failing tests
        if: always()
        id: inject
        run: |
          mkdir -p apps/server/reports
          INJECTED=0
          if gh api repos/${{ github.repository }}/actions/workflows/nightly-full-suite.yml/runs --jq '.workflow_runs[0].id' > /dev/null 2>&1; then
            RUN_ID=$(gh api repos/${{ github.repository }}/actions/workflows/nightly-full-suite.yml/runs --jq '.workflow_runs[0].id')
            if gh run download "$RUN_ID" -n tia-history-server -d /tmp/tia-history-server --dir > /dev/null 2>&1 && [ -f /tmp/tia-history-server/tia-history.json ]; then
              cp /tmp/tia-history-server/tia-history.json apps/server/reports/tia-history.json
              INJECTED=$(node scripts/ci/tia-history.mjs apps/server --inject | wc -l | tr -d ' ')
              echo "injected=$INJECTED" >> "$GITHUB_OUTPUT"
              echo "::notice::tia-history: injected $INJECTED previously-failing server file(s) from nightly run $RUN_ID."
            else
              echo "::notice::tia-history: no matching server history artifact found — injection is a no-op."
            fi
          else
            echo "::notice::tia-history: github CLI not available or no nightly runs — injection is a no-op."
          fi
          echo "injected=$INJECTED" >> "$GITHUB_OUTPUT"
        shell: bash

      # Consumo del coverage-map — task 7.3 (design D5). Espejo del job
      # client: mismo contrato best-effort (exit 0 garantizado, sin
      # `continue-on-error`), artefacto `coverage-map-server-*` del nightly,
      # `map=hit` solo con JSON válido en `reports/coverage-map.json`.
      - name: Consume coverage-map (best-effort)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apps/server/reports .tmp/cm-server || true
          MAP=miss
          if RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/nightly-full-suite.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id' 2>/dev/null || true) && [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
            ART=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[] | select(.name | startswith("coverage-map-server-")) | .name' 2>/dev/null | head -n 1 || true)
            if [ -n "$ART" ] && gh run download "$RUN_ID" -n "$ART" -D .tmp/cm-server >/dev/null 2>&1; then
              CM_JSON=$(find .tmp/cm-server -name 'coverage-map.json' -print -quit 2>/dev/null || true)
              if [ -n "$CM_JSON" ] && CM_JSON="$CM_JSON" node -e "try { JSON.parse(require('fs').readFileSync(process.env.CM_JSON, 'utf8')); } catch (e) { process.exit(1); }"; then
                cp "$CM_JSON" apps/server/reports/coverage-map.json || true
                MAP=hit
              fi
            fi
          fi
          echo "::notice::coverage-map: map=$MAP (server)."
        shell: bash

      - name: Resolve TIA shadow metric
        if: always()
        run: node scripts/ci/tia-metric.mjs apps/server
        shell: bash

      # Métrica first-failure / TTFF — change `smart-test-ordering` (task 2.2).
      # Advisory con el mismo contrato no-gating que el summary TIA: `if: always()`
      # y `|| true` para que un fallo de la observabilidad nunca voltee el job.
      - name: Resolve first-failure metric
        if: always()
        run: node scripts/ci/ttff-metric.mjs apps/server || true
        shell: bash

      # Coverage-map build — task 7.1/7.2 (design D5). Espejo del job client:
      # el mapa se publica versionado por base-sha
      # (`coverage-map-server-<sha>`, el sha interno lo escribe `tia-map.mjs`,
      # task 7.1) para que los PRs scoped lo consuman (task 7.3).
      # Best-effort: este step siempre escribe un coverage-map.json válido
      # (aunque pueda ser vacío si no hubo cobertura en la corrida).
      # La publicación del artefacto se limita a scope=full (task 7.2: "solo
      # scope=full y nocturno") — el scope resuelto se expone como output del
      # step leyendo reports/tia-scope.txt.
      - name: Build coverage-map (best-effort)
        id: coverage-map
        if: always()
        run: |
          node scripts/ci/tia-map.mjs apps/server --build || true
          SCOPE=$(tr -d '[:space:]' < apps/server/reports/tia-scope.txt 2>/dev/null || true)
          echo "scope=${SCOPE}" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.coverage-map.outputs.scope == 'full'
        with:
          name: coverage-map-server-${{ github.sha }}
          path: apps/server/reports/coverage-map.json
          retention-days: 30
          if-no-files-found: warn

      # Artefacto de cobertura del shard — change `coverage-merge-gate` (gap b). Mismo
      # contrato que el de client: índice de shard literal con N=1 (inmutabilidad de
      # `upload-artifact@v4+`), LCA `apps/server` para restaurar `tests/coverage/` y
      # `.vitest-reports/` en el puente, directorio oculto incluido y retención corta.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage-server-shard-1
          path: |
            apps/server/tests/coverage/
            apps/server/.vitest-reports/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
      # Evidencia de flakiness (retryCount/flaky por test) para la métrica
      # semanal — D8. El JUnit colapsa los retries, por eso este artifact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: flaky-evidence-server
          path: |
            apps/server/reports/junit.xml
            apps/server/reports/vitest-results.json
            apps/server/reports/flaky-retries.json
            apps/server/reports/tia-scope.txt
          retention-days: 30
          if-no-files-found: warn
      # Historial de tests fallidos en main — task 4.1 (tia-history.mjs).
      # Source: reports/vitest-results.json (ya generado por el step de tests).
      # Se consolida en tia-history.json y se sube como artefacto con retención
      # 30 días (mismo patrón que flaky-evidence-*). Los jobs scoped lo
      # descargan en el step `Inject previously-failing tests` (task 4.4).
      - name: Record TIA history
        if: always()
        run: |
          mkdir -p apps/server/reports
          node scripts/ci/tia-history.mjs apps/server --record --out apps/server/reports/tia-history.json || true
        shell: bash

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: tia-history-server
          path: apps/server/reports/tia-history.json
          retention-days: 30
          if-no-files-found: warn
      - name: Report Server Unit Tests
        if: success() || failure()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          name: Server Unit Tests
          path: apps/server/reports/junit.xml
          reporter: java-junit

  client-coverage:
    # FASE 1 advisory. Scoping por PROPAGACIÓN de skip del upstream (needs = exactamente
    # su test job; client-build sigue if: false — deadlock de skipped). NOTA D17: el if
    # explícito con needs.repo-discovery.outputs NO es viable aquí — GHA solo expone el
    # contexto needs de jobs DECLARADOS en needs (actionlint: property not defined) y el
    # job se saltaría siempre. La propagación cubre el mismo conjunto: corre ⇔ corrió su test job.
    # ACTIVADO (change `coverage-tripwire-stage-2d`): retirado `if: false`.
    # O job corre ⇔ test-unit-client correu (propagación de skip). BLOCKING desde
    # 2026-10-29 (task 3.1 del change `ci-testing-gate-promotion`): sin
    # `continue-on-error`, un fallo propaga a `prebuild-tests-complete`.
    #
    # PUENTE DEL COVERAGE MERGE GATE — change `coverage-merge-gate` (D1/D2). Este job ES el
    # puente de NOMBRE FIJO que fusiona la cobertura de TODAS las shards y evalúa los
    # thresholds globales UNA SOLA VEZ, post-merge. No se crea ningún job nuevo: el
    # agregador `prebuild-tests-complete` lo sigue viendo entre sus 5 `needs`.
    # - `!cancelled()`: el default `success()` se saltaría el gate justo cuando una shard
    #   falló (el informe importa más entonces); `always()` además correría tras una
    #   cancelación explícita del usuario, gastando un runner en un run descartado.
    # - `result != 'skipped'`: propaga el skip del upstream SIN ejecutar el job. Sin esa
    #   cláusula, sólo `!cancelled()` correría con upstream SKIPPED y la validación de
    #   presencia emitiría un `::error::` falso por artifacts legítimamente ausentes.
    #   El carril PR queda cubierto por propagación: `test-unit-client` sólo corre en PRs.
    if: ${{ !cancelled() && needs.test-unit-client.result != 'skipped' }}
    name: 'Quality: Client Coverage'
    needs: [test-unit-client]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      # change `coverage-merge-gate` (D3): TODOS los artifacts de shard por patrón +
      # `merge-multiple` hacia la LCA `apps/client/`, restaurando `.vitest-reports/`
      # y `coverage/` con sus rutas relativas intactas. Con N=1 el patrón captura el
      # único artifact ⇒ mismo camino que con matriz (sin rama condicional que pueda
      # divergir y romperse sólo al pasar a matriz).
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: coverage-client-shard-*
          merge-multiple: true
          path: apps/client/
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: flaky-evidence-client
          path: apps/client/reports/
      # Validación de presencia + guard N=0 — change `coverage-merge-gate` (D4). DOS
      # entradas distintas, en este orden, ANTES de mergear ni de medir:
      #  (1) entrada del MERGE: blobs de Vitest (`.vitest-reports/`) no vacíos;
      #  (2) entrada del GATE: `coverage-summary.json` existente.
      # La rama "upstream salteado" NO llega aquí: se resuelve en el `if` del job (task
      # 2.1), así que la única situación posible en este step es "upstream corrió pero
      # artifacts/blobs ausentes" ⇒ `exit 1`. Nunca se mergeará vacío ni se evaluará una
      # cobertura 0% (anti-patrón: tratar un parcial como fuente de verdad).
      - name: Validate shard artifacts (merge gate, N=0 guard)
        run: |
          test -d apps/client/.vitest-reports && [ -n "$(ls -A apps/client/.vitest-reports)" ] || { echo "::error::vitest blob reports missing — merge cannot proceed"; exit 1; }
          test -f apps/client/coverage/coverage-summary.json || { echo "::error::coverage artifact missing"; exit 1; }
      # Merge de shards — change `coverage-merge-gate` (orden canónico shard → merge →
      # check-coverage). `working-directory: apps/client` para que la root de config de
      # Vitest, el dir de blobs (default de `--merge-reports` = `.vitest-reports` relativo
      # al cwd) y el `reportsDirectory` de coverage resuelvan sin flags extra. SIN
      # `--reporter=blob`: el merge no ejecuta tests y el flag sólo emitiría un blob
      # espurio que podría pisar los blobs merged.
      - name: Merge shard reports (vitest --merge-reports --coverage)
        working-directory: apps/client
        run: npx vitest --merge-reports --coverage
      - name: Upload merged coverage (client)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-merged-client
          path: apps/client/coverage/
          retention-days: 14
          if-no-files-found: warn
      # D18: el tripwire de thresholds SOLO evalúa cobertura de suite completa.
      # Una corrida TIA solo carga los tests afectados, así que sus totales no son
      # comparables con los thresholds globales (falso fail al reportar 0% en lo no
      # corrido, o fail-silencioso al subir el % al testear solo lo ya cubierto).
      # En diff-scoped se exige la presencia del artefacto y se difiere el umbral
      # a la próxima full-suite (que cierran los PRs `shared` y el nocturno).
      - name: Enforce coverage thresholds (full suite only, D18)
        run: |
          SCOPE=$(tr -d '[:space:]' < apps/client/reports/tia-scope.txt 2>/dev/null || true)
          SCOPE=${SCOPE:-full}
          echo "TIA scope: $SCOPE"
          if [ ! -f apps/client/coverage/coverage-summary.json ]; then
            echo "::error::coverage artifact missing — the test job did not produce coverage"
            exit 1
          fi
          if [ "${SCOPE}" != "full" ]; then
            echo "::notice::diff-scoped run: thresholds deferred to the next full-suite run (D18) — reporting diff-limited coverage as advisory."
            node scripts/ci/check-coverage.mjs apps/client --type unit --advisory
            exit 0
          fi
          node scripts/ci/check-coverage.mjs apps/client --type unit
      - name: Diff coverage (client)
        run: node scripts/ci/diff-coverage.mjs 80 apps/client/coverage/coverage-summary.json
      # Propagación de fallo de shards — change `coverage-merge-gate` (D7). Un verde
      # parcial que oculta shards rojas no es aceptable. Va DESPUÉS del D18 para que la
      # evaluación de cobertura siga siendo visible en el log cuando una shard falla;
      # el `exit 0` del carril diff-scoped vive dentro del step previo, así que no
      # interfiere. ACTIVO desde 2026-10-29: `test-unit-client` ya NO tiene
      # `continue-on-error` (task 3.1 del change `ci-testing-gate-promotion`), así que
      # `needs.*.result` reporta `failure` real cuando una shard roja y este step
      # propaga el fallo al agregador.
      - name: Propagate shard failure
        if: ${{ contains(needs.test-unit-client.result, 'failure') }}
        run: |
          echo "::error::test-unit-client reported failure — merged coverage above does not make this gate green"
          exit 1

  server-coverage:
    # FASE 1 advisory. Scoping por propagación (misma corrección D17 que client-coverage);
    # el guard recibe el reportsDirectory real del server como 3.er argumento.
    # ACTIVADO (change `coverage-tripwire-stage-2d`): retirado `if: false`.
    # O job corre ⇔ test-unit-server correu (propagación de skip). BLOCKING desde
    # 2026-10-29 (task 3.1 del change `ci-testing-gate-promotion`): sin
    # `continue-on-error`, un fallo propaga a `prebuild-tests-complete`.
    #
    # PUENTE DEL COVERAGE MERGE GATE — change `coverage-merge-gate` (D1/D2), espejo del
    # client. Fusiona la cobertura de todas las shards y evalúa los thresholds UNA SOLA
    # VEZ, post-merge, bajo el mismo nombre de job (los 6 `needs` del agregador no cambian).
    # `!cancelled()`: corre cuando una shard falla, pero no tras una cancelación del usuario.
    # `result != 'skipped'`: hereda el skip del upstream sin ejecutar (y sin emitir un
    # `::error::` falso por artifacts ausentes legítimos).
    if: ${{ !cancelled() && needs.test-unit-server.result != 'skipped' }}
    name: 'Quality: Server Coverage'
    needs: [test-unit-server]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          prisma: 'true'
      # change `coverage-merge-gate` (D3): descarga por patrón + `merge-multiple`
      # hacia la LCA `apps/server/` (restaura `tests/coverage/` y `.vitest-reports/`).
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: coverage-server-shard-*
          merge-multiple: true
          path: apps/server/
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: flaky-evidence-server
          path: apps/server/reports/
      # Validación de presencia + guard N=0 — change `coverage-merge-gate` (D4). Mismas
      # DOS entradas que el client, con sus rutas específicas: blobs en `.vitest-reports/`
      # y el summary en `tests/coverage/` (`reportsDirectory` del server). La rama
      # "upstream salteado" se resuelve en el `if` del job; aquí sólo puede llegar
      # "upstream corrió pero artifacts/blobs ausentes" ⇒ `exit 1` con mensaje distinto
      # según la entrada faltante.
      - name: Validate shard artifacts (merge gate, N=0 guard)
        run: |
          test -d apps/server/.vitest-reports && [ -n "$(ls -A apps/server/.vitest-reports)" ] || { echo "::error::vitest blob reports missing — merge cannot proceed"; exit 1; }
          test -f apps/server/tests/coverage/coverage-summary.json || { echo "::error::coverage artifact missing"; exit 1; }
      # Merge de shards — change `coverage-merge-gate`: `working-directory: apps/server`
      # (root de config del server → `.vitest-reports/` y `tests/coverage/` resuelven sin
      # flags extra). SIN `--reporter=blob` por la misma razón que en el client.
      - name: Merge shard reports (vitest --merge-reports --coverage)
        working-directory: apps/server
        run: npx vitest --merge-reports --coverage
      - name: Upload merged coverage (server)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-merged-server
          path: apps/server/coverage/
          retention-days: 14
          if-no-files-found: warn
      # D18: el guard de thresholds solo evalúa cobertura de suite completa; en
      # corridas diff-scoped (TIA) se verifica la presencia del artefacto y se
      # difiere el umbral a la próxima full-suite.
      - name: Enforce coverage thresholds (full suite only, D18)
        run: |
          SCOPE=$(tr -d '[:space:]' < apps/server/reports/tia-scope.txt 2>/dev/null || true)
          SCOPE=${SCOPE:-full}
          echo "TIA scope: $SCOPE"
          if [ ! -f apps/server/tests/coverage/coverage-summary.json ]; then
            echo "::error::coverage artifact missing — the test job did not produce coverage"
            exit 1
          fi
          if [ "${SCOPE}" != "full" ]; then
            echo "::notice::diff-scoped run: thresholds deferred to the next full-suite run (D18) — reporting diff-limited coverage as advisory."
            node scripts/ci/check-coverage.mjs apps/server apps/server/tests/coverage --type unit --advisory
            exit 0
          fi
          node scripts/ci/check-coverage.mjs apps/server apps/server/tests/coverage --type unit
      - name: Diff coverage (server)
        run: node scripts/ci/diff-coverage.mjs 80 apps/server/tests/coverage/coverage-summary.json
      # Propagación de fallo de shards — change `coverage-merge-gate` (D7), tras el D18
      # para no esconder la evaluación de cobertura. ACTIVO desde 2026-10-29:
      # `test-unit-server` ya NO tiene `continue-on-error` (task 3.1 del change
      # `ci-testing-gate-promotion`), así que `needs.*.result` reporta `failure` real
      # cuando una shard roja y este step propaga el fallo al agregador.
      - name: Propagate shard failure
        if: ${{ contains(needs.test-unit-server.result, 'failure') }}
        run: |
          echo "::error::test-unit-server reported failure — merged coverage above does not make this gate green"
          exit 1

  property-tests:
    # BLOCKING desde 2026-10-29 (task 3.1 del change `ci-testing-gate-promotion`): sin
    # `continue-on-error`, un fallo propaga a `prebuild-tests-complete`.
    # Merge queue y workflow_dispatch también ejecutan (task 4.2 de
    # `tia-enterprise-gaps`); el path-scoping de PRs se conserva.
    if: needs.repo-discovery.outputs.client == 'true' || needs.repo-discovery.outputs.server == 'true' || needs.repo-discovery.outputs.shared == 'true'
    name: 'Tests: Property Tests'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          prisma: 'true'
      - name: Run Property Tests
        run: npm run test:pbt
        env:
          CI: true
      # G2 (change `pbt-hardening`, tarea 6.1): un fallo de fast-check es
      # reproducible sólo si ves seed + path + contraejemplo. El reporter json
      # los lleva en `failureMessages`; este step los publica en el summary del
      # run para no depender de leer el log completo. Sale 0 siempre: el veredicto
      # del job ya lo fijó el step anterior.
      - name: Publish property failures to job summary
        if: failure()
        run: node scripts/ci/pbt-failure-summary.mjs apps/client/reports/vitest-results.json apps/server/reports/vitest-results.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload property test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pbt-results
          path: '**/reports/vitest-results.json'
          retention-days: 14
          if-no-files-found: warn

  # Baseline ratchet and canonical-doc validation are independent of test
  # selection. Every PR rejects unaudited floor decreases and documentation
  # drift; existing continue-on-error policy is unchanged.

  # ═══════════════════════════════════════════════════════════════
  # PREBUILD: snapshot hygiene (change `snapshot-gates`)
  # ═══════════════════════════════════════════════════════════════
  # G2 — grep gate de update flags. Higiene de REPO: escanea los scripts npm
  # de todos los workspaces y los steps `run:` de TODOS los workflows, así que
  # corre sin filtro de cliente. SIN `continue-on-error`: su rojo propaga a
  # `prebuild-tests-complete`. Sin `setup-monorepo` a propósito: el gate es un
  # scan de texto local (sin red ni instalación), como exige el requirement
  # «pure local text scan (no network, no test execution)».
  snapshot-update-gate:
    name: 'Prebuild: Snapshot Update Gate'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Reject update flags in CI-consumed scripts and workflow steps
        run: node scripts/ci/snapshot-update-gate.mjs

  # G4 + G5 — tamaño (`vitest/no-large-snapshots`) y huérfanos, PROMOVIDO a
  # blocking (definitivo, sin ventana advisory): sin `continue-on-error`; su rojo
  # propaga a `prebuild-tests-complete`. Path-scoped a PRs de cliente (mismo
  # `if` que `client-dead-code`). El inline (`*.ui.test.jsx`) se bloquea además
  # vía `client-lint` (regla en `error`).
  client-snapshot-size:
    if: needs.repo-discovery.outputs.client == 'true' && github.event_name == 'pull_request'
    name: 'Prebuild: Client Snapshot Size'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - name: Check snapshot size
        run: npm run snapshot:size-check
      - name: Check snapshot orphans
        if: success() || failure()
        run: npm run snapshot:orphan-check

  coverage-floor-guard:
    name: 'Quality: Coverage Floor Guard'
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-monorepo
      - name: Validate versioned coverage baseline
        run: npm run coverage:baseline:check
      - name: Verify canonical coverage documentation
        run: npm run coverage:docs:verify
      # Blocking exclusion budget: growth in `coverage.exclude` or ignore
      # markers needs an auditable exception in the versioned baseline.
      - name: Check exclusion budget
        run: npm run coverage:exclusions:check

  # Full-suite coverage is evaluated independently of TIA, so partial reports
  # remain advisory under D18 while every PR gets one blocking full-suite
  # verdict from the same guard used by `npm run coverage:check`.
  coverage-full-gate:
    name: 'Quality: Coverage Full Gate'
    # La condición original era `pull_request` como ÚNICA cláusula (task 4.2 de
    # `tia-enterprise-gaps`): se reformula para cubrir también la merge queue, de
    # modo que el veredicto de floors exista antes de integrar.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          prisma: 'true'
      - name: Run Client full suite with coverage
        run: npm run test:coverage:ci --workspace=apps/client
      - name: Run Server full unit suite with coverage
        run: npm run test:coverage:unit:ci --workspace=apps/server
      - name: Enforce Client full-suite coverage floors
        run: node scripts/ci/check-coverage.mjs apps/client apps/client/coverage --type unit
      - name: Enforce Server full-suite coverage floors
        run: node scripts/ci/check-coverage.mjs apps/server apps/server/tests/coverage --type unit

  # ═══════════════════════════════════════════════════════════════
  # SUBSTAGE 2C: SECURITY — dependency-review, secrets, scancode-license-pr-diff, lockfile-audit, checkov-iac, containerfile-lint, actionlint-advisory, zizmor-advisory, typosquat-guarddog, security-exceptions-check
  # (los 10 cableados a prebuild-security-complete.needs — 9 de security + security-exceptions-check; TODOS blocking desde 2026-11-10: sin job-COE y con gate propio cuando el tool no falla por exit code)
  # (sast es 2A GOVERNANCE standalone, no 2C — ver header 2A; change ci-security-substage-alignment 2026-09-30)
  # ═══════════════════════════════════════════════════════════════
  # ════════════════════════════════════════════════════════════════
  # SECURITY — Dependency Review (inline so ci-complete.needs resolves)
  # ════════════════════════════════════════════════════════════════
  dependency-review:
    name: 'Security: Dependency Review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          # Fail on new vulnerabilities with severity >= moderate (governance intent)
          fail-on-severity: moderate
          # Allow specific vulnerabilities if needed (empty by default)
          allow-ghsas: ''
          # Security intent: vulnerability + license checks
          vulnerability-check: true
          license-check: true
          # License policy: externalizada en `.github/license-policy.yml` (fuente
          # única ejecutable, consumida también por scancode-license-pr-diff vía
          # lectura directa). La clave inline `deny-licenses` estaba deprecated
          # por la acción (issue #938). NOTE: allow-licenses es la alternativa
          # allow-list más estricta y MUTUAMENTE EXCLUYENTE con deny-licenses.
          # SPDX-only: toda entrada debe ser identificador SPDX válido — la
          # acción valida la config al arranque (validateLicenses →
          # spdx-expression-parse) y falla antes de escanear dependencias.
          # npm-custom/private licenses surface como `Other`/`NOASSERTION`, que
          # una deny-list no puede matchear — las cubre la capa ScanCode
          # PR-diff (scancode-license-pr-diff). Validado localmente: ningún
          # paquete del árbol actual porta estas licencias (ver
          # docs/learning/dependency-review.md §4.2).
          # Política narrativa (deny-list, waivers, fail-on-scopes):
          # docs/learning/license-policy.md (change license-compliance)
          config-file: .github/license-policy.yml
          # Publish the findings summary as a PR comment when the gate fails,
          # exercising the already-declared pull-requests: write permission.
          # on-failure keeps green PRs clean; on fork PRs the comment may fail
          # (accepted: the job still fails on findings, see design Risks).
          comment-summary-in-pr: on-failure
          # fail-on-scopes decision (task 4.1): default `runtime` KEPT for now —
          # devDependencies here are build/test tooling, and enabling `development`
          # without a test PR risks blocking tooling-update PRs. Revisit after a
          # controlled PR test (docs/learning/dependency-review.md §4).
          # fail-on-scopes: runtime, development
    # Job-level continue-on-error: false (default) — failures block the check

  secrets:
    name: 'Security: Secret Detection'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `merge_group` (change `secret-scanning-history-governance`, task 3.2): si el
    # job solo corriera en PR, en la merge queue quedaría skipped y el agregador
    # de seguridad no podría distinguir "no escaneado" de "limpio".
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
      security-events: read
    env:
      GIT_LEAKS: ${{ secrets.GIT_LEAKS }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan PR diff for secrets (Gitleaks OSS)
        uses: docker://zricethezav/gitleaks:v8.30.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # El rango sale del evento: `pull_request` usa base/head del PR y
          # `merge_group` los del grupo (mismo diff que la merge queue construye).
          # Las opciones de `git log` van entrecomilladas: sin comillas el
          # contenedor las recibe como flags de gitleaks
          # ("unknown flag: --first-parent").
          args: git --log-opts="--no-merges --first-parent ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}^..${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}" --redact --verbose
      - name: Scan for secrets (licensed action - optional)
        # gitleaks-action v3 escanea pull requests: en `merge_group` no existe el
        # contexto de PR, así que la capa con licencia corre solo en PR (el diff
        # del grupo ya lo cubre el paso OSS de arriba).
        # Licencia nunca es requisito (R3): continue-on-error para que un token
        # inválido/expirado no bloquee el gate (el OSS ya cubre el diff).
        if: ${{ env.GIT_LEAKS != '' && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITLEAKS_LICENSE: ${{ secrets.GIT_LEAKS }}
          # gitleaks-action v3 exige GITHUB_TOKEN para escanear pull requests
          # (breaking change anunciado en su README)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Warn: licensed Gitleaks scan unavailable'
        if: ${{ env.GIT_LEAKS == '' }}
        run: echo "::warning::GIT_LEAKS secret not configured - licensed Gitleaks scan skipped. Using open-source Gitleaks only."

  # Job PR-diff de licencias por archivo (change `license-compliance`, capa L2b,
  # dual job con el audit semanal — D4 del design): ScanCode 32.5.0 sobre los
  # archivos ACMR (Added/Copied/Modified/Renamed) del diff del PR — cierra el gap
  # de `dependency-review`, que solo evalúa manifiestos/lockfiles.
  # FIX 2026-11-10 (change `scancode-license`): la imagen Docker
  # `aboutcode/scancode-toolkit:32.5.0` NO existe (ScanCode no publica imagen
  # oficial; su doc indica buildear desde el Dockerfile del repo) — el scan moría
  # con `pull access denied` (exit 125), el step-COE lo enmascaraba y el evaluate
  # salía 0 con "Report not produced": el job fue un no-op verde desde su
  # creación. Instalación ahora vía `uv tool install` con pin estricto (wheels
  # puros cp310-cp314 en PyPI, verificado 2026-11-10) + verificación de versión.
  # FASE 2 BLOCKING ACTIVA (2026-11-10, decisión del owner): sin job-COE ni
  # step-COE; evaluate fail-closed (sin reporte → exit 1: no se puede distinguir
  # "sin hallazgos" de "no escaneado", mismo criterio que lockfile-audit) y
  # exit 1 con cualquier licencia de la deny-list. La evidencia es el artifact
  # `pr-license-report.json` (retención 14d ≠ 90d del audit semanal). Deny-list
  # única: se lee en runtime de la fuente de verdad ejecutable
  # `.github/license-policy.yml` (fuente canónica: docs/learning/license-policy.md,
  # deny-list confirmada contra el modelo de distribución SaaS del ERP) — sin
  # duplicar la lista aquí ni scrape del workflow; dependency-review la consume
  # vía `config-file`. `LicenseRef-scancode-unknown*` = warning + ticket con SLA
  # de 30 días (template `unknown-license.yml`); escala a bloqueante SOLO si el
  # unknown tiene una excepción vencida en `security/exceptions.yml` (spec
  # `scancode-license`: "unresolved after 30 days"; el job es stateless — la edad
  # del ticket se gobierna vía security/SLA.md §2-3 y el audit semanal). Cableado
  # a `prebuild-security-complete.needs` desde Phase 0 (change
  # `prebuild-security-aggregator-strict`) con skip-authorization ACMR. Sin
  # `scan-list.txt` estático: la lista vive en el diff. El scan corre sobre una
  # copia de los archivos del diff (scope) → node_modules/dist/build/coverage/.git
  # quedan fuera estructuralmente; `*.min.js` se excluye por paridad con el audit
  # semanal.
  scancode-license-pr-diff:
    if: github.event_name == 'pull_request'
    name: 'Security: ScanCode License PR-Diff'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0 (SHA-pinned, nunca @main/@v*)

      - name: Install ScanCode (pinned 32.5.0, nunca latest)
        run: |
          # Python 3.12 pinado (patrón guarddog-verify.sh): wheels puros
          # cp310-cp314 verificados en PyPI (2026-11-10) — sin compilación.
          uv tool install --python 3.12 "scancode-toolkit==32.5.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/scancode" --version | grep -q "32.5.0" \
            || { echo "ERROR: scancode version mismatch (esperado 32.5.0)"; exit 1; }
        shell: bash

      - name: List changed files (ACMR vs base)
        id: diff
        run: |
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > pr-diff-files.txt
          echo "Changed files (ACMR): $(wc -l < pr-diff-files.txt | tr -d ' ')"

      - name: ScanCode license scan of changed files
        id: scan-json
        run: |
          mkdir -p scancode-scope
          while IFS= read -r f; do
            if [ -f "$f" ]; then
              mkdir -p "scancode-scope/$(dirname "$f")"
              cp "$f" "scancode-scope/$f"
            fi
          done < pr-diff-files.txt
          if [ -z "$(ls -A scancode-scope 2>/dev/null)" ]; then
            echo "No scannable files in the ACMR diff (all deleted). Writing empty report."
            echo '{"files": []}' > scancode-scope/pr-license-report.json
            exit 0
          fi
          # Sin step-COE (FASE 2 fail-closed): si el scan muere, el job se tiñe
          # directamente en vez de producir un verde falso. El índice de licencias
          # se buildea en el primer run del binario (~1 min, runner efímero).
          scancode --license --copyright --only-findings \
            --exclude '*.min.js' \
            --json-pp scancode-scope/pr-license-report.json scancode-scope

      - name: Evaluate licenses against unified deny-list (FASE 2 blocking)
        run: |
          REPORT=scancode-scope/pr-license-report.json
          if [ ! -f "$REPORT" ]; then
            # Fail-closed (FASE 2): "Report not produced" ya no es un pase verde
            # (mismo criterio que lockfile-audit: sin reporte no se distingue
            # "sin hallazgos" de "no escaneado").
            echo "::error::pr-license-report.json no producido — el scan falló o no corrió (fail-closed, FASE 2 blocking)"
            exit 1
          fi
          # Deny-list única: leída de la fuente de verdad ejecutable
          # .github/license-policy.yml (la misma que consume dependency-review
          # vía config-file). Sin scrape del YAML del workflow.
          DENY_LIST=$(DENY_POLICY=".github/license-policy.yml" node -e '
            const fs = require("fs");
            const src = fs.readFileSync(process.env.DENY_POLICY, "utf8");
            const lines = src.split(/\r?\n/);
            const start = lines.findIndex((l) => /^deny-licenses:\s*$/.test(l));
            if (start === -1) { console.error("deny-licenses key not found"); process.exit(1); }
            const items = [];
            for (let i = start + 1; i < lines.length; i++) {
              const l = lines[i];
              if (/^\s*-/.test(l)) items.push(l.replace(/^\s*-\s*/, "").trim());
              else if (l.trim() === "" || l.trim().startsWith("#")) continue;
              else break;
            }
            if (items.length === 0) { console.error("deny-licenses empty"); process.exit(1); }
            console.log(items.join(", "));
          ')
          if [ -z "$DENY_LIST" ]; then
            echo "::error::deny-licenses not parseable from .github/license-policy.yml"
            exit 1
          fi
          DENY_LIST="$DENY_LIST" REPORT_PATH="$REPORT" EXCEPTIONS_PATH="security/exceptions.yml" node -e "
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'));
            const denyList = process.env.DENY_LIST.split(',').map((s) => s.trim()).filter(Boolean);
            const denySet = new Set(denyList);
            const normalize = (k) => k.split('-or-later')[0].split('-only')[0];
            const unknownRe = /^LicenseRef-scancode-unknown/;
            const today = new Date().toISOString().slice(0, 10);
            // Excepciones (security/exceptions.yml): parseo lineal del esquema
            // plano que ya valida security-exceptions-check. Un unknown con
            // excepción VENCIDA (expires < hoy, tool scancode, scope = ruta del
            // archivo) escala a bloqueante — spec scancode-license, scenario
            // 'Unknown license unresolved after 30 days'. Sin fichero o sin
            // entradas → cero escaladas.
            const exc = [];
            try {
              let cur = null;
              for (const line of fs.readFileSync(process.env.EXCEPTIONS_PATH, 'utf8').split(/\r?\n/)) {
                if (/^\s*-\s+id:/.test(line)) { cur = {}; exc.push(cur); }
                else if (cur) {
                  const m = line.match(/^\s+(tool|scope|expires):\s*(.+?)\s*$/);
                  if (m) cur[m[1]] = m[2].replace(/^['\"]|['\"]$/g, '');
                }
              }
            } catch (e) { /* sin exceptions.yml legible → sin escaladas */ }
            const escalated = (path) => exc.some((x) => x.tool === 'scancode' && x.scope === path && x.expires && x.expires < today);
            const violations = [];
            const warnings = [];
            for (const f of r.files || []) {
              for (const l of f.licenses || []) {
                const k = l.spdx_license_key || l.key || 'unknown';
                if (unknownRe.test(k)) {
                  if (escalated(f.path)) violations.push('ESCALADO (excepción vencida en security/exceptions.yml): ' + k + ' @ ' + f.path);
                  else warnings.push(k + ' @ ' + f.path);
                } else if (denySet.has(normalize(k))) {
                  violations.push(k + ' @ ' + f.path);
                }
              }
            }
            console.log('Deny-list (from .github/license-policy.yml):', denyList.join(', '));
            console.log('Files with license findings:', (r.files || []).length);
            console.log('Unknown licenses (warning; ticket 30d vía .github/ISSUE_TEMPLATE/unknown-license.yml):', warnings.length);
            for (const w of warnings) console.log('::warning::' + w + ' — abrir ticket (SLA 30 días); extensión solo vía security/exceptions.yml');
            if (violations.length) {
              console.log('::error::Licencias en deny-list o unknowns escalados (FASE 2 blocking): ' + violations.length);
              for (const v of violations) console.log('  - ' + v);
              process.exit(1);
            }
            console.log('Sin licencias de la deny-list en el diff del PR.');
          "

      - name: Upload PR license report artifact (retention 14d)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-license-report
          path: scancode-scope/pr-license-report.json
          retention-days: 14
          if-no-files-found: warn

  # Job PR-time de auditoría de lockfile (change `sca-lockfile-compliance`, capa 2):
  # `npm audit` lee package-lock.json directamente (sin `npm ci`: el audit no
  # necesita el árbol instalado y una instalación añadiría 1-3 min por PR).
  # Umbral moderate (coincide con dependency-review; fuente distinta: CVE del
  # lockfile RESUELTO, incluidos transitivos — no manifiesto).
  # FASE 2 BLOCKING ACTIVA (2026-11-10, task 3.1 del origin change): sin
  # `continue-on-error` ni a nivel job ni en el step de audit → `npm audit` sale
  # 1 con hallazgos >= moderate y el job tiñe el agregador. Un fallo de red o
  # del registro también bloquea (fail-closed: no se puede distinguir "sin
  # hallazgos" de "no auditado").
  # Cableado a prebuild-security-complete.needs desde Phase 0 (change
  # `prebuild-security-aggregator-strict`).
  # Task 1.1-1.3 (change `sca-lockfile-compliance`): guard de lockfile
  # obligatorio (diff-aware vía outputs `manifests`/`lockfile` de
  # `repo-discovery`) + step OSV-Scanner blocking gated al lockfile (SARIF
  # `category: osv-scanner`). El job en sí corre en TODOS los PRs: el audit del
  # lockfile commiteado es cobertura continua barata (spec: "en cada
  # pull_request"); lo diff-aware es el guard y el step OSV.
  # Evidencia: artifact `lockfile-audit-pr` 14d (npm JSON + SARIF OSV). Detecta
  # CVE, no licencias — `deny-licenses` (clave del job dependency-review) NO
  # aplica aquí.
  lockfile-audit:
    if: github.event_name == 'pull_request'
    name: 'Security: Lockfile Audit'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `security-events: write` SOLO para subir el SARIF de OSV-Scanner (mismo
    # patrón que actionlint/zizmor/guarddog); el audit npm no lo necesita.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Task 1.2 del change: GitHub no enforcea el lockfile; un PR que toca un
      # `package.json` sin actualizar `package-lock.json` dejaría el audit
      # evaluando un árbol distinto al declarado. Blocking (FASE 2 activa).
      - name: Verify lockfile updated with manifest changes
        env:
          MANIFESTS_CHANGED: ${{ needs.repo-discovery.outputs.manifests }}
          LOCKFILE_CHANGED: ${{ needs.repo-discovery.outputs.lockfile }}
        run: |
          set -euo pipefail
          echo "manifests changed: ${MANIFESTS_CHANGED:-false} | lockfile changed: ${LOCKFILE_CHANGED:-false}"
          if [ "${MANIFESTS_CHANGED:-false}" = "true" ] && [ "${LOCKFILE_CHANGED:-false}" != "true" ]; then
            echo "::error::Un manifiesto (package.json) cambió sin actualizar package-lock.json. Ejecuta 'npm install --package-lock-only' y commitea el lockfile."
            exit 1
          fi

      - name: Audit resolved lockfile (npm audit, threshold moderate)
        id: audit-json
        run: |
          npm audit --audit-level=moderate --json > audit-report.json

      - name: Summarize npm audit findings
        if: always()
        run: |
          if [ -f audit-report.json ]; then
            node -e "
              const r = JSON.parse(require('fs').readFileSync('audit-report.json', 'utf8'));
              const v = (r.metadata && r.metadata.vulnerabilities) || {};
              console.log('npm audit — vulnerabilities:', JSON.stringify(v));
              if ((v.moderate || 0) + (v.high || 0) + (v.critical || 0) > 0) {
                console.log('::error::Hallazgos >= moderate en lockfile (FASE 2 blocking: el step de auditoría falla)');
              } else {
                console.log('Sin hallazgos >= moderate en el lockfile resuelto.');
              }
            " || echo 'Report parse failed (see artifact)'
          else
            echo 'audit-report.json not produced (see step outcome)'
          fi

      # Task 1.3: cobertura multi-ecosistema (npm/yarn/pnpm/bun) sobre el mismo
      # lockfile. Blocking desde día uno (sin step-COE): OSV suma
      # fuentes (GHSA/RustSec/PyPA…) a `npm audit`, pero NO calcula EPSS/KEV
      # (solo CVSS) — ver `docs/learning/sca-dependency-lockfile-scan.md` §10.
      # Gated: solo corre si el PR toca `package-lock.json` (task 1.3).
      # Calibración: ventana 2026-11-10 → 2026-11-24 (bitácora y criterios de
      # promoción en §11 del mismo doc); la promoción a blocking quita este COE.
      # Binario pinneado + SHA-256 en vez de `google/osv-scanner-action`: el
      # `action.yml` raíz de v2.5.0 no declara `runs:` y la action anidada
      # cambia de CLI entre minors (la política vive aquí, no en un tag móvil).
      - name: Install OSV-Scanner (v2.5.0, checksum)
        if: needs.repo-discovery.outputs.lockfile == 'true'
        env:
          OSV_SCANNER_URL: https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64
          OSV_SCANNER_SHA256: edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" "$OSV_SCANNER_URL"
          echo "$OSV_SCANNER_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"

      - name: OSV-Scanner lockfile scan (SARIF)
        id: osv
        if: needs.repo-discovery.outputs.lockfile == 'true' && hashFiles('$RUNNER_TEMP/osv-scanner') != ''
        run: >
          "$RUNNER_TEMP/osv-scanner" scan -L package-lock.json
          --format=sarif --output-file=osv-scanner.sarif

      - name: Upload OSV SARIF to Code Scanning
        if: always() && hashFiles('osv-scanner.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: osv-scanner.sarif
          category: osv-scanner

      - name: Upload npm audit report artifact (retention 14d)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lockfile-audit-pr
          path: |
            audit-report.json
            osv-scanner.sarif
          retention-days: 14
          if-no-files-found: warn

  # Job PR-time IaC — Policy as Code (change `sca-lockfile-compliance`, capa 4):
  # Checkov sobre Dockerfile/terraform/kubernetes. `soft_fail: false` (gate
  # blocking: hallazgos con exit != 0). Política versionada en `.checkov.yml`,
  # pasada explícita vía input `config_file` (la CLI además la auto-lee del
  # cwd). Cableado a prebuild-security-complete.needs desde Phase 0 (change
  # `prebuild-security-aggregator-strict`): al saltarse en un PR solo se tolera
  # si el diff no toca infra (Dockerfile/.tf/k8s). FASE 2 BLOCKING ACTIVA
  # (2026-11-10): sin job-COE y con `soft_fail: false`; el Dockerfile cubre
  # CKV_DOCKER_2 con HEALTHCHECK, así que no hace falta baseline que oculte
  # deuda. Complementaria a SAST (código) y SCA (dependencias).
  checkov-iac:
    if: github.event_name == 'pull_request'
    name: 'Security: Checkov IaC'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run Checkov IaC scan (blocking, SARIF)
        id: checkov-sarif
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12
        with:
          directory: .
          framework: dockerfile terraform kubernetes
          config_file: .checkov.yml
          output_format: sarif
          output_file_path: checkov-report.sarif
          soft_fail: false

      - name: Upload Checkov report artifact (retention 14d)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checkov-report-pr
          path: checkov-report.sarif
          retention-days: 14
          if-no-files-found: warn

  # Job PR-time de calidad del Containerfile (change `containerfile-lint`):
  # Hadolint = higiene/calidad del Dockerfile (ShellCheck sobre RUN, pin de
  # versiones, capas consolidadas, registry allowlist). NO es capa IaC: eso ya
  # lo cubre `checkov-iac` (CKV_DOCKER_*, política `.checkov.yml`) — separación
  # de capas documentada en `quality-gates.md` §2. Política versionada
  # `.hadolint.yaml` vía input `config` (nunca flags de ignore inline: el flag
  # de CLI anula la lista del config). FASE 2 BLOCKING ACTIVA (2026-11-10):
  # sin job-COE y `failure-threshold: warning` (DL3059 es info; DL3018 está
  # cubierto por el pragma inline justificado del Dockerfile). Cableado a
  # prebuild-security-complete.needs desde Phase 0 (change
  # `prebuild-security-aggregator-strict`).
  containerfile-lint:
    if: github.event_name == 'pull_request'
    name: 'Security: Containerfile Lint'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run Hadolint Containerfile lint (SARIF)
        id: hadolint-sarif
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: apps/server/Dockerfile
          config: .hadolint.yaml
          format: sarif
          output-file: hadolint.sarif
          failure-threshold: warning

      - name: Upload Hadolint SARIF to Code Scanning
        if: always() && hashFiles('hadolint.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: hadolint.sarif
          category: hadolint

      - name: Upload Hadolint report artifact (retention 14d)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hadolint-report-pr
          path: hadolint.sarif
          retention-days: 14
          if-no-files-found: warn

  # Job advisory de pipeline config scan (change `pipeline-config-scan`):
  # actionlint con salida SARIF para la Security tab. Único job de actionlint
  # por PR: consolida al ex-gate bloqueante de 2B (removido — su cobertura
  # vive aquí vía SARIF + Code Scanning y en `zizmor-advisory`).
  # FASE 2 BLOCKING ACTIVA (2026-11-10, tasks 8.2/8.3): sin `continue-on-error`
  # a nivel job; el bloqueo reside SOLO en el step `Enforce actionlint findings`
  # (jq sobre el SARIF), y los uploads conservan `continue-on-error: true` a nivel
  # step (un fallo de permisos en fork PR / Security tab no tiñe el job).
  # Ejecución vía imagen Docker pinneada
  # `rhysd/actionlint:1.7.12` (sin curl|bash de scripts remotos; imagen
  # oficial del autor del binario). La plantilla SARIF oficial se versiona en
  # `.github/actionlint-sarif.tmpl` y se pasa como CONTENIDO de `-format` (la
  # pseudo-plantilla inline produce 0 bytes con exit 0 — verificado v1.7.12).
  # El step de scan lleva `|| true`: con hallazgos actionlint sale 1 y la
  # evidencia debe generarse igual; el gate lo decide el step `jq` posterior.
  # Cableado a `prebuild-security-complete.needs` desde Phase 0 (change
  # `prebuild-security-aggregator-strict`). Política `.github/actionlint.yaml` intacta (montada
  # read-only en el contenedor, no se modifica).
  # change ci-security-substage-alignment (2026-09-30): ubicado en bloque security 2C, orden §23.3
  actionlint-advisory:
    if: github.event_name == 'pull_request'
    name: 'Security: ActionLint (SARIF)'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run actionlint (SARIF, advisory)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 \
            -no-color -config-file .github/actionlint.yaml \
            -format "$(cat .github/actionlint-sarif.tmpl)" .github/workflows/*.y*ml > actionlint.sarif || true
          test -s actionlint.sarif || { echo 'actionlint.sarif vacio'; exit 1; }
          jq -e . actionlint.sarif > /dev/null || { echo 'actionlint.sarif no parseable'; exit 1; }
        shell: bash
      - name: Enforce actionlint findings (blocking)
        # El exit code del scan no sirve: el step de arriba lleva `|| true` para
        # generar siempre la evidencia. El gate real es este parseo del SARIF.
        run: |
          if ! jq -e '[(.runs[0].results // [])[]] | length == 0' actionlint.sarif > /dev/null; then
            echo '::error::actionlint encontró hallazgos (FASE 2 blocking)'
            jq -r '(.runs[0].results // [])[] | "\(.ruleId) — \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' actionlint.sarif
            exit 1
          fi
          echo 'Sin hallazgos de actionlint.'
        shell: bash
      - name: Upload actionlint SARIF to Code Scanning
        if: always() && hashFiles('actionlint.sarif') != ''
        continue-on-error: true # step-COE: un fallo de permisos no tiñe el gate
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: actionlint.sarif
          category: actionlint
      - name: Upload actionlint report artifact (retention 14d)
        if: always()
        continue-on-error: true # step-COE (evidencia, no gate)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: actionlint-report-pr
          path: actionlint.sarif
          retention-days: 14
          if-no-files-found: warn

  # Job advisory zizmor (change `pipeline-config-scan`): cubre el gap
  # `unpinned-uses` que actionlint no detecta. Instalación fijada (A4):
  # setup-uv SHA-pinned (v6.7.0, ubuntu-latest NO trae uv) + `uvx zizmor@1.30.1`
  # (versión exacta, no latest) + verificación de versión antes del scan.
  # `--format=sarif` SIEMPRE termina exit 0 → se valida el fichero (`test -s`
  # + `jq -e .`), nunca el exit code. Política `.github/zizmor.yml`
  # referenciada incondicionalmente (A3). FASE 2 BLOCKING ACTIVA (2026-11-10,
  # tasks 8.1/8.3): sin job-COE, con gate sobre el SARIF scopeado a la regla
  # `unpinned-uses` — el objetivo declarado de la capa y la única regla con
  # política en `.github/zizmor.yml`. El resto de audits (artipacked×52,
  # template-injection×19, self-repository×14, …) sigue advisory hasta triar esa
  # deuda: un gate `results | length == 0` teñiría TODOS los PRs desde el primer
  # run. Los uploads llevan step-COE. Cableado a
  # `prebuild-security-complete.needs` desde Phase 0 (change
  # `prebuild-security-aggregator-strict`).
  # change ci-security-substage-alignment (2026-09-30): ubicado en bloque security 2C, orden §23.3
  zizmor-advisory:
    if: github.event_name == 'pull_request'
    name: 'Security: Zizmor (unpinned-uses)'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0 (SHA-pinned, nunca @main/@v*)
      - name: Run zizmor (SARIF, advisory)
        run: |
          uvx zizmor@1.30.1 --version | grep -q '1.30.1' || { echo 'zizmor version mismatch'; exit 1; }
          uvx zizmor@1.30.1 --format=sarif -c .github/zizmor.yml .github/workflows/ > zizmor.sarif || true
          test -s zizmor.sarif || { echo 'zizmor.sarif vacio'; exit 1; }
          jq -e . zizmor.sarif > /dev/null || { echo 'zizmor.sarif no parseable'; exit 1; }
        shell: bash
      - name: Enforce zizmor findings (blocking, todas las reglas)
        # `--format=sarif` SIEMPRE sale 0 → el gate parsea el fichero. Cubre
        # TODAS las reglas: la deuda de `artipacked`/`template-injection`/
        # `excessive-permissions`/`github-app` está remediada en origen y
        # `self-repository` (help, sin impacto) se ignora por fichero en
        # `.github/zizmor.yml`, no aquí.
        run: |
          if ! jq -e '[(.runs[0].results // [])[]] | length == 0' zizmor.sarif > /dev/null; then
            echo '::error::zizmor encontró hallazgos (FASE 2 blocking: todas las reglas)'
            jq -r '(.runs[0].results // [])[] | "\(.ruleId) — \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' zizmor.sarif
            exit 1
          fi
          echo 'Sin hallazgos de zizmor.'
        shell: bash
      - name: Upload zizmor SARIF to Code Scanning
        if: always() && hashFiles('zizmor.sarif') != ''
        continue-on-error: true # step-COE: un fallo de permisos no tiñe el gate
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: zizmor.sarif
          category: zizmor
      - name: Upload zizmor report artifact (retention 14d)
        if: always()
        continue-on-error: true # step-COE (evidencia, no gate)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zizmor-report-pr
          path: zizmor.sarif
          retention-days: 14
          if-no-files-found: warn

  # Job advisory de typosquatting / dependency confusion (change
  # `typosquatting-detection`): GuardDog v3.2.0 (DataDog, OSS, sin credenciales)
  # sobre package.json — detección por metadatos + YARA que NO duplica a Trivy
  # (CVE/secretos), dependency-review (manifiesto PR) ni lockfile-audit (CVE
  # lockfile). Toda la política vive en el wrapper versionado
  # `scripts/guarddog-verify.sh` (GuardDog no soporta config files): pin 3.2.0
  # con verificación de versión, devDeps excluidas, sandbox obligatorio (nunca
  # --no-sandbox), exclusiones justificadas. `verify` requiere red y puede morir
  # a medias → `|| true` + `test -s` + `jq -e .` antes de subir. Cableado a
  # `prebuild-security-complete.needs` desde Phase 0 (change
  # `prebuild-security-aggregator-strict`): el condicionamiento por path
  # (manifest/lockfile `package*.json`) vive en el skip-authorization del
  # agregador (`(^|/)package(-lock)?\.json$`) — mismo patrón que los otros 5
  # jobs condicionales de 2C (task 1.1 del change `typosquatting-detection`).
  # FASE 2 BLOCKING ACTIVA (2026-11-10): sin job-COE; el gate parsea el SARIF
  # porque el scan lleva `|| true` y su exit code no es señal. Calibración y
  # decisión de promoción: docs/learning/quality-gates.md §7.3.
  # change ci-security-substage-alignment (2026-09-30): ubicado en bloque security 2C, orden §23.3
  typosquat-guarddog:
    if: github.event_name == 'pull_request' && needs.repo-discovery.outputs.manifests == 'true'
    name: 'Security: Typosquat GuardDog'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0 (SHA-pinned, nunca @main/@v*)
      - name: Run GuardDog verify (SARIF, advisory)
        run: |
          bash scripts/guarddog-verify.sh > guarddog.sarif || true
          test -s guarddog.sarif || { echo 'guarddog.sarif vacio'; exit 1; }
          jq -e . guarddog.sarif > /dev/null || { echo 'guarddog.sarif no parseable'; exit 1; }
        shell: bash
      - name: Enforce GuardDog findings (blocking)
        # El scan lleva `|| true` (verify requiere red y puede morir a medias),
        # así que el exit code no es señal: el gate parsea el SARIF y bloquea
        # con cualquier `result` (reglas threat.*/heurísticas).
        run: |
          if ! jq -e '[(.runs[0].results // [])[]] | length == 0' guarddog.sarif > /dev/null; then
            echo '::error::GuardDog detectó typosquatting/dependency-confusion (FASE 2 blocking)'
            jq -r '(.runs[0].results // [])[] | "\(.ruleId) — \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' guarddog.sarif
            exit 1
          fi
          echo 'Sin hallazgos GuardDog.'
        shell: bash
      - name: Upload GuardDog SARIF to Code Scanning
        if: always() && hashFiles('guarddog.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: guarddog.sarif
          category: guarddog
      - name: Upload GuardDog report artifact (retention 14d)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: guarddog-report-pr
          path: guarddog.sarif
          retention-days: 14
          if-no-files-found: warn

  # Job advisory de gobernanza de excepciones (change
  # `security-exceptions-policy`, E6 del PRD): valida `security/exceptions.yml`
  # (schema completo, ids únicos, fechas ISO, `expires <= created + 90` y
  # ninguna excepción vencida). Blocking desde día uno (sin job-COE), cableado a
  # `prebuild-security-complete.needs`. Dependencias vía el composite
  # `setup-monorepo` (`npm ci` desde el lockfile; nada de ad-hoc packages:
  # zizmor `adhoc-packages`).
  security-exceptions-check:
    if: github.event_name == 'pull_request'
    name: 'Security: Exceptions Policy'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-monorepo
      - name: Validate security/exceptions.yml
        run: node scripts/ci/security-exceptions.mjs
        shell: bash

  # ═══════════════════════════════════════════════════════════════
  # SUBSTAGE 2B: CODE QUALITY — lint, format-check, typecheck, complexity, dead-code, import-bounds, e2e-lint, db-contract, validate-pipeline, api-contract, frontend-budgets, openspec-validate, docs-validation (advisory)
  # ═══════════════════════════════════════════════════════════════
  # --- Client Pre-Build ---
  client-lint:
    if: needs.repo-discovery.outputs.client == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Client Lint'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # SARIF upload (change `ci-quality-gates-blocking-hardening`, P2.2). En PRs
      # de forks el token es de solo lectura: el upload va con COE y no tiñe el job.
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      # Caché de ESLint (P1.1): `content` invalida por contenido, no por mtime.
      - name: Restore ESLint cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: apps/client/.cache/eslint
          key: eslint-client-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js') }}
          restore-keys: |
            eslint-client-${{ runner.os }}-
      - name: Lint (ESLint, JSON report for SARIF)
        run: |
          set +e
          npm run lint --workspace=apps/client -- --format json --output-file eslint-report.json
          status=$?
          exit "$status"
      - name: Convert ESLint report to SARIF
        if: always() && hashFiles('apps/client/eslint-report.json') != ''
        run: node scripts/ci/eslint-sarif.mjs apps/client/eslint-report.json apps/client/eslint-results.sarif
      - name: Upload ESLint SARIF
        if: always() && hashFiles('apps/client/eslint-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: apps/client/eslint-results.sarif
          category: eslint-client
  client-format-check:
    if: needs.repo-discovery.outputs.client == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Client Format'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - run: npm run format:check --workspace=apps/client
  client-typecheck:
    if: needs.repo-discovery.outputs.client == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Client TypeCheck'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      # Gate blocking real (change `quality-gates`): sin `|| echo` ni
      # `2>/dev/null` que enmascaren el exit code — un error de compilación
      # falla el job. El client es 100% JS: compila vía tsconfig base
      # (allowJs + checkJs off); flags strict llegan con server-typescript-migration (Fase 4).
      - name: TypeCheck
        run: npx tsc --noEmit
        working-directory: apps/client

  client-complexity:
    if: needs.repo-discovery.outputs.client == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Client Complexity'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      # Gate blocking (change `quality-gates`): sin `--rule` CLI override —
      # los umbrales vienen de eslint.config.js (15 core / 10 utils / off tests).
      - name: Check complexity
        run: npx eslint "src/**/*.{js,jsx}"
        working-directory: apps/client

  client-dead-code:
    if: needs.repo-discovery.outputs.client == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Client Dead Code'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - name: Detect dead code
        # DESDE LA RAÍZ (sin working-directory): el selector --workspace de knip
        # se resuelve relativo al cwd (con cwd=apps/client buscaría
        # apps/client/apps/client → exit 2), y correr desde el workspace eludiría
        # la config raíz knip.jsonc. Selector explícito por workspace.
        run: npx knip --workspace=apps/client --no-progress --reporter json

  client-import-bounds:
    if: needs.repo-discovery.outputs.client == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Client Import Bounds'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      # Gate: corre desde la RAÍZ (config raíz + regex `^apps/...`);
      # --ignore-known respeta el baseline (.dependency-cruiser-known-violations.json).
      - name: Check import boundaries (gate)
        run: npm run depcruise:client -- --output-type err --ignore-known
      # Report no-blocking del grafo combinado (siempre corre, exit code
      # ignorado aquí): el HTML queda como artefacto para inspección del grafo.
      - name: Import boundaries report (no-blocking)
        if: always()
        run: npm run depcruise:report
        continue-on-error: true
      - name: Upload dependency-cruiser report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-cruiser-report-client
          path: reports/dependency-cruiser.html
          if-no-files-found: warn
          retention-days: 7

  # Presupuestos de performance del cliente (change `ci-shifting-left`,
  # capability `frontend-budgets`): size-limit (tamaño de bundle por entry,
  # gzip) + Lighthouse CI (LCP/TBT/tamaño total) sobre el build estático servido
  # por `vite preview`.
  #
  # Gate BLOCKING: el build entró en el budget (200 375 B de `total-byte-weight`
  # contra 204 800 B, con LCP 211 ms y TBT 0 ms) al lazy-loadear `Home` en
  # `App.jsx`. El job está en `prebuild-quality-complete.needs`; el último paso
  # pendiente es marcarlo como required status check en branch protection de
  # `main` (se configura fuera del repo).
  frontend-budgets:
    if: needs.repo-discovery.outputs.client == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Frontend Budgets'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - name: Build client
        run: npm run build --workspace=apps/client
      - name: Bundle size budgets (size-limit)
        run: npm run size --workspace=apps/client
      - name: Lighthouse CI (LCP/TBT/total-size)
        run: npm run lighthouse --workspace=apps/client
        env:
          CI: 'true'
      - name: Upload Lighthouse reports (retention 14d)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lighthouse-report-pr
          path: apps/client/reports/lighthouse
          if-no-files-found: warn
          retention-days: 14

  # --- Server Pre-Build ---
  server-lint:
    if: needs.repo-discovery.outputs.server == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Server Lint'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          prisma: 'true'
      - name: Restore ESLint cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: apps/server/.cache/eslint
          key: eslint-server-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js') }}
          restore-keys: |
            eslint-server-${{ runner.os }}-
      - name: Lint (ESLint, JSON report for SARIF)
        run: |
          set +e
          npm run lint --workspace=apps/server -- --format json --output-file eslint-report.json
          status=$?
          exit "$status"
      - name: Convert ESLint report to SARIF
        if: always() && hashFiles('apps/server/eslint-report.json') != ''
        run: node scripts/ci/eslint-sarif.mjs apps/server/eslint-report.json apps/server/eslint-results.sarif
      - name: Upload ESLint SARIF
        if: always() && hashFiles('apps/server/eslint-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: apps/server/eslint-results.sarif
          category: eslint-server

  # ACTIVADO (change `ci-format-check-blocking`, 2026-11-12): la deuda que
  # justificaba el `if: false` no se reproduce en archivos TRACKEADOS — el
  # `format:check` solo fallaba por artefactos generados gitignored
  # (`reports/`, `.vitest-reports/`), ahora excluidos vía
  # `apps/server/.prettierignore`. Condición hermana de `server-lint` /
  # `server-typecheck` (path-scoped + PR-only); en `merge_group` queda skipped y
  # el agregador lo autoriza por evento. CI solo verifica (`--check`), nunca
  # `--write`: el auto-fix vive en lint-staged (pre-commit).
  server-format-check:
    if: needs.repo-discovery.outputs.server == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Server Format'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - run: npm run format:check --workspace=apps/server

  server-typecheck:
    if: needs.repo-discovery.outputs.server == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Server TypeCheck'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          prisma: 'true'
      # Gate blocking real (change `quality-gates`): `tsc --noEmit -p apps/server`
      # contra apps/server/tsconfig.json (allowJs, checkJs off — código 100% JS;
      # flags strict vía server-typescript-migration Fase 4). Sin `|| echo` que enmascare.
      # Corrección 2026-09-29: `npx tsc --noEmit` con working-directory (patrón
      # client-typecheck) — `npm run type-check` fallaba porque ese script vive
      # solo en el manifest RAÍZ, no en apps/server (Missing script: "type-check").
      - name: TypeCheck
        run: npx tsc --noEmit
        working-directory: apps/server

  server-complexity:
    if: needs.repo-discovery.outputs.server == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Server Complexity'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      # Gate blocking (change `quality-gates`): sin `--rule` CLI override —
      # umbrales desde eslint.config.js (15 core / 10 utils / off tests).
      - name: Check complexity
        run: npx eslint "src/**/*.{js,ts}"
        working-directory: apps/server

  server-dead-code:
    if: needs.repo-discovery.outputs.server == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Server Dead Code'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - name: Detect dead code
        # DESDE LA RAÍZ (mismo motivo que client-dead-code): knip lee la config
        # raíz knip.jsonc (con los falsos positivos justificados en ignoreIssues)
        # y el selector se resuelve correctamente.
        run: npx knip --workspace=apps/server --no-progress

  server-import-bounds:
    if: needs.repo-discovery.outputs.server == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Server Import Bounds'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      # Activado por change `import-boundaries` (antes `if: false`). Gate desde
      # la RAÍZ con config raíz (regex `^apps/...`) + baseline --ignore-known.
      - name: Check import boundaries (gate)
        run: npm run depcruise:server -- --output-type err --ignore-known
      - name: Import boundaries report (no-blocking)
        if: always()
        run: npm run depcruise:report
        continue-on-error: true
      - name: Upload dependency-cruiser report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-cruiser-report-server
          path: reports/dependency-cruiser.html
          if-no-files-found: warn
          retention-days: 7

  # Contrato schema Prisma ↔ migraciones (change `ci-shifting-left`, capability
  # `db-contract-testing`). Detecta DRIFT en el PR en vez de en el deploy: el
  # schema se valida contra el estado que producen las migraciones versionadas.
  # `prisma migrate diff --from-migrations` exige una shadow database (Prisma
  # replaya las migraciones en una base desechable), de ahí el service `postgres`
  # + creación explícita de `shadow_db`. Blocking: entra en
  # `prebuild-quality-complete.needs`. Path-scoped al workspace server.
  db-contract:
    if: needs.repo-discovery.outputs.server == 'true' && github.event_name == 'pull_request'
    name: 'Quality: DB Contract'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: project_one_test
        options: >-
          --health-cmd "pg_isready -U test -d project_one_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          prisma: 'true'
      # La shadow DB debe EXISTIR antes del diff (Prisma la resetea, no la crea
      # cuando se le pasa --shadow-database-url explícito).
      - name: Create shadow database
        env:
          PGPASSWORD: test
        run: psql -h localhost -U test -d postgres -c 'CREATE DATABASE shadow_db;'
        shell: bash
      - name: Check schema/migrations contract
        env:
          # DATABASE_URL: el schema lo referencia (env("DATABASE_URL")) y el CLI
          # lo resuelve al cargar el schema; no se conecta a esa base.
          DATABASE_URL: postgresql://test:test@localhost:5432/project_one_test
          SHADOW_DATABASE_URL: postgresql://test:test@localhost:5432/shadow_db
        run: npm run db:contract --workspace=apps/server

  # Contrato OpenAPI (change `ci-shifting-left`, capability api-contract-linting):
  # `openapi.yaml` se GENERA desde las anotaciones `@openapi` (script versionado
  # `apps/server/scripts/generate-openapi.ts`) y Spectral lo lintá con
  # `spectral:oas` + reglas custom (.spectral.yaml): naming de operationId/path
  # params, ids numéricos literales, HTTP Basic y GET con body.
  #
  # Gate BLOCKING desde que los 28 `$ref` huérfanos (`invalid-ref`) se
  # resolvieron: los schemas de RRHH y los cuerpos PATCH viven en
  # `apps/server/src/docs/schemas-shift-left.ts` y el resto se retargeteó a
  # schemas existentes. `spectral lint` sale en 0 errores, así que el job
  # bloquea (está en `prebuild-quality-complete.needs`). Las 227 warnings de
  # `spectral:oas` (operationId/description/tags) son deuda de documentación
  # visible, no un fallo: la severidad no se relajó.
  api-contract:
    if: needs.repo-discovery.outputs.server == 'true' && github.event_name == 'pull_request'
    name: 'Quality: API Contract'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          prisma: 'true'
      # El contrato versionado debe corresponder a las anotaciones: si alguien
      # edita una ruta sin regenerar, el diff lo delata aquí.
      - name: Verify generated contract is committed
        run: |
          npm run openapi:generate --workspace=apps/server
          git diff --exit-code apps/server/openapi.yaml
        shell: bash
      - name: Lint OpenAPI contract (Spectral)
        run: npm run lint:api --workspace=apps/server

  # --- E2E Pre-Build ---
  # Lint estático del workspace e2e (sin navegador): specs, page objects y
  # playwright.config.js. Mismo patrón que client-lint/server-lint; el umbral
  # de complejidad de e2e/tests/** es 'off' vía bloque de tests de la config.
  e2e-lint:
    if: needs.repo-discovery.outputs.e2e == 'true' && github.event_name == 'pull_request'
    name: 'Quality: E2E Lint'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - name: Restore ESLint cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: e2e/.cache/eslint
          key: eslint-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js') }}
          restore-keys: |
            eslint-e2e-${{ runner.os }}-
      - name: Lint (ESLint, JSON report for SARIF)
        run: |
          set +e
          npm run lint --workspace=e2e -- --format json --output-file eslint-report.json
          status=$?
          exit "$status"
      - name: Convert ESLint report to SARIF
        if: always() && hashFiles('e2e/eslint-report.json') != ''
        run: node scripts/ci/eslint-sarif.mjs e2e/eslint-report.json e2e/eslint-results.sarif
      - name: Upload ESLint SARIF
        if: always() && hashFiles('e2e/eslint-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: e2e/eslint-results.sarif
          category: eslint-e2e

  # Gate de formato del workspace e2e (change `ci-format-check-blocking`):
  # espejo de `e2e-lint` con la misma condición path-scoped + PR-only. El
  # `format:check` excluye artefactos de Playwright
  # (`test-results/`, `playwright-report/`) vía `e2e/.prettierignore`. Blocking
  # desde el día 1; entra en `prebuild-quality-complete.needs`.
  e2e-format-check:
    if: needs.repo-discovery.outputs.e2e == 'true' && github.event_name == 'pull_request'
    name: 'Quality: E2E Format'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - run: npm run format:check --workspace=e2e

  # --- Pipeline Config Pre-Build ---
  # Validación estática de los workflows (change `ci-shifting-left`, capability
  # `workflow-linting`): yamllint (estructura YAML) + actionlint (sintaxis de
  # GitHub Actions, expresiones `${{ }}`, permisos, shellcheck de `run:`) como
  # gate BLOCKING, con paths-filter (`workflows`): solo corre cuando el PR toca
  # `.github/workflows/**`, `.github/dependabot.yml` o `.yamllint.yml`.
  #
  # Relación con `actionlint-advisory` (change `pipeline-config-scan`): ese job
  # produce evidencia SARIF y sigue siendo advisory (FASE 1); la promoción a
  # blocking de SU step es FASE 2 de ese change y NO se toca aquí. Este job es
  # el gate rápido de pre-commit reproducido en CI (misma config: `.yamllint.yml`
  # y `.github/actionlint.yaml`), sin subida SARIF, así que no duplica
  # categorías de Code Scanning.
  validate-pipeline:
    if: needs.repo-discovery.outputs.workflows == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Validate Pipeline'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      # yamllint es una herramienta Python: venv local + versión FIJADA (las
      # imágenes ubuntu-latest tienen PEP 668 activo, `pip install` global falla).
      - name: Install yamllint (pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/yamllint-venv"
          "$RUNNER_TEMP/yamllint-venv/bin/pip" install --quiet --disable-pip-version-check yamllint==1.38.0
          echo "$RUNNER_TEMP/yamllint-venv/bin" >> "$GITHUB_PATH"
        shell: bash
      - name: yamllint (workflows + dependabot)
        run: yamllint -c .yamllint.yml -f parsable .github/workflows/*.yml .github/dependabot.yml
        shell: bash
      # actionlint REAL v1.7.12 (misma imagen pinneada que el job advisory): el
      # stub npm `actionlint@2.0.6` es WASM y no expone binario, por eso aquí se
      # usa el contenedor oficial. Sin `|| true`: un hallazgo FALLA el job.
      - name: actionlint (all workflows)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 \
            -no-color -config-file .github/actionlint.yaml .github/workflows/*.y*ml
        shell: bash

  # --- Shared Pre-Build ---
  # Guard de higiene del manifest raíz (change `root-manifest-cleanup`, spec
  # `root-manifest-hygiene`): falla si `dependencies` del raíz contiene entradas
  # no declaradas como requisitos directos (workspaces/devDeps raíz) ni en la
  # allowlist versionada de scripts/check-root-manifest.mjs. Blocking en PR
  # que toque el manifest raíz (outputs.shared). Sin red, en segundos.
  root-manifest-guard:
    if: needs.repo-discovery.outputs.shared == 'true' && github.event_name == 'pull_request'
    name: 'Quality: Root Manifest Guard'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Validate root manifest inventory
        run: node scripts/check-root-manifest.mjs

  # --- Specs Pre-Build ---
  # Validación estructural de las specs canónicas de OpenSpec (openspec/specs/**).
  # `--specs` valida SOLO main specs; los deltas de changes/ activos se validan
  # aparte. `--strict` convierte warnings en errores. Mismo patrón que
  # openspec-validate: barato, sin dependencia de paths-filter (openspec/ no
  # está en los filtros de repo-discovery) y sin needs: no consume outputs de
  # repo-discovery, así que corre desde t=0 del workflow en paralelo.
  openspec-validate:
    if: github.event_name == 'pull_request'
    name: 'Quality: OpenSpec Validate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - name: Validate OpenSpec main specs (strict)
        run: npx openspec validate --specs --strict
      # Guard de `## Purpose` (2026-11-07). `openspec validate --strict` convierte
      # el placeholder que escribe el archive (`TBD - created by archiving…`)
      # en WARNING → exit 1, pero el mensaje no dice cómo arreglarlo ni en qué
      # fichero; el guard falla con el path y la acción exacta (editar el
      # `## Purpose` del main spec, nunca el delta). Ver
      # `scripts/ci/spec-purpose-guard.mjs` y su test en `npm run test:scripts`,
      # que este mismo job ejecuta más abajo.
      - name: Guard spec Purpose sections
        run: node scripts/ci/spec-purpose-guard.mjs
      # Gate del lockstep plantilla ↔ política del PR body (change
      # `pr-metadata-workflow`, task 1.9): `scripts/ci/pr-body-lint.test.mjs`
      # incluye el test que FALLA si un heading de
      # `.github/PULL_REQUEST_TEMPLATE.md` se renombra sin actualizar
      # `scripts/ci/pr-body-lint.mjs` (design D11). Va aquí y no en
      # `actionlint-advisory` porque ese job es `continue-on-error: true` y no
      # podría bloquear nada — ver nota de desviación en tasks.md.
      - name: Run CI scripts suite (PR body policy + template lockstep)
        run: npm run test:scripts

  # change ci-security-substage-alignment (2026-09-30): reubicado a 2B quality (D8) — job quality que quedó al cierre del stage 2
  # Job advisory de validación de documentación (change `quality-gates`, fase 1):
  # markdownlint (estructura) + publication de reporte. NO entra en
  # `prebuild-quality-complete.needs` — un hallazgo de docs NO bloquea el PR;
  # el reporte debe sobrevivir (`if: always()`) aunque el job "falle".
  # Fase 2 (bloqueante) queda fuera de este change hasta que docs/ pase limpio.
  docs-validation:
    if: github.event_name == 'pull_request'
    name: 'Quality: Docs Validation (advisory)'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-monorepo
      - name: Lint markdown structure (markdownlint)
        run: npm run docs:lint
      # Vale advisory (change `ci-quality-gates-blocking-hardening`, P1.5):
      # prosa/ortografía sobre `docs/`. Se instala la release PINNEADA desde
      # GitHub (el paquete npm `vale` está huérfano). El job entero es advisory
      # (`continue-on-error: true`), así que un fallo de descarga o un hallazgo
      # no bloquean el PR; el objetivo es visibilizar la deuda antes de la
      # fase 2 (ver docs/learning/docs-changelog-validation.md §6.3).
      - name: Install Vale (pinned)
        continue-on-error: true
        run: |
          curl -fsSL -o "$RUNNER_TEMP/vale.tar.gz" \
            https://github.com/errata-ai/vale/releases/download/v3.22.0/vale_3.22.0_Linux_x86_64.tar.gz
          tar -xzf "$RUNNER_TEMP/vale.tar.gz" -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
        shell: bash
      - name: Lint prose (vale, advisory)
        continue-on-error: true
        run: npm run docs:vale
        env:
          VALE_CONFIG_PATH: .
        shell: bash
      - name: Publish docs lint summary
        if: always()
        run: |
          COUNT=$(npx markdownlint "docs/**/*.md" "docs/*.md" 2>/dev/null | wc -l || echo 0)
          echo "## Docs Validation (advisory, fase 1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "markdownlint violations: ${COUNT##* } (fase 1: NO bloquea el PR)" >> $GITHUB_STEP_SUMMARY
          echo "Config: .markdownlint.json (JSON estricto) + .markdownlintignore (grandfathering del inventario legacy, 2026-09-29) · vale v3.22.0 advisory (fase 1, ver docs/learning/docs-changelog-validation.md)" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════
  # STAGE 3: BUILD (compilación, empaquetado, artifact)
  # ═══════════════════════════════════════════════════════════════
  client-build:
    # The four prebuild verdicts are composed INTO the condition (not documented in a comment):
    # activation is the single-token edit `false` → `true` and the gate is already present.
    if: false && needs.prebuild-governance-complete.result == 'success' && needs.prebuild-quality-complete.result == 'success' && needs.prebuild-security-complete.result == 'success' && needs.prebuild-tests-complete.result == 'success' # Disabled for incremental CI — change to true to re-enable
    name: 'Build: Client'
    needs:
      [
        prebuild-governance-complete,
        prebuild-quality-complete,
        prebuild-security-complete,
        prebuild-tests-complete,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - run: npm run build --workspace=apps/client
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: client-dist
          path: apps/client/dist/

  server-build:
    # Same composed gate as client-build: `false` short-circuits the whole conjunction.
    if: false && needs.prebuild-governance-complete.result == 'success' && needs.prebuild-quality-complete.result == 'success' && needs.prebuild-security-complete.result == 'success' && needs.prebuild-tests-complete.result == 'success' # Disabled for incremental CI — change to true to re-enable
    name: 'Build: Server'
    needs:
      [
        prebuild-governance-complete,
        prebuild-quality-complete,
        prebuild-security-complete,
        prebuild-tests-complete,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: 'echo "server-build: no-op (source-level, D8)"'

  # ═══════════════════════════════════════════════════════════════
  # STAGE 4: POST-BUILD — INTEGRATE (requieren artifact compilado)
  # ═══════════════════════════════════════════════════════════════

  # --- TESTING (post-build): integration / smoke / e2e requieren artifact compilado ---
  # JUnit de integration/smoke: flags `--reporter=junit --outputFile=reports/junit.xml` inline
  # (contrato "in the workspace CI script" de ci-test-reporting relajado aquí: el `--` de npm
  # los añade a un script existente; moverlos a scripts `*:ci` nuevos duplicaría configuración).
  test-integration:
    # Merge queue y workflow_dispatch también ejecutan — task 4.2 del change
    # `tia-enterprise-gaps`: la cláusula `pull_request` original permitía integrar
    # sin tests. El path-scoping legítimo de PRs se conserva (mismos outputs).
    if: needs.repo-discovery.outputs.server == 'true' || needs.repo-discovery.outputs.shared == 'true'
    name: 'Tests: Integration - Server'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # `actions: read` — task 3.1 de `tia-enterprise-gaps`: el job descarga el
      # artefacto `tia-history-server` de OTRO run (inyección de tests fallidos).
      # Sin este scope el `gh run download` falla y la inyección sería un no-op
      # silencioso, justo el gap que este change cierra.
      actions: read
      contents: read
      checks: write
    services:
      postgres:
        image: postgres:16-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: project_one_test
        options: >-
          --health-cmd "pg_isready -U test -d project_one_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          prisma: 'true'
      - name: Prisma Migrate Deploy
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/project_one_test
        shell: bash
        working-directory: apps/server
      # TIA — spec ci-test-impact-analysis (design D6, task 6.1 de `tia-hardening`):
      # el contrato de selección se extiende a integration con el MISMO patrón de los
      # jobs unit (diff contra origin/main + filtro del tier + guard D7). Este job NO
      # es advisory (sin continue-on-error), así que el step de scope es informativo y
      # la ejecución de tests es condicional: `scope=changed` corre solo la integración
      # del diff; `scope=full` la suite completa. Cualquier duda (rutas shared, base no
      # resoluble, diff vacío, 0 candidatos del filtro `.integration.test`) degrada a
      # suite completa ruidosa — nunca "0 tests" en silencio.
      # Verificación runtime PENDING-CI: requiere el service container PostgreSQL.
      - name: Resolve TIA scope (diff-scoped vs full suite)
        id: tia
        # Override manual — task 2.2 del change `tia-enterprise-gaps` (mismo
        # contrato que los jobs unit). En `merge_group` el label evalúa `false`:
        # la merge queue fuerza `scope=full` incondicionalmente abajo.
        env:
          FULL_SUITE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full-suite') }}
          FULL_SUITE_INPUT: ${{ inputs.full_suite || false }}
          NEEDS_REPO_DISCOVERY_OUTPUTS_SHARED: ${{ needs.repo-discovery.outputs.shared }}
        run: |
          if [ "$FULL_SUITE_LABEL" = "true" ] || [ "$FULL_SUITE_INPUT" = "true" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "::notice::manual override (label ci:full-suite / input full_suite) — running the FULL integration suite."
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "::notice::merge queue — running the FULL integration suite before integration."
          elif [ "${NEEDS_REPO_DISCOVERY_OUTPUTS_SHARED}" = "true" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "::notice::shared path changed (root manifest, lockfile, workflows or global configs) — running the FULL integration suite."
          elif ! git rev-parse --verify --quiet origin/main > /dev/null; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "::warning::origin/main is NOT resolvable in this checkout; falling back to the FULL integration suite (never reporting '0 affected tests')."
          elif [ -z "$(git diff --name-only origin/main...HEAD)" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "::notice::empty diff against origin/main — running the FULL integration suite."
          else
            CANDIDATES=$(cd apps/server && npx vitest list ".integration.test" --changed origin/main --filesOnly 2> /dev/null | wc -l | tr -d '[:space:]' || true)
            case "${CANDIDATES}" in
              ''|*[!0-9]*) CANDIDATES=0 ;;
            esac
            if [ "${CANDIDATES}" -gt 0 ]; then
              echo "scope=changed" >> "$GITHUB_OUTPUT"
              echo "::notice::origin/main resolved — ${CANDIDATES} integration test file(s) affected; running the diff-scoped integration suite."
            else
              echo "scope=full" >> "$GITHUB_OUTPUT"
              echo "::warning::the diff touches no integration test file; running the FULL integration suite (never reporting '0 affected tests')."
            fi
          fi
        shell: bash
      # Inyección de tests previamente fallidos — task 3.1 del change
      # `tia-enterprise-gaps` (paridad con los jobs unit). Descarga el artefacto
      # `tia-history-server` del nightly más reciente y lo deja en
      # `apps/server/reports/tia-history.json`, que `tia-select.mjs` lee en su
      # fase 1b (lo invoca `test:integration:changed`). Best-effort: sin
      # artefacto o sin `gh` disponible es un no-op con aviso, nunca un fallo.
      - name: Inject previously-failing tests
        if: always()
        id: inject
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apps/server/reports
          INJECTED=0
          if gh api repos/${{ github.repository }}/actions/workflows/nightly-full-suite.yml/runs --jq '.workflow_runs[0].id' > /dev/null 2>&1; then
            RUN_ID=$(gh api repos/${{ github.repository }}/actions/workflows/nightly-full-suite.yml/runs --jq '.workflow_runs[0].id')
            if gh run download "$RUN_ID" -n tia-history-server -d /tmp/tia-history-integration --dir > /dev/null 2>&1 && [ -f /tmp/tia-history-integration/tia-history.json ]; then
              cp /tmp/tia-history-integration/tia-history.json apps/server/reports/tia-history.json
              INJECTED=$(node scripts/ci/tia-history.mjs apps/server --inject | wc -l | tr -d ' ')
              echo "::notice::tia-history: injected $INJECTED previously-failing server file(s) from nightly run $RUN_ID."
            else
              echo "::notice::tia-history: no matching server history artifact found — integration injection is a no-op."
            fi
          else
            echo "::notice::tia-history: github CLI not available or no nightly runs — integration injection is a no-op."
          fi
          echo "injected=$INJECTED" >> "$GITHUB_OUTPUT"
        shell: bash
      # Seeding is handled by vitest globalSetup (tests/setupGlobal.js)
      # which loads .env.test and spawns prisma/seed.js before tests run.
      - name: Run Integration Tests (TIA / full suite)
        # `--reporter=default` explicito: sin el, el unico reporter activo es `junit`, que SILENCIA
        # la salida de fallos y deja solo un `exit code 1` sin diagnostico en el log del step
        # (coste real de diagnosticar el fallo de `test-smoke`: 4 runs de leitura de logs).
        # Las ramas TIA (changed + fallback D7) añaden `--reporter=json` para que el guard
        # D7 lea numTotalTests de reports/vitest-results.json; la rama full conserva el
        # argv original byte a byte (task 6.1, `tia-hardening`).
        run: |
          mkdir -p apps/server/reports
          echo "scope=${STEPS_TIA_OUTPUTS_SCOPE}" > apps/server/reports/tia-scope.txt
          if [ "${STEPS_TIA_OUTPUTS_SCOPE}" = "changed" ]; then
            npm run test:integration:changed --workspace=apps/server -- --reporter=default --reporter=junit --reporter=json --outputFile.junit=reports/junit.xml --outputFile.json=reports/vitest-results.json
            # Guard D7: un diff valido puede no tener NINGUN test de integracion relacionado, y
            # con passWithNoTests (default en Vitest 4) eso sale "No test files found" con exit
            # 0 — un verde VACIO que el agregador contaria como tests ejecutados. Si la corrida
            # no ejecuto ningun test, se cae a suite completa en vez de fingir cobertura.
            RAN=$(node -p "require('./apps/server/reports/vitest-results.json').numTotalTests" 2> /dev/null || echo 0)
            if [ "${RAN:-0}" -eq 0 ]; then
              echo "::warning::TIA matched 0 integration tests for this diff (numTotalTests=${RAN:-0}); running the FULL integration suite instead of reporting a vacuous green."
              echo "scope=full" > apps/server/reports/tia-scope.txt
              npm run test:integration --workspace=apps/server -- --reporter=default --reporter=junit --reporter=json --outputFile.junit=reports/junit.xml --outputFile.json=reports/vitest-results.json
            fi
          else
            npm run test:integration --workspace=apps/server -- --reporter=default --reporter=junit --outputFile=reports/junit.xml
          fi
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/project_one_test
          NODE_ENV: test
          STEPS_TIA_OUTPUTS_SCOPE: ${{ steps.tia.outputs.scope }}
        shell: bash
      # Historial de tests fallidos — task 3.1 del change `tia-enterprise-gaps`.
      # Cierra el bucle de la lane de integración: sus fallos se registran con el
      # mismo contrato (`reports/vitest-results.json` → tia-history.json) que los
      # jobs unit, en vez de perderse con el runner.
      # El artefacto NO reusa el nombre `tia-history-server`: `upload-artifact@v4+`
      # es inmutable por run y `test-unit-server` ya sube ese nombre (un segundo
      # upload con el mismo nombre falla el job).
      - name: Record TIA history
        if: always()
        run: |
          mkdir -p apps/server/reports
          node scripts/ci/tia-history.mjs apps/server --record --out apps/server/reports/tia-history.json || true
        shell: bash

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: tia-history-server-integration
          path: apps/server/reports/tia-history.json
          retention-days: 30
          if-no-files-found: warn

      - name: Report Integration Tests
        if: success() || failure()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          name: Server Integration Tests
          path: apps/server/reports/junit.xml
          reporter: java-junit

  test-smoke:
    # Merge queue y workflow_dispatch también ejecutan — task 4.2 del change
    # `tia-enterprise-gaps`: la cláusula `pull_request` original permitía integrar
    # sin tests. El path-scoping legítimo de PRs se conserva (mismos outputs).
    if: needs.repo-discovery.outputs.server == 'true' || needs.repo-discovery.outputs.shared == 'true'
    name: 'Tests: Smoke - Server'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    services:
      postgres:
        image: postgres:16-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: project_one_test
        options: >-
          --health-cmd "pg_isready -U test -d project_one_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          prisma: 'true'
      - name: Prisma Migrate Deploy
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/project_one_test
        shell: bash
        working-directory: apps/server
      # Seeding is handled by vitest globalSetup (tests/setupGlobal.js)
      # which loads .env.test and spawns prisma/seed.js before tests run.
      - name: Run Smoke Tests
        # `--reporter=default` explicito: sin el, el unico reporter activo es `junit`, que SILENCIA
        # la salida de fallos y deja solo un `exit code 1` sin diagnostico en el log del step
        # (coste real de diagnosticar el fallo de `test-smoke`: 4 runs de lectura de logs).
        run: npm run test:smoke:ci --workspace=apps/server -- --reporter=default --reporter=junit --outputFile=reports/junit.xml
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/project_one_test
          NODE_ENV: test
        shell: bash
      - name: Report Smoke Tests
        if: success() || failure()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          name: Server Smoke Tests
          path: apps/server/reports/junit.xml
          reporter: java-junit

  # TIA clause (change `tia-hardening`, task 6.2 — design D6): cuando `ci-e2e` levante
  # este `if: false`, el job hereda el patrón implementado en task 6.1 para
  # `test-integration`: step `Resolve TIA scope` (diff-scoped vs full) con su propio
  # `reports/tia-scope.txt`, rama `test:e2e:changed` (filtro del tier + `--changed
  # origin/main`) y guard D7 detrás (0 tests seleccionados => suite completa ruidosa,
  # nunca un verde vacío). Mientras el `if: false` permanezca, el tier e2e NO se toca.
  e2e:
    if: false # Disabled for incremental CI — change to true to re-enable
    name: 'Tests: E2E'
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    services:
      postgres:
        image: postgres:16-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: project_one_test
        options: >-
          --health-cmd "pg_isready -U test -d project_one_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - name: Prisma Migrate Deploy
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/project_one_test
        shell: bash
        working-directory: apps/server
      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright with System Dependencies
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        shell: bash
        working-directory: e2e
      - name: Run E2E Tests
        run: npx playwright test --project=chromium --output=test-results
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/project_one_test
        shell: bash
        working-directory: e2e
      - name: Report E2E Tests
        if: success() || failure()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          name: E2E Tests
          path: e2e/reports/junit-e2e.xml
          reporter: java-junit

  # --- Client Post-Build ---
  client-sonarqube:
    if: false # Sin credenciales: no existe SONAR_TOKEN/SONAR_HOST_URL en los secrets del repo (change `quality-gates` D2 — gate documentado como inactivo, nunca rojo)
    name: 'Quality: Client SonarQube'
    needs: [client-build, test-unit-client]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: client-dist
          path: apps/client/dist/
      # change `coverage-merge-gate` (task 1.5): el artefacto pasa de nombre plano
      # (`coverage-client`) a `coverage-client-shard-1`, así que este consumidor
      # (hoy en `if: false`) se actualiza ya a patrón + `merge-multiple` hacia la
      # LCA `apps/client/` — evita una bomba de reactivación con el rename y deja
      # el patrón correcto para N>1.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: coverage-client-shard-*
          merge-multiple: true
          path: apps/client/
      - uses: SonarSource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402 # v4
        with:
          projectBaseDir: apps/client
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  client-depcheck:
    if: false # Disabled for incremental CI — change to true to re-enable
    name: 'Quality: Client DepCheck'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - name: Check unused/missing dependencies
        run: npx depcheck
        working-directory: apps/client

  # --- Server Post-Build ---
  server-sonarqube:
    if: false # Sin credenciales: no existe SONAR_TOKEN/SONAR_HOST_URL en los secrets del repo (change `quality-gates` D2 — gate documentado como inactivo, nunca rojo)
    name: 'Quality: Server SonarQube'
    needs: [server-build, test-unit-server]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      # change `coverage-merge-gate` (task 1.4): mismo tratamiento que el consumidor
      # client — patrón + `merge-multiple` hacia `apps/server/` (evita dejar un
      # consumidor roto por el rename, aunque el job esté en `if: false`).
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: coverage-server-shard-*
          merge-multiple: true
          path: apps/server/
      - uses: SonarSource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402 # v4
        with:
          projectBaseDir: apps/server
          projectKey: project-one-server
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  server-depcheck:
    if: false # Disabled for incremental CI — change to true to re-enable
    name: 'Quality: Server DepCheck'
    needs: server-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - name: Check unused/missing dependencies
        run: npx depcheck
        working-directory: apps/server

  # ═══════════════════════════════════════════════════════════════
  # STAGE 5: ARTIFACT & SIGN (empaquetado, firma, publicación)
  # Vive en security.yml / deploy.yml (ambos disabled_manually) — NO en ci.yml.
  # Placeholder informativo: conserva la topología del pipeline §23.3.
  # ═══════════════════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════════════════
  # STAGE 6: DEPLOY STAGING (entorno de validación)
  # Vive en deploy.yml (disabled_manually) — NO en ci.yml.
  # Placeholder informativo: conserva la topología del pipeline §23.3.
  # ═══════════════════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════════════════
  # STAGE 7: POST-DEPLOY — ACCEPT (app desplegada corriendo)
  # Vive en deploy.yml (disabled_manually) — NO en ci.yml.
  # Placeholder informativo: conserva la topología del pipeline §23.3.
  # ═══════════════════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════════════════
  # STAGE 8: PERFORMANCE (stability + performance gated)
  # Sin workflow asignado — placeholder informativo §23.3.
  # ═══════════════════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════════════════
  # STAGE 9: APPROVAL & GOVERNANCE (human gate + compliance)
  # Gate humano (ruleset + CODEOWNERS) — placeholder informativo §23.3.
  # ═══════════════════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════════════════
  # STAGE 10: DEPLOY PRODUCTION (release)
  # Vive en deploy.yml + release.yml (ambos disabled_manually) — NO en ci.yml.
  # Placeholder informativo: conserva la topología del pipeline §23.3.
  # ═══════════════════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════════════════
  # STAGE 11: MONITOR & CLEANUP (observability + limpieza)
  # Post-CD: observability + cleanup — placeholder informativo §23.3.
  # ═══════════════════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════════════════
  # SUBSTAGE AGGREGATORS — Prebuild Complete (STAGE 2)
  # One aggregator per substage 2A/2B/2C/2D; ci-complete depends on these.
  # ═══════════════════════════════════════════════════════════════
  prebuild-governance-complete:
    if: ${{ vars.CI_MINIMAL != 'true' && always() }}
    name: Prebuild Governance Complete
    runs-on: ubuntu-latest
    needs:
      - verify-signatures
      - commit-lint
      # `pr-title-lint`/`pr-body-lint` NO pueden aparecer aquí: viven en
      # `.github/workflows/pr-metadata.yml` y un `needs` no puede referenciar
      # un job de OTRO workflow (lo invalidaría, no lo haría más completo).
      # Su cobertura llega al PR vía sus propios required checks del ruleset.
      - dco
      # FASE 2 del gate SAST (2026-10-20): 5ª entrada. Un hallazgo ERROR hace
      # fallar este agregador (que no es status check del ruleset: ver el
      # comentario de alcance en el job `sast`). El job sigue fuera de
      # `ci-complete.needs` por diseño.
      - sast
    steps:
      - name: Check for failures
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more governance jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ One or more governance jobs were cancelled"
            exit 1
          fi
          echo "✅ Governance substage succeeded or was skipped"

  # Agregador estricto del substage 2B (change `ci-quality-gates-blocking-hardening`,
  # capability `quality-gate-aggregator-strict`): CUALQUIER resultado distinto de
  # `success` (`failure`, `cancelled`, `skipped`) falla, salvo los skipped legítimos
  # autorizados por evento o por la change detection de `repo-discovery`. Los
  # `needs` se pasan por `env` (nunca interpolados en `run:`, PRD regla #5).
  # El `name:` es CONGELADO (`Prebuild Quality Complete`): cambiarlo rompe el binding
  # del ruleset de `main`.
  prebuild-quality-complete:
    if: ${{ vars.CI_MINIMAL != 'true' && always() }}
    name: Prebuild Quality Complete
    runs-on: ubuntu-latest
    needs:
      - repo-discovery
      - client-lint
      - client-format-check
      - client-typecheck
      - client-complexity
      - client-dead-code
      - client-import-bounds
      - server-lint
      - server-format-check
      - server-typecheck
      - server-complexity
      - server-dead-code
      - server-import-bounds
      - e2e-lint
      - e2e-format-check
      # change `ci-shifting-left`: contrato de DB (drift schema↔migraciones) y
      # validación estática de workflows (yamllint + actionlint). Ambos
      # path-scoped: skipped fuera de PRs de server / de `.github/**`
      # (el agregador los tolera; un rojo sí lo falla).
      - db-contract
      - validate-pipeline
      # Contrato OpenAPI: regeneración determinista + Spectral sin errores
      # (path-scoped a `server`, tolera skipped fuera de PRs de server).
      - api-contract
      # Budgets del cliente (size-limit + Lighthouse LCP/TBT/total). La ruta `/`
      # entra por debajo del budget (200 375 B medidos vs 204 800 B).
      - frontend-budgets
      - root-manifest-guard
      - openspec-validate
    steps:
      # Checkout necesario para ejecutar el veredicto versionado
      # (`scripts/ci/quality-aggregator-verdict.mjs`), cubierto por su test en
      # `npm run test:scripts`. No se usa el código del PR antes de fusionar:
      # el veredicto solo lee `needs` (dato del runner) y los outputs de
      # `repo-discovery`, no el código. `persist-credentials: false` (zizmor).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: 'Check for failures (strict: failure, cancelled, unauthorized skip)'
        env:
          # `needs` por `env`, nunca interpolado en el script (PRD regla #5).
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          # Autorización de skipped: qué ámbitos cambió el PR según `repo-discovery`.
          # En `merge_group`/`workflow_dispatch` los jobs PR-only se saltan por
          # diseño (autorizado por evento); en `pull_request` un skip solo se
          # tolera si su área quedó fuera del diff.
          CLIENT: ${{ needs.repo-discovery.outputs.client }}
          SERVER: ${{ needs.repo-discovery.outputs.server }}
          E2E: ${{ needs.repo-discovery.outputs.e2e }}
          SHARED: ${{ needs.repo-discovery.outputs.shared }}
          WORKFLOWS: ${{ needs.repo-discovery.outputs.workflows }}
        run: node scripts/ci/quality-aggregator-verdict.mjs

  # Agregador estricto del substage 2C (change `prebuild-security-aggregator-strict`, Phase 0/G7):
  # los 10 jobs de security están cableados en `needs` y CUALQUIER resultado distinto de `success`
  # (`failure`, `cancelled`, `skipped`) falla, salvo `skipped` autorizado por evento/diff. Sin esto,
  # un job saltado o cancelado pasaba en verde y ningún bloqueo posterior protegía el merge.
  # El `name:` es CONGELADO (`Prebuild Security Complete`): cambiarlo rompe el binding del ruleset.
  prebuild-security-complete:
    if: ${{ vars.CI_MINIMAL != 'true' && always() }}
    name: Prebuild Security Complete
    runs-on: ubuntu-latest
    needs:
      - dependency-review
      - secrets
      - scancode-license-pr-diff
      - lockfile-audit
      - checkov-iac
      - containerfile-lint
      - actionlint-advisory
      - zizmor-advisory
      - typosquat-guarddog
      - security-exceptions-check
    steps:
      # Checkout SOLO para computar la autorización de skip en `pull_request`
      # (design D8): la detección de paths vive dentro del step del agregador —sin un job extra
      # en `needs`— para preservar el contrato de needs (PRD regla 3).
      - name: Checkout (skip authorization needs the PR diff)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect security-scope changes (skip authorization)
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Mismo rango y filtro que `scancode-license-pr-diff`. Los contextos `github.*`
          # se pasan por `env`, nunca se interpolan en el script (PRD regla #5).
          CHANGED="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA")"
          acmr=false
          if [ -n "$CHANGED" ]; then acmr=true; fi
          has() { [ -n "$CHANGED" ] && grep -Eq "$1" <<<"$CHANGED"; }
          lockfile=false
          if has '(^|/)package(-lock)?\.json$'; then lockfile=true; fi
          iac=false
          if has '(^|/)Dockerfile[^/]*$|\.dockerfile$|\.tf(vars)?$|(^|/)(k8s|kubernetes|helm|terraform|infra)/'; then iac=true; fi
          containerfile=false
          if has '^apps/server/Dockerfile$|^\.hadolint\.yaml$'; then containerfile=true; fi
          workflows=false
          if has '^\.github/workflows/[^/]+\.ya?ml$|^\.github/actionlint\.ya?ml$|^\.github/actionlint-sarif\.tmpl$|^\.github/zizmor\.yml$'; then workflows=true; fi
          typosquat=false
          if has '(^|/)package\.json$|^apps/[^/]+/package\.json$|^e2e/package\.json$'; then typosquat=true; fi
          # `true` = el cambio relevante ESTÁ en el diff → el skip NO está autorizado.
          echo "changes=$(jq -cn \
            --argjson acmr "$acmr" \
            --argjson lockfile "$lockfile" \
            --argjson iac "$iac" \
            --argjson containerfile "$containerfile" \
            --argjson workflows "$workflows" \
            --argjson typosquat "$typosquat" \
            '{
              "scancode-license-pr-diff": $acmr,
              "lockfile-audit": $lockfile,
              "checkov-iac": $iac,
              "containerfile-lint": $containerfile,
              "actionlint-advisory": $workflows,
              "zizmor-advisory": $workflows,
              "typosquat-guarddog": $typosquat
            }')" >> "$GITHUB_OUTPUT"

      - name: 'Check for failures (strict: failure, cancelled, unauthorized skip)'
        env:
          # `needs` por `env`, nunca interpolado en el script (PRD regla #5).
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          CHANGES: ${{ steps.changes.outputs.changes || '{}' }}
        run: |
          set -euo pipefail
          # Anti-skip scoped (design D3/D7/D8): un scanner saltado NO es un resultado limpio,
          # pero el skip legítimo por tipo de evento o por path no debe teñir el agregador.
          #  - `merge_group` / `workflow_dispatch`: los 9 jobs PR-only no tienen diff que escanear
          #    → skip pre-autorizado por evento. `secrets` SÍ corre en `merge_group`: allí un skip
          #    NO está autorizado (en `workflow_dispatch` no corre por diseño).
          #  - `pull_request`: `secrets` y `dependency-review` deben correr siempre; los seis jobs
          #    condicionales solo pueden saltarse si el cambio que los dispara NO está en el diff.
          #    `security-exceptions-check` corre en cada PR (sin condición de path).
          # Fail-closed: un job desconocido saltado en PR cuenta como no autorizado.
          problematic="$(echo "$NEEDS" | jq -r \
            --arg event "$EVENT_NAME" \
            --argjson changes "$CHANGES" '
              def skip_authorized($job):
                if $event != "pull_request" then
                  ($job != "secrets") or ($event != "merge_group")
                elif $job == "secrets" or $job == "dependency-review" then
                  false
                else
                  # `//` NO sirve aquí: en jq `false // true` = true (la alternativa
                  # consume `false`). El default fail-closed es explícito.
                  (($changes[$job] | if . == null then true else . end) | not)
                end;
              to_entries[]
              | .key as $job
              | .value.result as $res
              | select($res != "success")
              | select((($res == "skipped") and skip_authorized($job)) | not)
              | "\($job): \($res)"
            ')"
          if [ -n "$problematic" ]; then
            echo "❌ Entrada no-success en el substage SECURITY (failure, cancelled o skip no autorizado):"
            printf '%s\n' "$problematic"
            exit 1
          fi
          echo "✅ Security substage succeeded: los 10 jobs terminaron en success o con skip autorizado por evento/diff"

  # Renamed by change `ci-stage-aggregator-topology` (D9): the aggregator carries the whole tier-1
  # testing surface, not only unit tests, so the `unit` wording became false and the id now mirrors
  # `postbuild-tests-complete`.
  prebuild-tests-complete:
    if: ${{ vars.CI_MINIMAL != 'true' && always() }}
    name: Prebuild Tests Complete
    runs-on: ubuntu-latest
    needs:
      - test-unit-client
      - test-unit-server
      - client-coverage
      - server-coverage
      # The 5 tier-1 members (`test-unit-client`, `test-unit-server`, `client-coverage`,
      # `server-coverage`, `property-tests`) are BLOCKING since 2026-10-29 (task 3.1 of
      # `ci-testing-gate-promotion`): no job-level `continue-on-error`, so a red member fails this
      # aggregator and, transitively, `ci-complete`. Rollback = restore the flag PER JOB with the
      # cause registered (design D9).
      - property-tests
      # `snapshot-update-gate` (change `snapshot-gates`, G2) es el 6.º miembro: higiene de repo,
      # SIN `continue-on-error`, así que un gate rojo también falla este agregador.
      - snapshot-update-gate
      # `client-snapshot-size` (G4+G5, promovido a blocking): tamaño/orphan de snapshots
      # de cliente. Path-scoped (skipped fuera de PRs de cliente, tolerado por el agregador).
      - client-snapshot-size
      # Coverage baseline integrity and full-suite floors are independent blocking
      # members; neither changes the existing TIA/advisory coverage lane.
      - coverage-floor-guard
      - coverage-full-gate
    steps:
      - name: Check for failures
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more tier-1 testing jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ One or more tier-1 testing jobs were cancelled"
            exit 1
          fi
          echo "✅ Tier-1 testing substage succeeded or was skipped"

  # ═══════════════════════════════════════════════════════════════
  # STAGE AGGREGATORS — Build Complete + Postbuild {Tests,Analysis} Complete
  # Stage verdicts, not substage verdicts: they carry no `Prebuild ` prefix and are
  # siblings of the four STAGE 2 aggregators above (change `ci-stage-aggregator-topology`).
  # Any future `name:` containing `:` MUST be single-quoted (actionlint: "Nested mappings are
  # not allowed in compact mappings"); these three names contain no `:`, hence unquoted.
  # ═══════════════════════════════════════════════════════════════
  build-complete:
    if: ${{ always() }}
    name: Build Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - client-build
      - server-build
    steps:
      - name: Check for failures
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more build jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ One or more build jobs were cancelled"
            exit 1
          fi
          echo "✅ Build stage succeeded or was skipped"

  postbuild-tests-complete:
    if: ${{ always() }}
    name: Postbuild Tests Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - build-complete
      - test-integration
      - test-smoke
      - e2e
    steps:
      - name: Check for failures
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more post-build test jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ One or more post-build test jobs were cancelled"
            exit 1
          fi
          echo "✅ Post-build testing stage succeeded or was skipped"

  postbuild-analysis-complete:
    if: ${{ always() }}
    name: Postbuild Analysis Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - build-complete
      - client-sonarqube
      - server-sonarqube
      - client-depcheck
      - server-depcheck
    steps:
      - name: Check for failures
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more post-build analysis jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ One or more post-build analysis jobs were cancelled"
            exit 1
          fi
          echo "✅ Post-build analysis stage succeeded or was skipped"

  # ═══════════════════════════════════════════════════════════════
  # AGGREGATOR — CI Complete — Root verdict over every stage
  # NOT a ruleset-required check: ruleset 21227644 binds exactly two contexts
  # (`Governance: PR Body Lint`, `Prebuild Governance Complete`).
  # ═══════════════════════════════════════════════════════════════
  ci-complete:
    if: ${{ vars.CI_MINIMAL != 'true' && always() }}
    name: CI Complete
    runs-on: ubuntu-latest
    needs:
      - prebuild-governance-complete
      - prebuild-quality-complete
      - prebuild-security-complete
      - prebuild-tests-complete
      - build-complete
      - postbuild-tests-complete
      - postbuild-analysis-complete
      - zombie-workflow-guard
      - repo-discovery
    steps:
      - name: Check for failures
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more upstream jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ One or more upstream jobs were cancelled"
            exit 1
          fi
          echo "✅ All upstream jobs succeeded or were skipped"

  # ═══════════════════════════════════════════════════════════════
  # GUARDS — Zombie Workflow Guard
  # ═══════════════════════════════════════════════════════════════
  zombie-workflow-guard:
    name: Zombie Workflow Guard
    needs: repo-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Assert deleted workflows are absent
        run: |
          if test -f .github/workflows/pr-validation.yml; then
            echo "❌ Zombie workflow pr-validation.yml found"
            exit 1
          fi
          if test -f .github/workflows/lint.yml; then
            echo "❌ Zombie workflow lint.yml found"
            exit 1
          fi
          if test -f .github/workflows/formatter.yml; then
            echo "❌ Zombie workflow formatter.yml found"
            exit 1
          fi
          if test -f .github/workflows/quality.yml; then
            echo "❌ Zombie workflow quality.yml found - should have been deleted"
            exit 1
          fi
          echo "✅ All zombie workflows confirmed absent"
