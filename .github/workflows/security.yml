name: Security Pipeline

on:
  workflow_call:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-scan:
    name: Dependency Scan (SCA)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          ignore-unfixed: 'true'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # =========================
  # SAST (Static Analysis)
  # =========================
  sast:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript,actions

      # - name: Autobuild
      #   uses: github/codeql-action/autobuild@v4

      - name: Install dependencies
        run: npm ci
   
      - name: Analyze
        uses: github/codeql-action/analyze@v4

  # =========================
  # Secret Scanning
  # =========================
  secrets:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan PR diff for secrets (Gitleaks OSS)
        uses: docker://zricethezav/gitleaks:v8.22.1
        with:
          args: git --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --redact --verbose

      - name: Scan for secrets (licensed action - optional)
        if: ${{ secrets.GIT_LEAKS != '' }}
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_LICENSE: ${{ secrets.GIT_LEAKS }}
      - name: "Warn: licensed Gitleaks scan unavailable"
        if: ${{ secrets.GIT_LEAKS == '' }}
        run: echo "::warning::GIT_LEAKS secret not configured - licensed Gitleaks scan skipped. Using open-source Gitleaks only."

# =========================
  # Infrastructure as Code Security
  # =========================
  # iac-security:
  #   name: IaC Security Scan
  #   runs-on: ubuntu-latest
  #
  #   steps:
  #     - uses: actions/checkout@v5
  #
  #     - name: Run Semgrep IaC rules
  #       uses: returntocorp/semgrep-action@v1
  #       with:
  #         config: p/terraform

  # =========================
  # SBOM generation
  # =========================
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom-project-one.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom-project-one.json
          if-no-files-found: error
          retention-days: 365

  # =========================
  # Dependency Review
  # =========================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - name: Run dependency review
        uses: actions/dependency-review-action@v5
        with:
          vulnerability-check: true
          license-check: true