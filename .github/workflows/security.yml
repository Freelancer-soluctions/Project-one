name: Security Pipeline

on:
  workflow_call:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  dependency-scan:
    name: Dependency Scan (SCA)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH

  # =========================
  # SAST (Static Analysis)
  # =========================
  sast:
    name: SAST - CodeQL
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      # - name: Autobuild
      #   uses: github/codeql-action/autobuild@v4

      - name: Install dependencies
        run: npm ci
   
      - name: Analyze
        uses: github/codeql-action/analyze@v4

  # =========================
  # Secret Scanning
  # =========================
  secrets:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan PR diff for secrets (Gitleaks OSS)
        uses: docker://zricethezav/gitleaks:v8.22.1
        with:
          args: git --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --redact --verbose

      - name: Scan for secrets (licensed action - optional)
        if: ${{ secrets.GIT_LEAKS != '' }}
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GIT_LEAKS }}
      - name: Warn: licensed Gitleaks scan unavailable
        if: ${{ secrets.GIT_LEAKS == '' }}
        run: echo "::warning::GIT_LEAKS secret not configured — licensed Gitleaks scan skipped. Using open-source Gitleaks only."

