name: Scheduled Security Scan

on:
  schedule:
    - cron: '0 3 * * 1'  # Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks-full-scan:
    name: Gitleaks Full History Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks full history scan (JSON report)
        uses: docker://zricethezav/gitleaks:v8.22.1
        with:
          args: git --log-opts="--all" --report-format=json --report-path=gitleaks-report.json --redact

      - name: Upload Gitleaks JSON report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

      - name: Run Gitleaks full history scan (SARIF report)
        uses: docker://zricethezav/gitleaks:v8.22.1
        with:
          args: git --log-opts="--all" --report-format=sarif --report-path=gitleaks.sarif --redact

      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  notify-failure:
    name: Notify on Failure
    needs: gitleaks-full-scan
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scheduled security scan failed: ${context.workflow} (${new Date().toISOString().split('T')[0]})`,
              body: `See run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })