# ═══════════════════════════════════════════════════════════════
# PR METADATA WORKFLOW — change `pr-metadata-workflow`
# (capabilities `pr-metadata-workflow` + `pr-body-lint-governance`)
#
# WHY A SEPARATE WORKFLOW (design D1): los checks de metadata necesitan
# re-validarse cuando cambia el TÍTULO o la DESCRIPCIÓN, que no mueven el
# head SHA. `ci.yml` dispara en opened/synchronize/reopened y su
# `concurrency` es `cancel-in-progress: true`, así que añadir `edited` ahí
# (a) re-ejecutaría ~40 jobs de código para una edición de texto y
# (b) cancelaría el pipeline en vuelo. `on:` y `concurrency` son
# workflow-scoped: la separación es la única forma estructural.
#
# CONTRATO CONGELADO (ruleset 21227644, integration_id=15368): los `name:`
# de los dos jobs son contextos de required status check. Renombrarlos sin
# actualizar el ruleset en la misma operación deja cada PR bloqueado con
# "Expected — Waiting for status to be reported", sin ninguna pista.
#   - `PR Title Lint` — contexto existente, emigrado desde `ci.yml` en el
#     MISMO commit que lo borró de allí (single-emitter invariant, D3).
#   - `Governance: PR Body Lint` — contexto nuevo, se añade al ruleset
#     solo DESPUÉS de que haya reportado al menos una vez (D7).
#
# SEGURIDAD (D12): el título y el cuerpo NUNCA se interpolan con `${{ }}`
# dentro de `run:` ni de `script:` — se leen de `context.payload` en
# runtime. Interpolar texto de un PR es la inyección clásica de Actions
# (breakout de shell en `run:`, de template literal en `script:`).
# ═══════════════════════════════════════════════════════════════
name: 'PR Metadata'

# Mínimo indispensable: validar metadata solo LEE el payload y reporta una
# conclusión. `pull-requests: write` y `pull_request_target` están prohibidos
# por spec: un job que necesita escribir en el PR no está validando nada.
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  merge_group: {}

# `cancel-in-progress: false` (D4): una corrida cancelada NO es éxito para un
# required check. GitHub admite 1 en curso + 1 pendiente por grupo; con el
# flag en false la nueva espera, y solo se cancela la PENDIENTE anterior (que
# nunca reportó conclusión, así que no puede dejar ningún check colgado).
# El grupo es `pr-metadata-<n>`: el NAMESPACE evita la colisión con el
# grupo `pr-<n>` de `ci.yml`; el flag solo gobierna corridas de ESTE archivo.
concurrency:
  group: ${{ format('pr-metadata-{0}', github.event_name == 'merge_group' && github.event.merge_group.head_ref || github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════
  # PR Title Lint — emigrado literalmente desde `ci.yml` (tasks 3.1-3.2).
  # `name:` byte-idéntico: es contexto requerido del ruleset 21227644.
  # Los bots NO están exentos (spec `ci-pr-metadata-governance`): el
  # `ignoreLabels` actual se conserva sin cambios.
  # ═══════════════════════════════════════════════════════════════
  pr-title-lint:
    name: 'Governance: PR Title Lint' # frozen contract — ruleset 21227644
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # PR events: validate PR title against Conventional Commits
      - name: Lint PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            ops
          requireScope: false
          ignoreLabels: |
            bot
            ignore-semantic-pull-request
          subjectPattern: '^(?![A-Z]).+$'
          subjectPatternError: 'PR title must follow Conventional Commits format: type(scope): description with lowercase subject'
      # Merge queue: squash commit title already validated by commitlint --last
      - name: Skip on merge_group (covered by commitlint)
        if: github.event_name == 'merge_group'
        run: echo "✅ Merge queue — squash commit title validated by commitlint"

  # ═══════════════════════════════════════════════════════════════
  # Governance: PR Body Lint — gate Duro desde el día 1 (D8: la ventana de
  # calibración se omitió por decisión explícita del usuario). La política
  # vive en `scripts/ci/pr-body-lint.mjs` y sus tests en
  # `scripts/ci/pr-body-lint.test.mjs` (`npm run test:scripts`).
  # Superficie de reporte: Step Summary ÚNICAMENTE (change
  # `simplify-pr-body-lint-template`, D2) — sin `report.json` ni artefacto de
  # 14 días, y sin acción que fijar por SHA para subirlo.
  # ═══════════════════════════════════════════════════════════════
  pr-body-lint:
    name: 'Governance: PR Body Lint' # frozen contract — ruleset 21227644
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Exclusión SOLO de autor BOT (estable), nunca `github.actor` (trigger):
    # un maintainer editando un PR de Dependabot tiene actor humano, y el
    # actor cambia en cada evento mientras que el autor no (D6).
    # NO excluye merge_group: el no-op del final debe ser alcanzable — un
    # job con `if` falso nunca ejecuta sus steps (D5).
    if: >-
      github.event_name == 'merge_group' ||
      github.event.pull_request.user.type != 'Bot'
    permissions:
      contents: read
      pull-requests: read
    steps:
      # La política se lee desde el BASE REF (D9b): un PR no puede reescribir
      # el módulo que lo juzga para volver verde su propio veredicto.
      - name: Fetch policy module from base ref
        if: github.event_name == 'pull_request'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (SHA-pinned, nunca @main/@v*)
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: false
          # El job solo LEE la política: nada que push-ear (zizmor `artipacked`).
          persist-credentials: false
      - name: Validate PR body against governance policy
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (SHA-pinned, nunca @main/@v*)
        with:
          # El cuerpo sale de `context.payload` (D12): jamás `${{ }}`.
          script: |
            const { evaluate } = require('./scripts/ci/pr-body-lint.mjs');
            await evaluate({ core, context });
      - name: Skip on merge_group
        if: github.event_name == 'merge_group'
        run: echo "✅ Merge queue — a merge-queue entry has no pull request body to validate"
