name: Release

on:
  push:
    branches: [main]

# Least-privilege (zizmor `excessive-permissions`): write solo en el job
# `release`, que es el único que crea el PR de versión y publica. El resto
# (secrets-full-history, verificación) corre con `contents: read`.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Escaneo full-history ANTES de publicar (change `secret-scanning-history-governance`,
  # RH-5): un release es el último punto en que el historial ya es público y estable;
  # si hay un secreto fuera de allowlist, el release no debe publicarse. `release`
  # depende de este job, así que un hallazgo falla la publicación.
  secrets-full-history:
    name: Secret Scan (full history, pre-release)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      # Un checkout shallow convertiría el "full history" en el último commit.
      - name: Assert full-history checkout (not shallow)
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::Checkout shallow: el escaneo pre-release vería solo el último commit."
            exit 1
          fi
        shell: bash

      # `--redact` evita volcar el valor en los logs; los hallazgos fallan el job
      # (exit 1) y, por el `needs`, también el release.
      - name: Gitleaks full-history scan (fail on findings)
        uses: docker://zricethezav/gitleaks:v8.30.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: git --log-opts="--all" --redact --verbose

      # Misma capa de verificación que `security.yml` (change `ci-shifting-left` A6):
      # solo falla con secretos VERIFICADOS (exit 183 con `--fail`).
      - name: TruffleHog verified-secret scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/trufflesecurity/trufflehog:3.99.4 \
            git \
            file:///repo \
            --results=verified \
            --fail
        shell: bash

  release:
    needs: secrets-full-history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Least-privilege (zizmor `github-app`): sin estos inputs el token
          # hereda TODOS los permisos de la instalación de la App.
          permission-contents: write
          permission-pull-requests: write

      - name: Create Release PR or Publish
        id: changesets
        # Pinned to the exact tag v2.1.2 (latest v2). MAJOR moves of @changesets/cli or
        # changesets/action are BREAKING and must land together in one PR (an atomically
        # paired half-migration broke this pipeline 2026-08-12→2026-09-21: the floating
        # tag @v2 required @changesets/cli v3 while the repo had v2).
        # Pairing rule: action v1.x ↔ @changesets/cli v2 · action v2.x ↔ @changesets/cli v3.
        # Current pairing: action v2.1.2 ↔ @changesets/cli ^3.0.3 (CLI v3 notes that touched
        # this repo: #2186 privatePackages (set true in .changeset/config.json), #2128
        # `changeset tag`→`changeset git-tag` (see the `release` script), #1860 version
        # exits 1 on no-op (fail-loud is accepted), #1482 node ^22.11||^24||>=26 (.nvmrc 22.x).
        # If a publish mode is ever added, pass CHANGESETS_OUTPUT down to the CLI invocations
        # (action README). Keep the token on the github-token input (v2 REQUIRES it; env
        # GITHUB_TOKEN is rejected when it differs from the input).
        # Do NOT re-add runner-side SSH signing config (see
        # openspec/specs/commit-signing-release-migration + release-workflow-compatibility).
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: npm run version:packages
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          # API mode (explicit): GitHub auto-signs the version commit and Release PR with
          # its web-flow GPG key (Verified badges, required_signatures-compliant).
          push-with-git-cli: false

      - name: Verify Commit Signature
        if: success()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          LAST_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          VERIFIED=$(gh api repos/${{ github.repository }}/commits/${LAST_SHA} --jq '.commit.verification.verified')
          if [ "$VERIFIED" != "true" ]; then
            echo "❌ Commit signature verification failed"
            exit 1
          fi
          echo "✅ Commit signature is verified"
