name: Scheduled Security Digest

on:
  schedule:
    - cron: '0 3 * * 1' # Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 'PR number to post digest comment on (optional)'
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level `contents: write` (no a nivel workflow — least privilege, change
    # `sbom-dependency-snapshot`): requerido por la Dependency submission API que
    # consume `dependency-snapshot: true`. Este workflow solo corre en schedule /
    # workflow_dispatch (nunca forks), así que el token siempre es write-capable.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          output-file: sbom-project-one.json
          # Sube el SBOM al Dependency submission API para cobertura Dependabot de
          # transitivas (github-token default = github.token; CycloneDX aceptado).
          dependency-snapshot: true
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: sbom-project-one.json
          if-no-files-found: error
          retention-days: 365

  vulnerability-review:
    name: Vulnerability & License Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # Binario pinneado + SHA-256: `google/osv-scanner-action@v2.5.0` apunta a
      # un `action.yml` raíz sin `runs:` (stub), y la action anidada cambia de
      # CLI entre minors. Mismo patrón que `lockfile-audit` en `ci.yml`.
      - name: Install OSV-Scanner (v2.5.0, checksum)
        env:
          OSV_SCANNER_URL: https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64
          OSV_SCANNER_SHA256: edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" "$OSV_SCANNER_URL"
          echo "$OSV_SCANNER_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Run OSV Scanner
        run: >
          "$RUNNER_TEMP/osv-scanner" scan -L package-lock.json
          --format=json --output-file=osv-report.json
      - name: Upload OSV Report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: osv-report
          path: osv-report.json

  digest:
    name: Generate Security Digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [sbom, vulnerability-review]
    if: always() && !cancelled()
    permissions:
      pull-requests: write
    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: sbom
          path: artifacts/sbom
      - name: Download OSV Report artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: osv-report
          path: artifacts/osv-report
      - name: Find latest scheduled-security run
        id: sibling-run
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'scheduled-security.yml',
              per_page: 1,
              status: 'completed',
            });
            if (runs.data.workflow_runs.length === 0) {
              core.setOutput('run_id', '');
              return;
            }
            core.setOutput('run_id', runs.data.workflow_runs[0].id.toString());
      - name: Download Gitleaks Report from sibling
        if: steps.sibling-run.outputs.run_id != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: gitleaks-report
          path: artifacts/gitleaks
          run-id: ${{ steps.sibling-run.outputs.run_id }}
        continue-on-error: true
      - name: Generate Security Digest
        run: |
          node scripts/security/generate-security-digest.mjs \
            artifacts/sbom/sbom-project-one.json \
            artifacts/osv-report/osv-report.json \
            artifacts/gitleaks/gitleaks-report.json \
            security-digest.md
      - name: Upload Security Digest artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-digest
          path: security-digest.md
      - name: Post digest comment to PR
        if: inputs.pull_request_number != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          # Nunca interpolar `${{ inputs.* }}` dentro de `script:` (zizmor
          # `template-injection`): la entrada va por entorno.
          PR_NUMBER: ${{ inputs.pull_request_number }}
        with:
          script: |
            const fs = require('fs');
            const digest = fs.readFileSync('security-digest.md', 'utf8');
            const hasCriticalOrHigh = digest.includes('🚨 CRITICAL') || digest.includes('🔴 HIGH');
            const hasDenyList = digest.includes('⛔ DENY-LIST');
            if (!hasCriticalOrHigh && !hasDenyList) {
              console.log('No actionable findings — skipping PR comment');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(process.env.PR_NUMBER, 10),
              body: `## Security Digest Summary\n\n${digest.split('\n').slice(0, 50).join('\n')}\n\n---\n*Full digest available in the [security-digest artifact](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) of this workflow run.*`
            });

  notify-failure:
    name: Notify on Failure
    needs: [sbom, vulnerability-review, digest]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scheduled security scan failed: ${context.workflow} (${new Date().toISOString().split('T')[0]})`,
              body: `See run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
