name: Scheduled Security Digest

on:
  schedule:
    - cron: '0 3 * * 1'  # Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 'PR number to post digest comment on (optional)'
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          format: cyclonedx-json
          output-file: sbom-project-one.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom-project-one.json
          if-no-files-found: error
          retention-days: 365

  vulnerability-review:
    name: Vulnerability & License Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Run OSV Scanner
        uses: google/osv-scanner-action@v2.5.0
        with:
          scan-args: --format=json --output=osv-report.json package-lock.json
      - name: Upload OSV Report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: osv-report
          path: osv-report.json

  digest:
    name: Generate Security Digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [sbom, vulnerability-review]
    if: always() && !cancelled()
    permissions:
      pull-requests: write
    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@v5
        with:
          name: sbom
          path: artifacts/sbom
      - name: Download OSV Report artifact
        uses: actions/download-artifact@v5
        with:
          name: osv-report
          path: artifacts/osv-report
      - name: Find latest scheduled-security run
        id: sibling-run
        uses: actions/github-script@v8
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'scheduled-security.yml',
              per_page: 1,
              status: 'completed',
            });
            if (runs.data.workflow_runs.length === 0) {
              core.setOutput('run_id', '');
              return;
            }
            core.setOutput('run_id', runs.data.workflow_runs[0].id.toString());
      - name: Download Gitleaks Report from sibling
        if: steps.sibling-run.outputs.run_id != ''
        uses: actions/download-artifact@v5
        with:
          name: gitleaks-report
          path: artifacts/gitleaks
          run-id: ${{ steps.sibling-run.outputs.run_id }}
        continue-on-error: true
      - name: Generate Security Digest
        run: |
          node scripts/security/generate-security-digest.mjs \
            artifacts/sbom/sbom-project-one.json \
            artifacts/osv-report/osv-report.json \
            artifacts/gitleaks/gitleaks-report.json \
            security-digest.md
      - name: Upload Security Digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: security-digest
          path: security-digest.md
      - name: Post digest comment to PR
        if: inputs.pull_request_number != ''
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const digest = fs.readFileSync('security-digest.md', 'utf8');
            const hasCriticalOrHigh = digest.includes('🚨 CRITICAL') || digest.includes('🔴 HIGH');
            const hasDenyList = digest.includes('⛔ DENY-LIST');
            if (!hasCriticalOrHigh && !hasDenyList) {
              console.log('No actionable findings — skipping PR comment');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt('${{ inputs.pull_request_number }}'),
              body: `## Security Digest Summary\n\n${digest.split('\n').slice(0, 50).join('\n')}\n\n---\n*Full digest available in the [security-digest artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) of this workflow run.*`
            });

  notify-failure:
    name: Notify on Failure
    needs: [sbom, vulnerability-review, digest]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scheduled security scan failed: ${context.workflow} (${new Date().toISOString().split('T')[0]})`,
              body: `See run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })