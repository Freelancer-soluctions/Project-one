name: Coverage Ratchet Monthly

# Monthly floor-raise proposal. This workflow never enables Vitest
# `autoUpdate` and never rewrites thresholds directly on main: it rewrites a
# bot branch, advances the versioned baseline to match, and opens/updates one
# PR. That PR still passes `coverage-floor-guard` like any other change.
#
# A fixed branch name (`coverage-ratchet/monthly`) is the duplicate guard: the
# action updates the existing PR instead of opening a second one. When no floor
# can be raised, the action finds no diff and opens nothing.

on:
  schedule:
    # First day of each month at 04:00 UTC.
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: coverage-ratchet-monthly
  cancel-in-progress: false

jobs:
  propose:
    name: Monthly - Propose floor raises
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo

      # Same App-token strategy as release.yml: the token is what lets the bot
      # create signed commits through the API (required_signatures).
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Least-privilege (zizmor `github-app`): el token solo abre/actualiza
          # el PR de ratchet (rama + PR), no necesita el resto de la instalación.
          permission-contents: write
          permission-pull-requests: write

      - name: Measure coverage and compute proposals
        run: >-
          node scripts/ci/coverage-ratchet-cron.mjs --write
          --proposal reports/coverage-ratchet-proposal.json
          --summary reports/coverage-ratchet-proposal.md

      - name: Open or update ratchet PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: coverage-ratchet/monthly
          sign-commits: true
          title: 'chore(coverage): raise floors from monthly measurement'
          body-path: reports/coverage-ratchet-proposal.md
          commit-message: 'chore(coverage): raise floors from monthly measurement'
          labels: coverage-ratchet
          delete-branch: false
          add-paths: |
            apps/client/vitest.config.js
            apps/server/vitest.config.ts
            .coverage-baseline.json
            docs/learning/coverage-tripwire-floor-ratchet.md
          draft: false
