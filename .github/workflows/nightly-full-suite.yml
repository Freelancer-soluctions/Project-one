name: Nightly Full Suite

# Red de seguridad del TIA — change `coverage-tripwire-stage-2d`, D7
# (spec `ci-test-impact-analysis`, "Scheduled full-suite safety net").
#
# POR QUÉ UN WORKFLOW NUEVO y no un bloque `schedule:` en ci.yml (D7):
#   - El `concurrency` de ci.yml referencia `github.event.pull_request.number`,
#     inexistente en `schedule`: todos los runs nocturnos colisionarían en el
#     mismo grupo `pr-` y se cancelarían entre sí.
#   - El `on:` de ci.yml está pensado para PR/merge_group.
#   - Separar el nocturno evita competir con el gate de merge; ambos aplican
#     el mismo guard estricto sobre reportes de suite completa.
#
# CONTRATO:
#   - Suite COMPLETA de ambos workspaces, sin importar el diff (nunca TIA).
#   - NO aplica las exclusiones de `.github/flaky-quarantine.yml` (D9): el
#     nocturno EJECUTA los tests en cuarentena y su resultado es la evidencia de
#     restauración que necesita el owner (spec ci-flaky-quarantine).
#   - Cobertura + `check-coverage.mjs` estricto: un floor roto falla el job
#     nocturno. El gate de PR equivalente vive en `coverage-full-gate` de ci.yml.

on:
  schedule:
    # Diario 02:40 UTC. Offset deliberado respecto de `scheduled-security.yml`
    # (lunes 03:00) para no competir por los runners de GitHub.
    - cron: '40 2 * * *'
  workflow_dispatch:

# Least-privilege explícito (task 4.3): `checks: write` es lo que permite a
# `dorny/test-reporter` publicar el check de test; `contents: read` para el
# checkout. Nada de `security-events` (este workflow no sube SARIF).
permissions:
  contents: read
  checks: write

# Sin `cancel-in-progress`: un run nocturno debe completarse entero (si dos
# runs se solapan, el segundo espera).
concurrency:
  group: nightly-full-suite
  cancel-in-progress: false

jobs:
  nightly-client:
    env:
      # Opt-out del sequencer TIA (task 5.1, design D7): el nightly corre la
      # suite completa SIN orden impuesto por fallos históricos, para no
      # enmascarar order-dependence. La selección scoped (PRs) SÍ usa el
      # sequencer vía tia-select.mjs / vitest.sequencer.js.
      TIA_SEQUENCER: stable
    name: Nightly - Client Full Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo

      # Suite completa explícita (NO `test:changed:ci`): el nocturno es la red
      # de seguridad contra lo que el diff-scoped dejó fuera.
      - name: Run Client full suite with coverage
        run: npm run test:coverage:ci --workspace=apps/client
        shell: bash

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-coverage-client
          path: apps/client/coverage/
          retention-days: 14
          if-no-files-found: warn

      # Historial de tests fallidos en main — task 4.2 (tia-hardening, D4).
      # El nocturno es la fuente full-suite: consolida `vitest-results.json`
      # en `tia-history.json` y lo publica 30 días para que los jobs scoped
      # de ci.yml lo consuman (`Inject previously-failing tests`).
      - name: Record TIA history
        if: always()
        run: |
          mkdir -p apps/client/reports
          node scripts/ci/tia-history.mjs apps/client --record --out apps/client/reports/tia-history.json || true
        shell: bash

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tia-history-client
          path: apps/client/reports/tia-history.json
          retention-days: 30
          if-no-files-found: warn

      # Coverage-map — task 7.2 (tia-hardening, design D5). Espejo del job
      # unit de ci.yml: el nocturno es el run full-suite cuyo artefacto
      # `coverage-map-<ws>-<sha>` consume `Consume coverage-map (best-effort)`
      # de ci.yml (resuelve el último run satisfactorio de ESTE workflow) —
      # sin este par de steps `map=hit` era inalcanzable. Best-effort (D12):
      # `tia-map.mjs` escribe siempre un JSON válido y sale 0; el upload no
      # bloquea (`if-no-files-found: warn`).
      - name: Build coverage-map (best-effort)
        if: always()
        run: node scripts/ci/tia-map.mjs apps/client --build || true
        shell: bash

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-map-client-${{ github.sha }}
          path: apps/client/reports/coverage-map.json
          retention-days: 30
          if-no-files-found: warn

      # Strict full-suite floor check. Missing coverage is a failure, not a
      # successful warning; test failures already keep the job red as well.
      - name: Enforce coverage thresholds (full suite)
        if: success()
        run: |
          if [ ! -f apps/client/coverage/coverage-summary.json ]; then
            echo "::error::coverage summary missing — full-suite floor cannot be evaluated"
            exit 1
          fi
          node scripts/ci/check-coverage.mjs apps/client apps/client/coverage
        shell: bash

      - name: Report Client Unit Tests
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Nightly Client Unit Tests
          path: apps/client/reports/junit.xml
          reporter: java-junit

  nightly-server:
    name: Nightly - Server Full Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo

      # Suite unitaria completa del server (filtro `.unit.test.js`): los tests
      # de integración necesitan PostgreSQL y viven en su propio pipeline.
      - name: Run Server full unit suite with coverage
        run: npm run test:coverage:unit:ci --workspace=apps/server
        shell: bash

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-coverage-server
          path: apps/server/tests/coverage/
          retention-days: 14
          if-no-files-found: warn

      # Historial de tests fallidos en main — task 4.2 (tia-hardening, D4).
      # Espejo del job client: el nocturno publica el historial unitario del
      # server para `Inject previously-failing tests` de ci.yml.
      - name: Record TIA history
        if: always()
        run: |
          mkdir -p apps/server/reports
          node scripts/ci/tia-history.mjs apps/server --record --out apps/server/reports/tia-history.json || true
        shell: bash

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tia-history-server
          path: apps/server/reports/tia-history.json
          retention-days: 30
          if-no-files-found: warn

      # Coverage-map — task 7.2 (tia-hardening, design D5). Espejo del job
      # client: fuente full-suite del consumidor `Consume coverage-map
      # (best-effort)` de ci.yml (`coverage-map-server-<sha>`). Best-effort
      # (D12): `tia-map.mjs` escribe siempre un JSON válido y sale 0; el
      # upload no bloquea (`if-no-files-found: warn`).
      - name: Build coverage-map (best-effort)
        if: always()
        run: node scripts/ci/tia-map.mjs apps/server --build || true
        shell: bash

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-map-server-${{ github.sha }}
          path: apps/server/reports/coverage-map.json
          retention-days: 30
          if-no-files-found: warn

      - name: Enforce coverage thresholds (full suite)
        if: success()
        run: |
          if [ ! -f apps/server/tests/coverage/coverage-summary.json ]; then
            echo "::error::coverage summary missing — full-suite floor cannot be evaluated"
            exit 1
          fi
          node scripts/ci/check-coverage.mjs apps/server apps/server/tests/coverage
        shell: bash

      - name: Report Server Unit Tests
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Nightly Server Unit Tests
          path: apps/server/reports/junit.xml
          reporter: java-junit

  # G6 del change `snapshot-gates` — drift probe de snapshots (design D6).
  # Corre la suite client con update DELIBERADO (`test:snapshot:refresh`,
  # script allowlistado de G2) en este checkout desechable y falla si el diff
  # resultante muestra cambios en artefactos de snapshot: un `.snap` distinto
  # tras un refresh limpio es drift real (serialización no determinista o
  # snapshot stale commiteado). Job propio (no step de `nightly-client`): su
  # veredicto es aislado y jamás entra en `needs` de ci.yml (schedule-only).
  nightly-snapshot-drift:
    name: Nightly - Snapshot Drift Probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo

      - name: Refresh snapshots (deliberate update in disposable checkout)
        run: npm run test:snapshot:refresh --workspace=apps/client
        shell: bash

      - name: Detect snapshot drift
        run: |
          CHANGED=$(git diff --name-only -- '*.snap' 'apps/client/src/**/*.ui.test.jsx' || true)
          UNTRACKED=$(git status --porcelain -- '*.snap' 'apps/client/src/**/*.ui.test.jsx' || true)
          if [ -n "${CHANGED}" ] || [ -n "${UNTRACKED}" ]; then
            echo "::error::Snapshot drift detected — refreshed snapshots differ from committed ones:"
            if [ -n "${CHANGED}" ]; then echo "CHANGED:"; echo "${CHANGED}"; fi
            if [ -n "${UNTRACKED}" ]; then echo "UNTRACKED:"; echo "${UNTRACKED}"; fi
            exit 1
          fi
          echo "✅ No snapshot drift — refreshed snapshots match the committed ones"
        shell: bash
