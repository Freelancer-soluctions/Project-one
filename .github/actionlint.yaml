# actionlint config — suppresses known intentional / pre-existing findings.
# Change: ci-prebuild-quality-lint (Decision 4). The CI `actionlint` job
# (rhysd/actionlint@v1) reads this file automatically from .github/.
ignore:
  # Incremental-CI design: jobs intentionally disabled via `if: false`
  # (see docs/CONTEXT-CICD.md §3.1/§5.5). Flagged as [if-cond] by actionlint
  # but NOT a bug — do not "fix" by removing the if: section.
  - 'constant expression "false" in condition'
  # Pre-existing in security.yml (disabled_manually workflow, out of scope):
  # step-level `secrets.GIT_LEAKS` guards flagged as [expression].
  # Fixing them means touching a disabled workflow — deferred to a future
  # SECURITY-stage change per docs/CONTEXT-CICD.md §7 rule 4 (no mixed stages).
  - 'context "secrets" is not allowed here'
