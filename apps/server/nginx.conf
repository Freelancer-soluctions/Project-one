# ============================================================
# NGINX Reverse Proxy para Socket.IO con soporte WSS
# ============================================================
# Este archivo configura NGINX como proxy reverso para la API
# Express (puerto 3000) y WebSocket Socket.IO.
#
# Socket.IO requiere:
#   - HTTP/1.1 (proxy_http_version 1.1)
#   - Upgrade headers (Connection y Upgrade) para el handshake WS
#   - Timeout largo (86400s = 24h) porque WS es persistente
# ============================================================

upstream api_servers {
    # En Docker, "api" es el nombre del servicio en docker-compose
    server api:3000;
}

upstream ws_servers {
    server api:3001;
}

server {
    listen 80;
    server_name api.tudominio.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.tudominio.com;

    # Certificados TLS — en producción usar Let's Encrypt (certbot)
    # En desarrollo local, generar self-signed:
    # openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #   -keyout /etc/nginx/ssl/nginx.key \
    #   -out /etc/nginx/ssl/nginx.crt
    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Headers de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    # Tamaño máximo del body (para subida de archivos en notas)
    client_max_body_size 50M;

    # --- Frontend estático (build de Vite de apps/client) ---
    # El `vite build` se monta en /usr/share/nginx/html. Los `.map` NO se
    # publican: se suben al sistema de errores (ver docs/frontend/frontend-sourcemaps-y-cache.md).
    root /usr/share/nginx/html;

    # Los source maps nunca se sirven, aunque el volumen los incluya: exponerlos
    # publica el código fuente original. Con `sourcemap: 'hidden'` el bundle no
    # los referencia, así que un 404 aquí no rompe nada en el navegador.
    location ~* ^/assets/.+\.map$ {
        return 404;
    }

    # Assets con hash inmutable (nombre = contenido): cache de 1 año.
    # `add_header` NO se hereda del server cuando la location declara sus
    # propios add_header, así que los headers de seguridad se repiten.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        try_files $uri =404;
    }

    # `index.html` es el único archivo sin hash: si se cachea, los clientes
    # siguen pidiendo bundles viejos. `no-cache` = revalidar siempre.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    # Fallback de SPA: cualquier ruta del router React resuelve a index.html
    # (redirect interno a `location = /index.html`, que aplica el no-cache).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Rutas API REST (no-WebSocket) ---
    location /api/ {
        proxy_pass http://api_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rutas WebSocket (Socket.IO) ---
    # Socket.IO usa el path /socket.io/ por defecto.
    # Requiere HTTP/1.1 y headers Upgrade/Connection.
    location /socket.io/ {
        proxy_pass http://ws_servers;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout largo para conexiones WebSocket persistentes
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Métricas Prometheus ---
    location /metrics {
        proxy_pass http://api_servers;
        proxy_set_header Host $host;
    }
}