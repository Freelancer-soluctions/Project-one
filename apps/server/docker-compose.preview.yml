# ============================================================
# docker-compose.preview.yml - Stack de emulación AWS para Preview
# ============================================================
# Stack efímero para validación de PR y aprendizaje AWS con Floci
# Componentes: server (Express) + floci (emulador AWS) + db (PostgreSQL efímera)
# NO modifica docker-compose.yml (dev-local) - ese es el change ci-floci-migration
# ============================================================

services:
  # Floci - Emulador AWS (MIT, puerto 4566, 68 servicios, storage en memoria)
  # Pin concreto 1.5.31 para reproducibilidad (política de pinning del repo)
  floci:
    image: floci/floci:1.5.31
    container_name: preview-floci
    ports:
      - "4566:4566"
    environment:
      - FLOCI_STORAGE_MODE=memory
      - FLOCI_HOSTNAME=floci
    # Sin healthcheck propio: la imagen trae uno nativo (CMD-SHELL curl -f
    # http://localhost:4566/_floci/health, 5s/3s/5 retries). La imagen no incluye
    # CLI "floci" ni "which"; solo curl/sh/ls.
    networks:
      - preview-network

  # PostgreSQL efímera para el stack de preview
  # postgres:16-alpine (alineado con tests de integración, sin volumen persistente)
  db:
    image: postgres:16-alpine
    container_name: preview-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=project_one_preview
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d project_one_preview"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - preview-network

  # Server Express - Build desde Dockerfile existente
  # context: raíz del monorepo (el Dockerfile copia package-lock.json de la raíz y el
  # path de dockerfile es RELATIVO AL CONTEXT según el spec de compose)
  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    container_name: preview-server
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://test:test@db:5432/project_one_preview
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - PORT=3000
      # Habilita la ruta test-only /_smoke/secrets (misma config que el workflow de CI)
      - ENABLE_SMOKE_ROUTE=true
      # AES_GCM_KEY: dummy base64 of 32 zero bytes — required by encryptionMiddleware
      # bootstrap (apps/server/src/middleware/encription-prisma-middleware.js) so the
      # module import does not throw before Express listens. Preview stack never
      # persists or decrypts real data, so a predictable dummy key is safe.
      - AES_GCM_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      - ALGORITHM=aes-256-gcm
    depends_on:
      db:
        condition: service_healthy
      floci:
        condition: service_healthy
    networks:
      - preview-network

networks:
  preview-network:
    driver: bridge