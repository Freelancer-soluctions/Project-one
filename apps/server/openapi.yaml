  /api/v1/events:
    get:
      description: Obtiene la lista de eventos junto con la información del tipo de
        evento. Se puede filtrar usando 'searchQuery', 'type', 'dateFrom',
        'dateTo', 'speaker', y 'status'.
      parameters:
        - description: Texto para buscar en el título, descripción o speaker del evento.
          example: Tech Conference 2025
          in: query
          name: searchQuery
          required: false
          schema:
            maxLength: 30
            minLength: 1
            type: string
        - description: Filtrar por ID de tipo de evento (coincidencia exacta en
            eventTypeId).
          example: 1
          in: query
          name: type
          required: false
          schema:
            minimum: 1
            type: integer
        - description: "Filtrar eventos desde esta fecha (inclusive, formato ISO:
            YYYY-MM-DD)."
          example: 2025-01-01
          in: query
          name: dateFrom
          required: false
          schema:
            format: date
            type: string
        - description: "Filtrar eventos hasta esta fecha (inclusive, formato ISO:
            YYYY-MM-DD, normalizado a fin de día)."
          example: 2025-12-31
          in: query
          name: dateTo
          required: false
          schema:
            format: date
            type: string
        - description: Filtrar por nombre del speaker (coincidencia parcial,
            case-insensitive).
          example: John
          in: query
          name: speaker
          required: false
          schema:
            maxLength: 50
            type: string
        - description: "Filtrar por estado del evento: 'upcoming' (futuros), 'past'
            (pasados), o 'all' (todos)."
          example: upcoming
          in: query
          name: status
          required: false
          schema:
            enum:
              - upcoming
              - past
              - all
            type: string
        - description: "Número de página para paginación (default: 1)."
          example: 2
          in: query
          name: page
          required: false
          schema:
            default: 1
            minimum: 1
            type: integer
        - description: "Cantidad de eventos por página (default: 20, max: 100)."
          example: 20
          in: query
          name: limit
          required: false
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: "#/components/schemas/ResponseGetEvents"
                    type: array
                  error:
                    example: false
                    type: boolean
                  message:
                    example: Some success message
                    type: string
                  statusCode:
                    example: 200
                    type: integer
                type: object
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
          description: Unauthorized
        5XX:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error inesperado
      security:
        - bearerAuth: []
      summary: Obtener eventos
      tags:
        - Events
    post:
      description: Este endpoint requiere autenticación. El userId se extrae
        automáticamente del token JWT.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BodyEventCreateUpdate"
        required: true
