# Mise = SSOT del toolchain de lint/seguridad (change ci-mise-toolchain-parity).
# Lockfile: mise.lock (checksums por plataforma). Instalar SIEMPRE con:
#   mise install --locked
# Node se declara aquí por paridad, pero .nvmrc sigue siendo el SSOT del
# runtime durante la migración: ambos deben coincidir (verificado en CI).
monorepo_root = true

[tools]
node = "22.23.1" # paridad con .nvmrc — no migrar el runtime aún
python = "3.13.18" # guarddog 3.2.0 exige cp313 (pygit2/yara-python wheels)
uv = "0.13.10"

# Binarios precompilados vía aqua (multiplataforma + checksums)
"aqua:hadolint/hadolint" = "2.15.1"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.30.1"
"aqua:gitleaks/gitleaks" = "8.30.1"

# Paquetes Python vía pipx (aislados, wheels verificadas)
# checkov 3.2.0 pinea rustworkx==0.13.2 (sin wheels cp313) → intérprete 3.12.
"pipx:checkov" = { version = "3.2.0", python = "3.12" }
"pipx:semgrep" = "1.176.1"
# guarddog: sandbox (nono-py) solo publica wheels linux/macos; en Windows
# se desactiva vía mise.windows.toml (GuardDog en Windows = solo Docker).
"pipx:guarddog" = { version = "3.2.0", python = "3.13" }

[settings]
lockfile = true
locked_require_checksum = true
enable_backends = ["core", "aqua", "pipx"]
# .nvmrc sigue siendo el SSOT del runtime Node; mise no lo lee como
# idiomatic file (node ya está declarado arriba por paridad).
# .tool-versions se excluye vía .miserc.toml (ignored_config_paths).
legacy_version_file = false