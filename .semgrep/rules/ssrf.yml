# semgrep custom rule: SSRF (CWE-918)
# Target: Dynamic URL construction from user input passed to fetch/axios.get/http.request
# Confidence: HIGH
metadata:
  cwe: ["CWE-918"]
  confidence: HIGH
  technology: ["javascript", "nodejs", "express"]
  severity: ERROR

pattern-sources:
  - pattern: |
      $USER_INPUT = req.body.data
      $USER_INPUT = req.query.data
      $USER_INPUT = req.params.data

pattern-sinks:
  - pattern: |
      fetch($USER_INPUT)
  - pattern: |
      axios.get($USER_INPUT)
  - pattern: |
      http.request($USER_INPUT)

confidence: HIGH