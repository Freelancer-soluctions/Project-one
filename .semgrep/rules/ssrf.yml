# semgrep custom rule: SSRF (CWE-918)
# Target: Dynamic URL construction from user input passed to fetch/axios.get/http.request
# Confidence: HIGH
# True-negative fixture: tests/ssrf.test.fixed.js
# (fetch with whitelisted URL — whitelist[...] lookup sanitizes the taint)
rules:
  - id: ssrf-dynamic-url
    message: Potential Server-Side Request Forgery (SSRF). User-controlled data flows into a network request URL. Validate against an allowlist before requesting.
    severity: ERROR
    languages: [javascript, typescript]
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: req
              - pattern: req.body
              - pattern: req.query
              - pattern: req.params
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($X, ...)
              - pattern: axios.get($X, ...)
              - pattern: axios($X, ...)
              - pattern: $HTTP.request($X, ...)
    pattern-sanitizers:
      - patterns:
          - pattern: whitelist[...]
    metadata:
      cwe: ["CWE-918"]
      confidence: HIGH
      technology: ["javascript", "nodejs", "express"]
      category: security
      owasp: ["A10:2021 - Server-Side Request Forgery"]
