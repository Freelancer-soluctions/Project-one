# semgrep custom rule: Prisma Raw SQL Injection (CWE-89)
# Target: $queryRaw / $queryRawUnsafe / $executeRaw / $executeRawUnsafe with tainted user input
# Confidence: HIGH
# MUST include true-negative fixture with safe Prisma.sql tagged template (parameterized, NO string interpolation)
metadata:
  cwe: ["CWE-89"]
  confidence: HIGH
  technology: ["javascript", "nodejs", "prisma"]
  severity: ERROR

pattern-sources:
  - pattern: |
      $queryRaw($X)
  - pattern: |
      $queryRawUnsafe($X)
  - pattern: |
      $executeRaw($X)
  - pattern: |
      $executeRawUnsafe($X)

pattern-sinks:
  - pattern: |
      $queryRaw($X)

  - pattern: |
      $queryRawUnsafe($X)

  - pattern: |
      $executeRaw($X)

  - pattern: |
      $executeRawUnsafe($X)

confidence: HIGH