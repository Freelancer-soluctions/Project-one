# semgrep custom rule: Prisma Raw SQL Injection (CWE-89)
# Target: $queryRaw / $executeRaw with tainted user input
# Confidence: HIGH
# MUST include true-negative fixture with safe Prisma.sql tagged template (parameterized, NO string interpolation)
metadata:
  cwe: ["CWE-89"]
  confidence: HIGH
  technology: ["javascript", "nodejs", "prisma"]
  severity: ERROR

pattern-sources:
  - pattern: |
      $USER_INPUT = req.body.data
      $USER_INPUT = req.query.data
      $USER_INPUT = req.params.data

pattern-sinks:
  - pattern: |
      $queryRaw($USER_INPUT)
  - pattern: |
      $queryRawUnsafe($USER_INPUT)
  - pattern: |
      $executeRaw($USER_INPUT)
  - pattern: |
      $executeRawUnsafe($USER_INPUT)

confidence: HIGH