# semgrep custom rule: Prototype Pollution (CWE-1321)
# Target: Object.assign userInput or bracket notation with uncontrolled input
# Confidence: MEDIUM — inter-procedural taint limited; first arg must be user-controlled
metadata:
  cwe: ["CWE-1321"]
  confidence: MEDIUM
  technology: ["javascript", "nodejs"]
  severity: ERROR

pattern-sources:
  - pattern: |
      $USER_INPUT = req.body.data
      $USER_INPUT = req.query.data
      $USER_INPUT = req.params.data

pattern-sinks:
  - pattern: |
      Object.assign($TARGET, $USER_INPUT)
  - pattern: |
      $TARGET[$USER_INPUT] = $VALUE

confidence: MEDIUM