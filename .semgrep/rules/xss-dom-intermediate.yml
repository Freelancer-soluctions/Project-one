# semgrep custom rule: XSS via DOM intermediate variable (CWE-79)
# Target: innerHTML / dangerouslySetInnerHTML fed by user-controlled intermediate variables
# Confidence: MEDIUM — taint precision may be insufficient for intermediate variable tracking
# MUST include true-negative fixture with safe dangerouslySetInnerHTML={{ __html: constant }} (no user-controlled intermediate)
metadata:
  cwe: ["CWE-79"]
  confidence: MEDIUM
  technology: ["javascript", "react", "nodejs"]
  severity: ERROR

pattern-sources:
  - pattern: |
      $USER_INPUT = req.body.data
      $USER_INPUT = req.query.data
      $USER_INPUT = req.params.data

pattern-sinks:
  - pattern: |
      $VAR.innerHTML = $USER_INPUT
  - pattern: |
      $VAR.document.write = $USER_INPUT
  - pattern: |
      $VAR.dangerouslySetInnerHTML = ${{ __html: $USER_INPUT }}

confidence: MEDIUM