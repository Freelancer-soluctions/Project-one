# semgrep custom rule: Unsafe Deserialization (CWE-502)
# Target: JSON.parse(userInput) passed directly to dangerous sinks
# Confidence: HIGH
metadata:
  cwe: ["CWE-502"]
  confidence: HIGH
  technology: ["javascript", "nodejs"]
  severity: ERROR

pattern-sources:
  - pattern: |
      $USER_INPUT = req.body.data
      $USER_INPUT = req.query.data
      $USER_INPUT = req.params.data

pattern-sinks:
  - pattern: |
      JSON.parse($USER_INPUT)

confidence: HIGH